[workspace]
members = [
  "crates/norn-api",
  "crates/norn-authz",
  "crates/norn-canonical",
  "crates/norn-cell",
  "crates/norn-checker",
  "crates/norn-checker-wasm",
  "crates/norn-cli",
  "crates/norn-decisions",
  "crates/norn-expr",
  "crates/norn-graph",
  "crates/norn-ir",
  "crates/norn-kernel",
  "crates/norn-projections",
  "crates/norn-skeleton-guard",
  "crates/norn-testkit",
  "vendor/zen/core/types",
  "vendor/zen/core/macros",
  "vendor/zen/core/engine",
  "vendor/zen/core/template",
  "vendor/zen/core/expression"
]
default-members = [
  "crates/norn-api",
  "crates/norn-authz",
  "crates/norn-canonical",
  "crates/norn-cell",
  "crates/norn-checker",
  "crates/norn-checker-wasm",
  "crates/norn-cli",
  "crates/norn-decisions",
  "crates/norn-expr",
  "crates/norn-graph",
  "crates/norn-ir",
  "crates/norn-kernel",
  "crates/norn-projections",
  "crates/norn-skeleton-guard",
  "crates/norn-testkit",
  "vendor/zen/core/types",
  "vendor/zen/core/macros",
  "vendor/zen/core/engine",
  "vendor/zen/core/template",
  "vendor/zen/core/expression"
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]

# ZEN Expression (D19 GO-WITH-FORK, D32, #3404). The zen crate set is vendored
# in this repository at `vendor/zen` as workspace members (provenance:
# zen-pin.json, ledger: zen-fork-ledger.md); the skeleton guard admits only
# these path sources.
# Upstream defaults are off: each consumer enables the Norn profile features
# explicitly.
zen-expression = { path = "vendor/zen/core/expression", default-features = false }
zen-engine = { path = "vendor/zen/core/engine", default-features = false }

# Workspace lint law — see docs/platform/rust-safety-baseline.md.
# Deny tier is the target for kernel crates (norn-ir first). Crates that
# cannot meet a deny lint yet downgrade it locally at the top of lib.rs with
# a TODO(rust-safety) marker; new code must not add violations.
[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_extern_crates = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
bare_urls = "deny"
invalid_rust_codeblocks = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
await_holding_lock = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
as_conversions = "deny"
arithmetic_side_effects = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
large_stack_arrays = "deny"

# Curated clippy::restriction tranche 2. The group as a whole is intentionally
# not enabled: several members contradict clippy::pedantic or each other.
unnecessary_safety_comment = "deny"
map_err_ignore = "deny"
clone_on_ref_ptr = "deny"
string_slice = "deny"
lossy_float_literal = "deny"
float_cmp_const = "deny"
fn_to_numeric_cast_any = "deny"
suspicious_xor_used_as_pow = "deny"
rest_pat_in_fully_bound_structs = "deny"
unneeded_field_pattern = "deny"
empty_drop = "deny"
same_name_method = "deny"
verbose_file_reads = "deny"

# Exhaustiveness, discarded effects, and avoidable allocation/copy/layout costs (#3299).
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
unwrap_in_result = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
redundant_clone = "deny"
unnecessary_to_owned = "deny"
needless_collect = "deny"
or_fun_call = "deny"
format_collect = "deny"
format_push_string = "deny"
inefficient_to_string = "deny"
large_types_passed_by_value = "deny"
needless_pass_by_value = "deny"
large_enum_variant = "deny"
large_futures = "deny"
large_stack_frames = "deny"
box_collection = "deny"
vec_box = "deny"
rc_buffer = "deny"

# Activate the configured deterministic-collection bans only in core crate roots.
disallowed_types = "allow"

# Dev/test builds: line tables only (enough for backtraces with file:line)
# instead of full debuginfo, and none for third-party dependencies. This
# shrinks target dirs and link time. It also means the bundled DuckDB C++ is
# compiled without -g and with NDEBUG (libduckdb-sys derives both from cargo's
# DEBUG env). overflow-checks and debug-assertions keep their dev defaults
# (on); `test` inherits `dev`. For a full-debuginfo session pass
# `--config 'profile.dev.debug=true' --config 'profile.dev.package."*".debug=true'`.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test.package.norn-canonical]
opt-level = 3

# overflow-checks stay on in release: silent wraparound is never acceptable
# in kernel/runtime code, and the perf cost is negligible for this workload.
[profile.release]
overflow-checks = true

# The checker ABI WebAssembly package (crates/norn-checker-wasm,
# scripts/build-pkg.sh): size-optimized, whole-program LTO. Overflow checks
# stay on (inherited from release).
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
