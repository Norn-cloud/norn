[workspace]
resolver = "3"
members = ["crates/welldb-ivm"]
exclude = ["patches/timely", "patches/differential-dataflow", "patches/columnation"]

[workspace.package]
publish = false
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_extern_crates = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
bare_urls = "deny"
invalid_rust_codeblocks = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
await_holding_lock = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
as_conversions = "deny"
arithmetic_side_effects = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
large_stack_arrays = "deny"

# Curated clippy::restriction tranche 2. The group as a whole is intentionally
# not enabled: several members contradict clippy::pedantic or each other.
unnecessary_safety_comment = "deny"
map_err_ignore = "deny"
clone_on_ref_ptr = "deny"
string_slice = "deny"
lossy_float_literal = "deny"
float_cmp_const = "deny"
fn_to_numeric_cast_any = "deny"
suspicious_xor_used_as_pow = "deny"
rest_pat_in_fully_bound_structs = "deny"
unneeded_field_pattern = "deny"
empty_drop = "deny"
same_name_method = "deny"
verbose_file_reads = "deny"

# Exhaustiveness, discarded effects, and avoidable allocation/copy/layout costs (#3299).
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
unwrap_in_result = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
redundant_clone = "deny"
unnecessary_to_owned = "deny"
needless_collect = "deny"
or_fun_call = "deny"
format_collect = "deny"
format_push_string = "deny"
inefficient_to_string = "deny"
large_types_passed_by_value = "deny"
needless_pass_by_value = "deny"
large_enum_variant = "deny"
large_futures = "deny"
large_stack_frames = "deny"
box_collection = "deny"
vec_box = "deny"
rc_buffer = "deny"

# Activate the configured deterministic-collection bans only in core crate roots.
disallowed_types = "allow"

[patch.crates-io]
timely = { path = "patches/timely" }
differential-dataflow = { path = "patches/differential-dataflow" }
columnation = { path = "patches/columnation" }
