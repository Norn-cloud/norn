# Type check of the generated client (run-demo.sh).
[mypy]
ignore_missing_imports = True

# The generator's fixed client template forwards `*args` to httpx2's
# `__exit__`/`__aexit__`, which mypy cannot match to their typed
# parameters (12 `arg-type` errors in openapi-python-client 0.30.0). Only
# that code, only in that module; everything generated from the document is
# checked in full.
[mypy-norn_client.client]
disable_error_code = arg-type
