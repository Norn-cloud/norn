# Dev/test-only DBSP reference oracle for Norn's incremental question (#714).
# Deliberately outside the root workspace: `dbsp` never enters the runtime,
# wasm or root Cargo.lock graph. Run: cargo test --locked --manifest-path tools/ivm-dbsp-oracle/Cargo.toml
[package]
name = "norn-ivm-dbsp-oracle"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace]

# This entire standalone package is test-only. Normal edges let cargo-deny
# audit the complete oracle graph (including DBSP), rather than only the root.
[dependencies]
# Feldera DBSP, MIT OR Apache-2.0.
dbsp = "=0.375.0"
norn-cell = { path = "../../crates/norn-cell" }
norn-checker = { path = "../../crates/norn-checker" }
norn-ir = { path = "../../crates/norn-ir" }
norn-projections = { path = "../../crates/norn-projections" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
proptest = "1.11.0"
serde_json = "1.0.150"
tempfile = "3.27.0"

# rustc 1.98.0 ICEs when code-generating DBSP at opt-level=0. Keep the
# workaround inside this isolated test workspace and this dependency.
[profile.dev.package.dbsp]
opt-level = 1
debug = 0
