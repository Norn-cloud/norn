[project]
name = "norn-py-spike"
version = "0.1.0"
description = "Experimental typed Python symbolic-tracing authoring spike for Norn (#1389 Option B)"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_explicit = false

[tool.ruff]
target-version = "py312"
line-length = 125

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
