# Logs one line per S3 request (`S3 <method> <path?query> <status>`) and
# forwards it unchanged to the bucket server.
global
    log stdout format raw local0

defaults
    mode http
    log global
    timeout connect 5s
    timeout client 300s
    timeout server 300s

frontend s3
    bind :9000
    log-format "S3 %HM %HU %ST"
    default_backend s3

backend s3
    server s3 s3:9000
