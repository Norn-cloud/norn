# The private load balancer (/etc/haproxy/haproxy.cfg on 10.0.0.2): one endpoint for the runners
# and the bastion in front of the three engines. Both sides are TLS from the cluster's private CA
# (README.md, "Transport security"): runners and the bastion verify lb.pem; each engine verifies
# lb-client.pem, and the load balancer verifies each engine's name. Instances that fail /health
# (checked over the same TLS) leave the rotation.
global
    log /dev/log local0
    ssl-default-bind-options ssl-min-ver TLSv1.2
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    mode http
    log global
    timeout connect 5s
    # Node connections and live sockets are long-lived (Rivet asks for 3600 s).
    timeout client 3600s
    timeout server 3600s
    timeout tunnel 3600s

frontend engines
    # lb.pem: SAN lb.rivet.internal and IP 10.0.0.2, with its key.
    bind 10.0.0.2:6420 ssl crt /etc/haproxy/tls/lb.pem
    default_backend engines

backend engines
    balance leastconn
    option httpchk GET /health
    http-check expect status 200
    default-server check inter 2s fall 2 rise 2 ssl verify required ca-file /etc/haproxy/tls/ca.pem crt /etc/haproxy/tls/lb-client.pem
    server engine-1 10.0.0.11:6420 sni str(engine-1.rivet.internal) verifyhost engine-1.rivet.internal
    server engine-2 10.0.0.12:6420 sni str(engine-2.rivet.internal) verifyhost engine-2.rivet.internal
    server engine-3 10.0.0.13:6420 sni str(engine-3.rivet.internal) verifyhost engine-3.rivet.internal
