# TLS in front of one engine, on the engine's own machine (/etc/haproxy/haproxy.cfg on engine-1;
# engine-2 and engine-3 bind their own private address). The engine's guard listens on loopback
# only (`guard.host: 127.0.0.1`), so the admin token never crosses the private network in
# cleartext: the load balancer and the operator bastion reach 6420 over TLS here, and must present
# a client certificate from the cluster's private CA (README.md, "Transport security").
global
    log /dev/log local0
    ssl-default-bind-options ssl-min-ver TLSv1.2
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    mode http
    log global
    timeout connect 5s
    # Node connections and live sockets are long-lived (Rivet asks for 3600 s).
    timeout client 3600s
    timeout server 3600s
    timeout tunnel 3600s

frontend engine_tls
    # engine.pem: this engine's certificate (SAN engine-1.rivet.internal, IP 10.0.0.11) and key.
    # ca.pem: the private CA; a client without a certificate it signed is refused in the handshake.
    bind 10.0.0.11:6420 ssl crt /etc/rivet/tls/engine.pem ca-file /etc/rivet/tls/ca.pem verify required
    default_backend engine

backend engine
    server engine 127.0.0.1:6420
