# One endpoint for runners and the router in front of the three engines: a
# node keeps one long-lived connection to the control plane, and any instance
# serves it. Instances that fail /health leave the rotation.
#
# Engines are found by name through Docker's DNS (127.0.0.11), re-resolved at
# run time: a recreated engine with a new address rejoins without restarting
# HAProxy, and HAProxy starts even while an engine is down (init-addr none).
global
    log stdout format raw local0

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
    hold other 5s
    hold refused 5s
    hold nx 5s
    hold timeout 5s
    hold obsolete 5s

defaults
    mode http
    log global
    timeout connect 5s
    # Node connections and live sockets are long-lived (Rivet asks for 3600 s).
    timeout client 3600s
    timeout server 3600s
    timeout tunnel 3600s

frontend engines
    bind :6420
    default_backend engines

backend engines
    balance leastconn
    option httpchk GET /health
    http-check expect status 200
    default-server check inter 2s fall 2 rise 2 resolvers docker resolve-prefer ipv4 init-addr libc,none
    server engine-1 engine-1:6420
    server engine-2 engine-2:6420
    server engine-3 engine-3:6420
