# One endpoint for runners and the router in front of the three engines: a
# node keeps one long-lived connection to the control plane, and any instance
# serves it. Instances that fail /health leave the rotation.
global
    log stdout format raw local0

defaults
    mode http
    log global
    timeout connect 5s
    # Node connections and live sockets are long-lived (Rivet asks for 3600 s).
    timeout client 3600s
    timeout server 3600s
    timeout tunnel 3600s

frontend engines
    bind :6420
    default_backend engines

backend engines
    balance leastconn
    option httpchk GET /health
    http-check expect status 200
    server engine-1 engine-1:6420 check inter 2s fall 2 rise 2
    server engine-2 engine-2:6420 check inter 2s fall 2 rise 2
    server engine-3 engine-3:6420 check inter 2s fall 2 rise 2
