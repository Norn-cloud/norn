# cargo-deny configuration for the norn Rust workspace.
# Run: cargo deny check
# See docs/platform/rust-safety-baseline.md.

[graph]
all-features = true
# Evaluate the dependency graph only for platforms we ship or develop on. This
# prevents Windows-only dependency edges from widening the policy surface.
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "aarch64-unknown-linux-gnu" },
  { triple = "aarch64-apple-darwin" },
]

[advisories]
version = 2
yanked = "deny"
# RustSec vulnerabilities and unsound advisories are errors by default in v2.

[licenses]
version = 2
# Workspace crate licensing is tracked separately; this check gates dependencies.
private = { ignore = true }
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  # tiny-keccak (transitive through the pinned embedded DuckDB build) uses the
  # permissive CC0 dedication. It contains no copyleft or attribution duty.
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  # borrow-or-share (transitive through jsonschema's `referencing`, used by
  # norn-engine's typed Function call) uses MIT No Attribution: MIT without
  # even the attribution duty, the same no-obligation class as CC0 above.
  "MIT-0",
]
# Copyleft (GPL/LGPL/AGPL/MPL/...) is intentionally absent from the allowlist:
# any dependency carrying it fails `cargo deny check licenses` and must be
# explicitly discussed before an exception is added here.
confidence-threshold = 0.8

[bans]
# Duplicate major versions bloat builds and multiply audit surface; warn for
# now, tighten to deny once the tree is clean.
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies (norn-ir etc.) carry no version; that is fine.
allow-wildcard-paths = true
# SKELETON.md single-owner crates (knowledge/architecture/build-plan-2026-09-09/
# SKELETON.md). `wrappers` lists the only crates allowed to depend on each one
# directly, across the whole graph including transitive and dev edges; the
# direct-edge table itself is enforced by `cargo test -p norn-skeleton-guard`.
deny = [
  { crate = "worker", wrappers = ["norn-cell-do"], reason = "SKELETON.md: workers-rs is confined to the Cloudflare host adapter" },
  { crate = "rusqlite", wrappers = ["norn-cell"], reason = "SKELETON.md: only norn-cell (native test driver) may use rusqlite" },
  { crate = "cedar-policy", wrappers = ["norn-authz"], reason = "SKELETON.md: cedar-policy is confined to norn-authz and is never an expression evaluator" },
  { crate = "zen-engine", wrappers = ["norn-decisions"], reason = "SKELETON.md: the kernel consumes only Norn-owned decision types via norn-decisions" },
  { crate = "zen-expression", wrappers = ["norn-expr", "zen-engine", "zen-tmpl"], reason = "SKELETON.md: norn-expr owns ZEN Expression; zen-engine and its zen-tmpl use it internally" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# No git source is admitted: the zen crate set is vendored at vendor/zen (#3404).
