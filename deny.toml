# cargo-deny configuration for the norn Rust workspace.
# Run: cargo deny check
# See docs/platform/rust-safety-baseline.md.

[graph]
all-features = true
# Evaluate the dependency graph only for platforms we ship or develop on. This
# prevents Windows-only dependency edges from widening the policy surface.
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "aarch64-unknown-linux-gnu" },
  { triple = "aarch64-apple-darwin" },
  # The cell and the checker ship as wasm32, so a dependency or feature that
  # only that target pulls in is under the same policy (GEO-1: `h3o/std`).
  { triple = "wasm32-unknown-unknown" },
]

[advisories]
version = 2
yanked = "deny"
# RustSec vulnerabilities and unsound advisories are errors by default in v2,
# for every crate in the graph.
# Unmaintained advisories fail only for crates a workspace member depends on
# directly: those are ours to replace (#1436 moved norn-expr, norn-cell and the
# vendored zen crate off chrono, chrono-tz and humantime). The same advisory
# reached only through a dependency (arrow via duckdb, cedar-policy-core,
# object_store, serde_with) is upstream's to fix and is not reported.
unmaintained = "workspace"

[licenses]
version = 2
# Workspace crate licensing is tracked separately; this check gates dependencies.
private = { ignore = true }
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  # tiny-keccak (transitive through the pinned embedded DuckDB build) uses the
  # permissive CC0 dedication. It contains no copyleft or attribution duty.
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  # borrow-or-share (transitive through jsonschema's `referencing`, used by
  # norn-engine's typed Function call) uses MIT No Attribution: MIT without
  # even the attribution duty, the same no-obligation class as CC0 above.
  "MIT-0",
  # Owner policy D134 (2026-11-22). BSL-1.0 is the Boost Software License, not
  # the Business Source License; bzip2-1.0.6 is BSD-style. Both are permissive.
  "BSL-1.0",
  "bzip2-1.0.6",
  # MPL-2.0 is file-level copyleft, allowed for dependencies used unmodified.
  # If we ever patch an MPL-licensed file, publish that file's changes under
  # MPL-2.0.
  "MPL-2.0",
]
# Strong copyleft (GPL/LGPL/AGPL/...) and source-available licences (Business
# Source, SSPL, ELv2, FSL) stay absent: any dependency carrying one fails
# `cargo deny check licenses` and needs an owner decision.
confidence-threshold = 0.8

[bans]
# Duplicate major versions bloat builds and multiply audit surface; warn for
# now, tighten to deny once the tree is clean.
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies (norn-ir etc.) carry no version; that is fine.
allow-wildcard-paths = true
# SKELETON.md single-owner crates (knowledge/architecture/build-plan-2026-09-09/
# SKELETON.md). `wrappers` lists the only crates allowed to depend on each one
# directly, across the whole graph including transitive and dev edges; the
# direct-edge table itself is enforced by `cargo test --manifest-path crates/norn-skeleton-guard/Cargo.toml`.
deny = [
  { crate = "worker", wrappers = ["norn-cell-do"], reason = "SKELETON.md: workers-rs is confined to the Cloudflare host adapter" },
  { crate = "rusqlite", wrappers = ["norn-cell"], reason = "SKELETON.md: only norn-cell (native test driver) may use rusqlite" },
# Cedar's own symbolic compiler; used only from norn-authz.
  { crate = "cedar-policy", wrappers = ["norn-authz", "cedar-policy-symcc"], reason = "SKELETON.md: cedar-policy is confined to norn-authz and is never an expression evaluator" },
  { crate = "zen-engine", wrappers = ["norn-decisions"], reason = "SKELETON.md: the kernel consumes only Norn-owned decision types via norn-decisions" },
  { crate = "zen-expression", wrappers = ["norn-expr", "zen-engine", "zen-tmpl"], reason = "SKELETON.md: norn-expr owns ZEN Expression; zen-engine and its zen-tmpl use it internally" },
]
# GEO-1 (Core 07, #191): with `std`, h3o calls the host C library's sin, cos
# and atan2, whose last bit differs between hosts. Without it h3o uses the
# pure-Rust `libm`, so a cell index and a distance replay identically on every
# host. Cargo unifies features across the graph, so one dependant enabling
# `std` would change the answer everywhere.
features = [
  { crate = "h3o", deny = ["std"], reason = "GEO-1: h3o must do its trigonometry in libm, never the host C library" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# No git source is admitted: the zen crate set is vendored at vendor/zen (#3404).
