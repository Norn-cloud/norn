[package]
name = "norn-cell"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "shared cell store with native SQLite adapters (ring 1; see AGENTS.md)"
# #1485 S6: the suites that commit raw are compiled inside the crate
# (src/suites.rs); the integration tests are listed below.
autotests = false

[lib]
path = "src/lib.rs"

# The operator path for a cell its open refuses (#1423).
[[bin]]
name = "norn-cell-restore"
path = "src/bin/norn-cell-restore.rs"
required-features = ["native"]

[[example]]
name = "catalog_demo"
test = true

[[example]]
name = "constitution"
test = true

[[test]]
name = "suites"
path = "tests/suites.rs"

[features]
default = ["native"]
native = ["dep:rusqlite", "dep:object_store", "dep:tokio", "dep:tempfile"]
duckdb = ["dep:duckdb"]
# D136 / D137 (#1533, #1661): the native DataFusion analytical engine. Native
# targets only; its Arrow (59.x) stays inside the adapter, apart from DuckDB's.
datafusion = ["native", "dep:datafusion", "dep:parquet", "dep:csv", "dep:unicode-normalization"]
# Test-only: `engine::FaultEngine` for deterministic fault injection. Enabled
# only through dev-dependencies, never by a production build.
fault-injection = []
# Deterministic commit-path work counters (#1421): harnesses only.
counters = ["norn-ir/counters"]

[dependencies]
ct-merkle = "=0.3.0"
transparency-sha2 = { package = "sha2", version = "0.11" }
# OPEN-CHECKPOINT-1 (#1551 round 4): the open checkpoint's HMAC-SHA256.
hmac = "=0.13.0"
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
norn-checker = { path = "../norn-checker" }
norn-ir = { path = "../norn-ir" }
norn-builtins = { path = "../norn-builtins" }
norn-kernel = { path = "../norn-kernel" }
norn-projections = { path = "../norn-projections" }
# The default host adapter. Bundled SQLite, no default features (no statement
# cache, no wasm32 backend).
rusqlite = { version = "0.41.0", default-features = false, features = ["backup", "bundled", "cache", "hooks"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["raw_value"] }
thiserror = "2.0.20"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
object_store = { version = "0.14.2", default-features = false, features = ["fs"], optional = true }
tokio = { version = "1.53.1", features = ["rt", "sync"], optional = true }

tempfile = { version = "3.27.0", optional = true }
duckdb = { version = "=1.20000.1", default-features = false, features = ["bundled", "json", "parquet"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# D137: the DataFusion adapter's own engine and Parquet I/O. `recursive_protection`
# keeps deep expression trees from overflowing the stack.
datafusion = { version = "=55.3.0", default-features = false, features = ["parquet", "recursive_protection"], optional = true }
parquet = { version = "=59.3.3", default-features = false, features = ["arrow", "snap", "zstd", "lz4", "flate2", "brotli"], optional = true }
csv = { version = "1.4.0", optional = true }
unicode-normalization = { version = "0.1.26", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"

[[example]]
name = "workers_sql"
crate-type = ["cdylib"]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1.11.0"
sha2 = "0.10.9"
jiff = { version = "0.2.37", default-features = false, features = ["std"] }
# Test support only (T6-PSM-1 / T4-CELL-1): the host-agnostic CellHost laws.
norn-testkit = { path = "../norn-testkit" }
# This crate's own tests use the fault-injecting engine.
norn-cell = { path = ".", features = ["fault-injection", "counters"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
