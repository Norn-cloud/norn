[package]
name = "norn-cell"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "shared cell store with native SQLite adapters (ring 1; see AGENTS.md)"

[lib]
path = "src/lib.rs"

[[example]]
name = "catalog_demo"
test = true

[[example]]
name = "constitution"
test = true

[[test]]
name = "duckdb_question"
required-features = ["duckdb", "native"]

[features]
default = ["native"]
native = ["dep:rusqlite", "dep:object_store", "dep:tokio", "dep:tempfile"]
duckdb = ["dep:duckdb"]

[dependencies]
ct-merkle = "=0.3.0"
transparency-sha2 = { package = "sha2", version = "0.11" }
base64 = "0.22.1"
norn-checker = { path = "../norn-checker" }
norn-ir = { path = "../norn-ir" }
norn-builtins = { path = "../norn-builtins" }
norn-kernel = { path = "../norn-kernel" }
norn-projections = { path = "../norn-projections" }
# The default host adapter. Bundled SQLite, no default features (no statement
# cache, no wasm32 backend).
rusqlite = { version = "0.41.0", default-features = false, features = ["bundled", "hooks"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.20"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
object_store = { version = "0.14.2", default-features = false, features = ["fs"], optional = true }
tokio = { version = "1.53.1", features = ["sync"], optional = true }

tempfile = { version = "3.27.0", optional = true }
duckdb = { version = "=1.10506.1", default-features = false, features = ["bundled"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"

[[example]]
name = "workers_sql"
crate-type = ["cdylib"]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1.11.0"
sha2 = "0.10.9"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
# Test support only (T6-PSM-1 / T4-CELL-1): the host-agnostic CellHost laws.
norn-testkit = { path = "../norn-testkit" }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
