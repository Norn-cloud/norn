[package]
name = "norn-authoring-py"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Native Rust Python authoring compiler, AST sandbox, expression lowerer, and formatter embedding Ruff (ring 1; see README.md)"
autotests = false

[lib]
path = "src/lib.rs"

[[test]]
name = "suites"
path = "tests/suites.rs"

[dependencies]
norn-canonical = { path = "../norn-canonical" }
ruff_formatter = "=0.0.23"
ruff_python_ast = "=0.0.23"
ruff_python_formatter = "=0.0.23"
ruff_python_parser = "=0.0.23"
ruff_text_size = "=0.0.23"
thiserror = "2.0.20"

# Safe no-follow, non-blocking opens (openat, O_NOFOLLOW | O_NONBLOCK | O_CLOEXEC)
# for reading Python authoring files without TOCTOU symlink/FIFO windows.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[lints]
workspace = true
