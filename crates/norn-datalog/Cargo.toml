[package]
name = "norn-datalog"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
# Every integration test is a module of tests/suites.rs, one binary
# (scripts/codemods/fold_integration_tests.py).
autotests = false

[[test]]
name = "suites"
path = "tests/suites.rs"

[dependencies]
norn-canonical = { path = "../norn-canonical" }
norn-graph = { path = "../norn-graph" }
norn-ir = { path = "../norn-ir" }
serde = { version = "1.0.228", features = ["derive"] }

[dev-dependencies]
proptest = "1.11.0"
serde_json = "1.0.150"

[lints]
workspace = true
