[package]
name = "norn-host-conformance"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
autotests = false
description = "Native persisted Function and publication correspondence tests"

[[test]]
name = "perform"
path = "tests/perform.rs"

[[test]]
name = "scrap_world"
path = "tests/scrap_world.rs"

[[test]]
name = "publication"
path = "tests/publication.rs"

[dev-dependencies]
norn-metrics = { path = "../norn-metrics" }
norn-cell = { path = "../norn-cell" }
norn-kernel = { path = "../norn-kernel" }
norn-ir = { path = "../norn-ir" }
norn-checker = { path = "../norn-checker" }
norn-authz = { path = "../norn-authz" }
norn-projections = { path = "../norn-projections" }
chrono = { version = "0.4.43", default-features = false, features = ["std"] }
sha2 = "0.10.9"
tempfile = "3"
proptest = "1.11.0"
serde_json = "1.0.150"

[lints]
workspace = true
