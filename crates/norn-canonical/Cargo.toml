[package]
name = "norn-canonical"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
# Every integration test is a module of tests/suites.rs, one binary
# (scripts/codemods/fold_integration_tests.py).
autotests = false

[[test]]
name = "suites"
path = "tests/suites.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["raw_value"] }
sha2 = "0.10.9"
unicode-normalization = "0.1.25"

[features]
# CI-only (#2882): force serde_json's insertion-ordered map so the canonical
# hash goldens run under both map backends (`cedar-policy` turns it on in any
# build that links norn-authz). Never enabled by a dependent crate.
preserve-order-probe = ["serde_json/preserve_order"]
# Deterministic per-thread work counters (`counters` module, #1421). Enabled
# only by test and benchmark harnesses; off in every shipped build.
counters = []

[dev-dependencies]
proptest = "1.11.0"

[lib]
path = "src/lib.rs"

[lints]
workspace = true
