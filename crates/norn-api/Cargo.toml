[package]
name = "norn-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Generated core IR and checker API contracts"

[features]
default = ["http-host"]
http-host = ["dep:axum", "dep:tokio"]

[dependencies]
schemars = { version = "1.2.1", features = ["derive"] }
norn-cell = { path = "../norn-cell", default-features = false }
norn-checker = { path = "../norn-checker" }
norn-kernel = { path = "../norn-kernel" }
http = "1.5.0"
norn-ir = { path = "../norn-ir" }
serde = "1.0.228"
serde_json = "1.0.150"
utoipa = "5.4.0"

[dev-dependencies]
proptest = "1.11.0"
tokio = { version = "1.53.1", features = ["macros", "rt"] }
tower = { version = "0.5.3", features = ["util"] }

[[example]]
name = "fixture-server"
required-features = ["http-host"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8.8", default-features = false, features = ["http1", "json", "query", "tokio"], optional = true }
tokio = { version = "1.53.1", features = ["rt"], optional = true }
norn-cell = { path = "../norn-cell", default-features = false, features = ["native"] }

[lints]
workspace = true
