[package]
name = "norn-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Generated core IR and checker API contracts"

[dependencies]
# Host token verification (HOST-PRINCIPAL, #817): Ed25519 JWTs, pure Rust, wasm32-clean.
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std"] }
schemars = { version = "1.2.1", features = ["derive"] }
# The `norn.decision@1` request a flow's ask step parks (DECISIONS-1).
norn-builtins = { path = "../norn-builtins" }
norn-cell = { path = "../norn-cell", default-features = false }
norn-checker = { path = "../norn-checker" }
norn-kernel = { path = "../norn-kernel" }
http = "1.5.0"
norn-ir = { path = "../norn-ir" }
serde = "1.0.228"
serde_json = "1.0.150"
utoipa = "6.0.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
norn-cell = { path = "../norn-cell", default-features = false, features = ["native"] }

[dev-dependencies]
tempfile = "3.27.0"
jsonschema = { version = "=0.47.0", default-features = false }
proptest = "1.11.0"

[lints]
workspace = true
