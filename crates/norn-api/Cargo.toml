[package]
name = "norn-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Generated core IR and checker API contracts"
# Every integration test is a module of tests/suites.rs, one binary
# (scripts/codemods/fold_integration_tests.py).
autotests = false

[[test]]
name = "suites"
path = "tests/suites.rs"

[dependencies]
# Host token verification (HOST-PRINCIPAL, #817): Ed25519 JWTs, pure Rust, wasm32-clean.
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std"] }
# RFC 3339 times of source sync reports and SigV4 stamps, from the host-supplied
# millisecond clock (never jiff's own clock: clippy.toml bans it).
jiff = { version = "0.2.37", default-features = false, features = ["std"] }
schemars = { version = "1.2.1", features = ["derive"] }
norn-cell = { path = "../norn-cell", default-features = false }
norn-checker = { path = "../norn-checker" }
norn-ui-checker = { path = "../norn-ui-checker" }
norn-kernel = { path = "../norn-kernel" }
http = "1.5.0"
norn-ir = { path = "../norn-ir" }
serde = "1.0.228"
serde_json = "1.0.150"
# Upload digests and SigV4 request signing.
sha2 = "0.10.9"
# SYNC-URL-1: base URLs parsed as the host's `fetch` parses them (WHATWG).
url = { version = "2.5.8", default-features = false, features = ["std"] }
utoipa = "6.0.0"

# Native SQLite for this crate's own tests only: a host links the cell engine
# it brings (NativeEngine, the Durable Object's, or Rivet's).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
norn-cell = { path = "../norn-cell", default-features = false, features = ["native"] }

[dev-dependencies]
tempfile = "3.27.0"
jsonschema = { version = "=0.47.0", default-features = false }
proptest = "1.11.0"

[lints]
workspace = true
