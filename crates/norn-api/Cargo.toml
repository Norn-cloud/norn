[package]
name = "norn-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Generated core IR and checker API contracts"

[features]
default = ["native", "http-host"]
http-host = ["dep:axum"]
native = ["norn-cell/native"]

[dependencies]
axum = { version = "0.8.8", default-features = false, features = ["http1", "json", "query", "tokio"], optional = true }
norn-cell = { path = "../norn-cell", default-features = false }
norn-checker = { path = "../norn-checker" }
norn-kernel = { path = "../norn-kernel" }
http = "1.5.0"
norn-ir = { path = "../norn-ir" }
serde = "1.0.228"
serde_json = "1.0.150"
utoipa = "5.4.0"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt"] }
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
