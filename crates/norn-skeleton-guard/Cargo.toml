[package]
name = "norn-skeleton-guard"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Test-only guard enforcing the SKELETON.md crate boundaries (P0-SKEL-2)"

[lib]
path = "src/lib.rs"

# Test/CI-only tooling: no Norn crate may depend on this crate (the guard
# itself asserts that). It reads `cargo metadata` and parses sources, so it is
# intentionally outside the ring model.
[dependencies]
cargo_metadata = "0.23.1"
syn = { version = "2.0.119", default-features = false, features = ["full", "parsing", "visit"] }
# Tokenizes gated sources (`ci::gate_source_errors`); already in the lock through `syn`.
proc-macro2 = { version = "1.0.107", default-features = false }
walkdir = "2.5.0"
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
# Parses Cargo.lock for the zen lock pin (`check_zen_lock`).
toml = "0.9.12"
# CI gate runner (`cargo xtask ci`, #3472): argument parsing, workflow YAML
# as plain data, run-line/condition patterns, step digests, JUnit reports.
clap = { version = "4.6.7", features = ["derive"] }
yaml-rust2 = { version = "0.13.0", default-features = false }
sha2 = "0.10.9"
hex = "0.4.3"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "xtask"
path = "src/bin/xtask.rs"

# The guard is its own Cargo workspace (D95, #513): its build closure is this directory,
# which is a gate (`GATE_DIRECTORIES`), with its own `Cargo.lock`. The root manifest and
# lockfile do not reach the trusted lane's binary, so they stay ordinary files. Lints and
# the dev profile are written out here instead of inherited from the root workspace.
[workspace]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_extern_crates = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
bare_urls = "deny"
invalid_rust_codeblocks = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
await_holding_lock = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
as_conversions = "deny"
arithmetic_side_effects = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
large_stack_arrays = "deny"

# Curated clippy::restriction tranche 2. The group as a whole is intentionally
# not enabled: several members contradict clippy::pedantic or each other.
unnecessary_safety_comment = "deny"
map_err_ignore = "deny"
clone_on_ref_ptr = "deny"
string_slice = "deny"
lossy_float_literal = "deny"
float_cmp_const = "deny"
fn_to_numeric_cast_any = "deny"
suspicious_xor_used_as_pow = "deny"
rest_pat_in_fully_bound_structs = "deny"
unneeded_field_pattern = "deny"
empty_drop = "deny"
same_name_method = "deny"
verbose_file_reads = "deny"

# Exhaustiveness, discarded effects, and avoidable allocation/copy/layout costs (#3299).
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
unwrap_in_result = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
redundant_clone = "deny"
unnecessary_to_owned = "deny"
needless_collect = "deny"
or_fun_call = "deny"
format_collect = "deny"
format_push_string = "deny"
inefficient_to_string = "deny"
large_types_passed_by_value = "deny"
needless_pass_by_value = "deny"
large_enum_variant = "deny"
large_futures = "deny"
large_stack_frames = "deny"
box_collection = "deny"
vec_box = "deny"
rc_buffer = "deny"

# Activate the configured deterministic-collection bans only in core crate roots.
disallowed_types = "allow"

# Dev/test builds: line tables only (enough for backtraces with file:line)
# instead of full debuginfo, and none for third-party dependencies. This
# shrinks target dirs and link time. It also means the bundled DuckDB C++ is
# compiled without -g and with NDEBUG (libduckdb-sys derives both from cargo's
# DEBUG env). overflow-checks and debug-assertions keep their dev defaults
# (on); `test` inherits `dev`. For a full-debuginfo session pass
# `--config 'profile.dev.debug=true' --config 'profile.dev.package."*".debug=true'`.

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
