[package]
name = "norn-expr-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "the ZEN engine alone as a WASM package: the checker ABI's evaluateExpression over norn-expr (D105; see AGENTS.md)"

[lib]
path = "src/lib.rs"

[dependencies]
norn-expr = { path = "../norn-expr" }
norn-ir = { path = "../norn-ir" }
serde_json = "1.0.150"

# Exact pin, the same as norn-checker-wasm: the wasm-bindgen CLI that post-processes the module must
# be this version (scripts/build-pkg.sh).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "=0.2.129", optional = true }

[features]
# The JS binding of this package's own build (scripts/build-pkg.sh). norn-checker-wasm links the
# crate without it and exports the same function under the same name itself.
bindings = ["dep:wasm-bindgen"]

[lints]
workspace = true
