[package]
name = "norn-checker"
version = "0.2.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "shared contract/lifecycle diagnostics (ring 0; see AGENTS.md)"
# Every integration test is a module of tests/suites.rs, one binary
# (scripts/codemods/fold_integration_tests.py).
autotests = false

[lib]
path = "src/lib.rs"

[[test]]
name = "suites"
path = "tests/suites.rs"

[features]
native-proof-driver = []

[[bin]]
name = "norn-proof-quint"
path = "src/bin/norn-proof-quint.rs"
required-features = ["native-proof-driver"]

[[example]]
name = "jewelry_demo"
test = true

[dependencies]
ascent = { workspace = true }
# Unicode NFC/NFKC for identity-key normalization (#2848); the edge is in
# SKELETON.md (`norn-checker ← ir, expr, canonical`).
norn-canonical = { path = "../norn-canonical" }
# Terminating stratified Datalog red-team checks (`RED-TEAM-1`).
norn-datalog = { path = "../norn-datalog" }
norn-expr = { path = "../norn-expr" }
# Metered conservative law closure (#3332); admitted graph edge in SKELETON 2026-10-13.
norn-graph = { path = "../norn-graph" }
norn-ir = { path = "../norn-ir" }
# The ZEN Expression pure/wasm32 profile's regex engine (norn-expr pins
# zen-expression to `regex-lite`), so `pattern` constraints are checked in the
# dialect rules and runtime evaluate them in (SKELETON.md 2026-09-27 amendment).
regex-lite = "0.1.9"
serde_json = "1.0.150"
# Exact import-field paths; already locked, no-std/alloc, synchronous and sans-IO.
serde_path_to_error = "=0.1.20"
sha2 = "0.10.9"

[build-dependencies]
# Fixed shared AST admission and build-time Ascent projection for core admission
# checks; runtime `norn-datalog::evaluate` is used only for opt-in advisory
# `RED-TEAM-1` checks (`red_team::analyze_red_team`).
norn-datalog = { path = "../norn-datalog" }
# Maintained Rust token generation; already present transitively in the workspace.
quote = "1.0"
regex-lite = "0.1.9"
serde_json = "1.0.150"

[dev-dependencies]
# Pinned OSI-schema round-trip validation only; reuses workspace 0.47.0.
jsonschema = { version = "=0.47.0", default-features = false }
proptest = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }

[lints]
workspace = true
