[package]
name = "norn-expr"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "ZEN Expression type environment + static checker (ring 0; see AGENTS.md)"
# Every integration test is a module of tests/suites.rs, one binary
# (scripts/codemods/fold_integration_tests.py).
autotests = false

[lib]
path = "src/lib.rs"

[[test]]
name = "suites"
path = "tests/suites.rs"

[dependencies]
# Pure calendar/RFC 3339 arithmetic, and the TZif reader for Norn's versioned
# offline IANA tzdb bundles (`data/tzdb/*.tzdb`, never the host's zoneinfo or
# runtime `jiff-tzdb`). No clock or locale is consulted.
jiff = { version = "=0.2.37", default-features = false, features = ["std"] }
# EntityIR v2 types the type environment is derived from, and the Norn1
# canonical form (re-exported) it is content-addressed with.
norn-ir = { path = "../norn-ir" }
# The vendored zen crate set (vendor/zen, #3404) has no features: the Norn
# profile (regex-lite, strict errors, ordered maps, pure temporal values,
# metering, bounded strings) is its only behaviour.
zen-expression = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
proptest = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
