[package]
name = "norn-metrics"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Bounded ontology-bound analytical tables"

[dependencies]
schemars = { version = "1.2.1", features = ["derive"] }
norn-ir = { path = "../norn-ir" }
norn-checker = { path = "../norn-checker" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.20"
statrs = { version = "=0.18.0", default-features = false }

[dev-dependencies]
proptest = "1.11.0"

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31.3", features = ["resource"] }
