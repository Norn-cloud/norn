[package]
name = "norn-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Core checker and schema command line"

[[bin]]
name = "norn"
path = "src/main.rs"

[dependencies]
norn-ir = { path = "../norn-ir" }
norn-expr = { path = "../norn-expr" }
norn-decisions = { path = "../norn-decisions" }
norn-api = { path = "../norn-api" }
norn-checker-wasm = { path = "../norn-checker-wasm" }
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.150"

[lints]
workspace = true
