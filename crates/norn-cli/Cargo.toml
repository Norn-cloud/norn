[package]
name = "norn-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Core checker and schema command line"

[[bin]]
name = "norn"
path = "src/main.rs"

[dependencies]
norn-ir = { path = "../norn-ir" }
norn-expr = { path = "../norn-expr" }
norn-decisions = { path = "../norn-decisions" }
norn-api = { path = "../norn-api" }
norn-checker-wasm = { path = "../norn-checker-wasm" }
serde = { version = "1.0.228", features = ["derive"] }
schemars = { version = "1.2.1", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.150"

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "=3.4.0", default-features = false, features = ["rustls"] }
sse-stream = "0.2.6"
bytes = "1.12.1"
futures-util = "0.3.34"
tokio = { version = "1.53.1", default-features = false, features = ["rt"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

[[example]]
name = "mcp_workers"
crate-type = ["cdylib"]
