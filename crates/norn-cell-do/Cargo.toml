[package]
name = "norn-cell-do"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "one tenant cell per Workers Durable Object over the shared read services (ring 1; see AGENTS.md)"
# Every integration test is a module of tests/suites.rs, one binary
# (scripts/codemods/fold_integration_tests.py).
autotests = false

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "norn-dev-host"
path = "src/bin/norn-dev-host.rs"
required-features = ["native"]

# The tenant analytics engine next to the cell host (D102).
[[bin]]
name = "norn-olapd"
path = "src/bin/norn-olapd.rs"
required-features = ["duckdb"]

[[test]]
name = "suites"
path = "tests/suites.rs"

[dependencies]
norn-api = { path = "../norn-api" }
norn-cell = { path = "../norn-cell", default-features = false }
norn-checker = { path = "../norn-checker" }
norn-ui-checker = { path = "../norn-ui-checker" }
norn-ir = { path = "../norn-ir" }
# The kernel PDP and the Cedar schema projected from the cell model decide data reads.
norn-kernel = { path = "../norn-kernel" }
norn-projections = { path = "../norn-projections" }
# Query-string decoding for the fetch dispatch.
# Reads a host token's key id to rate-limit JWKS refetches; never trusts it.
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
form_urlencoded = "1.2.2"
http = "1.5.0"
# Percent-decodes object path segments.
percent-encoding = "2.3.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

# `norn-dev-host` (#207): the native developer loop over a project's SQLite cell.
# Behind the default `native` feature: a host that brings its own SQLite (the
# Rivet host, crates/norn-cell-rivet) builds this crate without it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
norn-cell = { path = "../norn-cell", default-features = false, features = ["native"], optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }
# The per-session dev token and lineage handle key.
getrandom = "0.3.4"
# `norn-olapd` reads a dataset from the presigned URL the cell minted; the
# connection egress client (`connections::egress`) sends every outbound
# connector call through it, pinned to the address it resolved and checked.
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"] }
# Connection vault (`connections::vault`): per-cell DEKs wrapped by the host
# KEK, credentials sealed with AES-256-GCM. No `getrandom` feature: nonces
# and keys come from the `getrandom` dependency above.
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc"] }
# OAuth 2.0 authorization code + PKCE S256 (`connections::oauth`), sent
# through the egress client; none of its bundled HTTP clients.
oauth2 = { version = "=5.0.0", default-features = false }
# OAuth state digests (`connections::service`).
sha2 = "0.10.9"
# Wipes owned key and credential buffers in a way the optimizer keeps
# (VAULT-WIPE-1).
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }
# EGRESS-QUIET-1: caps the `log` facade at `info` in every build of this
# crate, so ureq's debug and trace records (request lines, wire rows with
# headers) are compiled out and no logger can turn them on.
log = { version = "0.4.33", default-features = false, features = ["max_level_info", "release_max_level_info"] }
# Egress URL checks, parsed as the host `fetch` parses them.
url = { version = "2.5.8", default-features = false, features = ["std"] }

# O_NOFOLLOW for the owner-only session files.
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.189", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# The request-layer fault simulator (tests/faults.rs) drives the server over
# norn-cell's test-only fault-injecting Durable Object engine.
norn-cell = { path = "../norn-cell", default-features = false, features = ["native", "fault-injection"] }
tempfile = "3.27.0"
# Drives the export and restore of a cell in the approval recovery tests.
tokio = { version = "1.53.1", features = ["rt"] }
# Signs host tokens in the native correspondence tests.
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std"] }

[features]
default = ["native"]
# Native SQLite (`norn_cell::engine::NativeEngine`) and the dev host over it.
# No effect on wasm32, where these dependencies do not exist.
native = ["dep:norn-cell", "dep:clap", "dep:libc"]
# Local smoke builds only: lets the Worker accept fixture principals.
fixtures = []
# `norn-dev-host` answers questions DuckDB can lower on DuckDB (QUERY-ENGINE-1)
# and falls back to the native exact engine. Opt-in: it builds bundled DuckDB.
duckdb = ["norn-cell/duckdb"]

[lints]
workspace = true
