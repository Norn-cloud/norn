[package]
name = "norn-cell-do"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "one tenant cell per Workers Durable Object over the shared read services (ring 1; see AGENTS.md)"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "norn-dev-host"
path = "src/bin/norn-dev-host.rs"

[dependencies]
norn-api = { path = "../norn-api" }
norn-cell = { path = "../norn-cell", default-features = false }
norn-checker = { path = "../norn-checker" }
norn-ir = { path = "../norn-ir" }
# The kernel PDP and the Cedar schema projected from the cell model decide data reads.
norn-kernel = { path = "../norn-kernel" }
norn-projections = { path = "../norn-projections" }
# Query-string decoding for the fetch dispatch.
# Reads a host token's key id to rate-limit JWKS refetches; never trusts it.
base64 = "0.23.1"
form_urlencoded = "1.2.2"
http = "1.5.0"
# Percent-decodes object path segments.
percent-encoding = "2.3.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

# `norn-dev-host` (#207): the native developer loop over a project's SQLite cell.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
norn-cell = { path = "../norn-cell", default-features = false, features = ["native"] }
clap = { version = "4.6.7", features = ["derive"] }
# The per-session dev token and lineage handle key.
getrandom = "0.3.4"

# O_NOFOLLOW for the owner-only session files.
[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# The request-layer fault simulator (tests/faults.rs) drives the server over
# norn-cell's test-only fault-injecting Durable Object engine.
norn-cell = { path = "../norn-cell", default-features = false, features = ["native", "fault-injection"] }
tempfile = "3.27.0"
# Signs host tokens in the native correspondence tests.
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std"] }

[features]
# Local smoke builds only: lets the Worker accept fixture principals.
fixtures = []

[lints]
workspace = true
