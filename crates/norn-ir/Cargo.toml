[package]
name = "norn-ir"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
norn-canonical = { path = "../norn-canonical" }
schemars = { version = "1.2.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
# Exact runtime values (#2770): the expression engine's decimal (96-bit,
# scale <= 28) and serde_json raw values, so decimals cross JSON as exact
# number tokens without `arbitrary_precision` (D37).
rust_decimal = { version = "1.43.0", default-features = false }
serde_json = { version = "1.0.150", features = ["raw_value"] }

[lints]
workspace = true

[dev-dependencies]
proptest = "1.11.0"
serde_json = "1.0.150"
sha2 = "0.10.9"
