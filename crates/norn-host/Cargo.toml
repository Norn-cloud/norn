[package]
name = "norn-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Native host perimeter for the Norn pure core"

[dependencies]
norn-ir = { path = "../norn-ir" }
norn-cell = { path = "../norn-cell" }
norn-kernel = { path = "../norn-kernel" }
axum = { version = "0.8.9", default-features = false, features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
utoipa = "5.4.0"

[dev-dependencies]
serde_json = "1.0.150"

[lints]
workspace = true
