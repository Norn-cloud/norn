[package]
name = "norn-builtins"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Norn-owned host built-in Functions and their pinned registry (ring 0; FUNCTION-HOST-1, #761)"

[lib]
path = "src/lib.rs"

[dependencies]
# GEO-1 (Core 07, #191): the three crates the geo functions are built on, each
# pinned to one exact version so a change of any of them changes this crate's
# HOST-TREE-1 pin. `h3o` without `std` does its trigonometry in the pure-Rust
# `libm`, never the host's C library (deny.toml bans its `std` feature); `geo`
# without its defaults has no rayon, triangulation or PROJ; `geojson` converts
# to `geo` types and nothing else.
geo = { version = "=0.33.1", default-features = false }
geojson = { version = "=1.0.0", default-features = false, features = ["geo-types"] }
h3o = { version = "=0.11.1", default-features = false }
norn-ir = { path = "../norn-ir" }
norn-kernel = { path = "../norn-kernel" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

# BUILTIN-PIN-1: build.rs recomputes the source-tree digest with the one
# HOST-TREE-1 implementation and fails the build on a stale pin.
[build-dependencies]
norn-ir = { path = "../norn-ir" }
serde_json = "1.0.150"

[dev-dependencies]
norn-testkit = { path = "../norn-testkit" }

[lints]
workspace = true
