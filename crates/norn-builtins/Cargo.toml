[package]
name = "norn-builtins"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Norn-owned host built-in Functions and their pinned registry (ring 0; FUNCTION-HOST-1, #761)"
# Every integration test is a module of tests/suites.rs, one binary
# (scripts/codemods/fold_integration_tests.py).
autotests = false

[lib]
path = "src/lib.rs"

[[test]]
name = "suites"
path = "tests/suites.rs"

[dependencies]
# GEO-1 (Core 07, #191): the two crates the geo functions are built on, each
# pinned to one exact version so a change of either changes this crate's
# HOST-TREE-1 pin. `h3o` without `std` does its trigonometry in the pure-Rust
# `libm`, never the host's C library (deny.toml bans its `std` feature). `geo`
# without its defaults has no rayon, triangulation or PROJ, and only its
# exact orientation predicate, winding order and point-in-ring test are used.
geo = { version = "=0.33.1", default-features = false }
h3o = { version = "=0.11.1", default-features = false }
norn-ir = { path = "../norn-ir" }
norn-kernel = { path = "../norn-kernel" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

# BUILTIN-PIN-1: build.rs recomputes the source-tree digest with the one
# HOST-TREE-1 implementation and fails the build on a stale pin.
[build-dependencies]
norn-ir = { path = "../norn-ir" }
serde_json = "1.0.150"

[dev-dependencies]
norn-testkit = { path = "../norn-testkit" }

[lints]
workspace = true
