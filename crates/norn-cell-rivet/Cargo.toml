# The Rivet host is its own workspace (D131, #1130): Rivet's embedded SQLite
# (sqlite-embedded 3.1.1) links libsqlite3-sys 0.30 and norn-cell's native
# engine links 0.39 (rusqlite 0.41). Cargo allows one `links = "sqlite3"` per
# resolve, so the two cannot share the root lockfile. This crate builds
# norn-cell, norn-api and norn-cell-do without native SQLite, as the Durable
# Object host does (enabling it here fails to resolve), and pins RivetKit
# exactly.
[workspace]
members = ["."]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

# The root workspace's patches, so Norn crates build here exactly as there.
[patch.crates-io]
ascent = { path = "../../third_party/ascent/ascent" }
ascent_macro = { path = "../../third_party/ascent/ascent_macro" }

[package]
name = "norn-cell-rivet"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "one tenant cell per Rivet actor on Rivet's embedded SQLite (ring 1; D131)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "norn-cell-rivet"
path = "src/bin/norn-cell-rivet.rs"

[dependencies]
norn-api = { path = "../norn-api" }
norn-cell = { path = "../norn-cell", default-features = false }
norn-cell-do = { path = "../norn-cell-do", default-features = false }
# RivetKit's Rust SDK with SQLite in this process (one round trip per commit).
rivetkit = { version = "=3.1.1", default-features = false, features = ["sqlite-local"] }
# The protocol types of the actor's persisted SQLite pages, read back by the
# conformance page digest only (the version RivetKit itself pins).
rivet-envoy-protocol = { version = "=3.1.1", optional = true }
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "tokio", "ws", "query"] }
base64 = "0.22.1"
bytes = "1.11.0"
futures = "0.3.31"
http = "1.3.1"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-tungstenite = { version = "0.26.2", default-features = false }
tokio-util = "0.7.16"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt", "env-filter", "ansi"] }
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
# Signs host tokens in the router gate tests (tests/router_gate.rs).
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std"] }
# Drives the WebSocket handshake in the router gate tests over a plain TCP
# stream (no TLS): the test opens the socket itself, so only `handshake` is
# needed on top of the host's own tokio-tungstenite dependency.
tokio-tungstenite = { version = "0.26.2", default-features = false, features = ["handshake"] }
# `test-util` enables `tokio::time::pause` / `advance` / `resume`, which
# the cold-start JWKS backoff test uses to prove the real cooldown elapses
# without sleeping.
tokio = { version = "1.48.0", features = ["test-util"] }

[features]
# Local smoke and test builds only: fixture principals (norn-cell-do's
# `fixtures`), served only on a smoke or test stage.
fixtures = ["norn-cell-do/fixtures"]
# The host conformance seams (apps/norn-cell-do/conformance): a fixed request
# clock, holds inside a commit's transaction, the verified head and the probe
# actor. Served only when NORN_STAGE=test and NORN_CONFORMANCE=synthetic.
conformance = ["fixtures", "dep:rivet-envoy-protocol"]

[lints]
workspace = true

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_extern_crates = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
bare_urls = "deny"
invalid_rust_codeblocks = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
await_holding_lock = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
as_conversions = "deny"
arithmetic_side_effects = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
large_stack_arrays = "deny"

# Curated clippy::restriction tranche 2. The group as a whole is intentionally
# not enabled: several members contradict clippy::pedantic or each other.
unnecessary_safety_comment = "deny"
map_err_ignore = "deny"
clone_on_ref_ptr = "deny"
string_slice = "deny"
lossy_float_literal = "deny"
float_cmp_const = "deny"
fn_to_numeric_cast_any = "deny"
suspicious_xor_used_as_pow = "deny"
rest_pat_in_fully_bound_structs = "deny"
unneeded_field_pattern = "deny"
empty_drop = "deny"
same_name_method = "deny"
verbose_file_reads = "deny"

# Exhaustiveness, discarded effects, and avoidable allocation/copy/layout costs (#3299).
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
unwrap_in_result = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
redundant_clone = "deny"
unnecessary_to_owned = "deny"
needless_collect = "deny"
or_fun_call = "deny"
format_collect = "deny"
format_push_string = "deny"
inefficient_to_string = "deny"
large_types_passed_by_value = "deny"
needless_pass_by_value = "deny"
large_enum_variant = "deny"
large_futures = "deny"
large_stack_frames = "deny"
box_collection = "deny"
vec_box = "deny"
rc_buffer = "deny"

# Activate the configured deterministic-collection bans only in core crate roots.
disallowed_types = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
overflow-checks = true
