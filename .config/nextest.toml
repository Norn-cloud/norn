experimental = ["setup-scripts", "wrapper-scripts"]

# Pinned gate file: CI runs the `ci` profile and ignores any default filter.
[profile.ci]
fail-fast = false
retries = 0
slow-timeout = { period = "120s" }

[profile.ci.junit]
path = "junit.xml"

# Start the known-slow tail tests (>= 50s in Boat CI) first so they run alongside
# the rest of their shard instead of straggling solo at the end (#1951).
[[profile.ci.overrides]]
filter = '''
  test(=provision::a_fault_anywhere_in_provisioning_leaves_nothing_half_made) |
  test(=pull_cursor_atomicity_quint::tests::sqlite_state_machine_preserves_all_pull_cursor_atomicity_invariants) |
  test(=mapping_links::obs_page_equiv_pages_equal_one_by_one) |
  test(=suites::definitions_install::data_quarantine_redelivery_persists_one_finding_and_correction_recovers) |
  test(=suites::definitions_install::obs_recovery_upgrade_uses_each_findings_retained_model) |
  test(=pull_rest::mapping_edits_racing_loads_never_commit_a_mixed_snapshot) |
  test(=suites::definitions_install::mapping_bundle_processing_replay_has_one_bundle_and_finding) |
  test(=suites::definitions_install::feed_conflict_replay_preserves_first_capture_and_one_finding) |
  test(=suites::scrap_yield_incremental::generated_changes_match_recompute_through_reorder_duplicate_and_restart) |
  test(=tenant_isolation::another_tenants_principal_at_b_learns_nothing) |
  test(=retail_truth_slice::s1_read_only_combined_management_view_across_two_cells) |
  test(=suites::definitions_install::obs_evidence_redelivery_persists_one_law_finding_after_restart) |
  test(=source_freshness::tests::empty_polls_over_4096_after_rebind_preserve_pinned_trace_and_reject_stale) |
  test(=suites::restatement_activation::activated_deltas_equal_full_recompute_through_redelivery_and_restart) |
  test(=mapping_links::obs_link_narrowed_plans_equal_wide_plans) |
  test(=dataset_laws::the_fuel_bound_pays_the_typed_property_charge)
'''
priority = 100

[scripts.wrapper.retained-invariant-evidence]
command = { command-line = ["env"], env = { PROPTEST_RNG_SEED = "21320261103", PROPTEST_RNG_ALGORITHM = "cc", PROPTEST_CASES = "256" } }

[profile.drop-11]
default-filter = '''binary_id(norn-kernel::suites) & (
  test(=invariant_commit::law_invariant_runtime_valid_response_admits) |
  test(=invariant_commit::law_invariant_runtime_violation_refuses_atomically_with_the_retained_law_pin) |
  test(=invariant_commit::law_invariant_runtime_other_responses_still_refuse_before_activation) |
  test(=invariant_commit::law_invariant_runtime_misbound_missing_and_negated_references_refuse) |
  test(=invariant_commit::law_invariant_runtime_resolves_the_retained_subjects_interface_member) |
  test(=invariant_commit::law_invariant_runtime_exhausted_budget_refuses) |
  test(=invariant_commit::law_invariant_runtime_decision_and_action_refusals_journal_and_consume) |
  test(=invariant_commit::law_invariant_runtime_missing_or_ambiguous_members_do_not_verify_a_pin) |
  test(=invariant_commit::law_invariant_runtime_matches_the_existing_evaluator) |
  test(=invariant_commit::law_interface_transitive_and_diamond_implementors_govern_once_with_the_interface_pin) |
  test(=invariant_commit::law_interface_mixed_scopes_and_misowned_invariants_refuse) |
  test(=invariant_commit::law_interface_runtime_matches_the_shared_evaluator_for_implementors))'''

[[profile.drop-11.scripts]]
filter = "all()"
run-wrapper = "retained-invariant-evidence"

[scripts.setup.authored-profile]
command = ["bun", "tools/norn-ts/src/cli.ts", "profile", "scripts/demo/jewelry.source.ts"]

[scripts.setup.jewelry-authoring]
command = { command-line = ["bun", "test", "tools/norn-ts/test/jewelry-demo.test.ts"], env = { NORN_UPDATE_JEWELRY_GOLDEN = "" } }

[scripts.setup.fold-authoring]
command = ["bun", "test", "tools/norn-ts/test/authoring-sdk.test.ts", "--test-name-pattern", "CP3 allocation goldens come from core-aligned typed declarations"]

[scripts.setup.rate-authoring]
command = ["bun", "test", "tools/norn-ts/test/rate.test.ts", "--timeout", "60000"]

[scripts.setup.pack-authoring]
command = { command-line = ["bun", "test", "tools/norn-ts/test/registry-packs.test.ts", "--test-name-pattern", "registry packs are generated from their typed sources"], env = { NORN_PACKS_UPDATE = "" } }

[scripts.setup.constitution-authoring]
command = { command-line = ["bun", "test", "tools/norn-ts/test/constitution.test.ts", "--timeout", "60000"], env = { NORN_UPDATE_CONSTITUTION_GOLDEN = "" } }

[scripts.wrapper.sampled-evidence]
command = { command-line = ["env"], env = { PROPTEST_RNG_SEED = "21320261103", PROPTEST_RNG_ALGORITHM = "cc" } }

[scripts.wrapper.quarantine-evidence]
command = { command-line = ["env"], env = { PROPTEST_RNG_SEED = "21320261103", PROPTEST_RNG_ALGORITHM = "cc", PROPTEST_CASES = "16" } }

[scripts.setup.kani-068-install]
command = ["cargo", "install", "--locked", "--root", "target/demo-kani-0.68", "kani-verifier", "--version", "=0.68.0"]

[scripts.setup.kani-068-setup]
command = ["target/demo-kani-0.68/bin/kani", "setup"]
slow-timeout = { period = "300s", terminate-after = 2 }

[scripts.setup.decimal-kani-0]
command = ["target/demo-kani-0.68/bin/kani", "verification/canonical-values-v1/decimal_kani.rs", "--harness", "canonical_decimal_preserves_bounded_values", "--output-format", "terse"]
slow-timeout = { period = "300s", terminate-after = 1 }

[scripts.setup.decimal-kani-1]
command = ["target/demo-kani-0.68/bin/kani", "verification/canonical-values-v1/decimal_kani.rs", "--harness", "decimal_scale_multiplier_is_exact_in_bounded_profile", "--output-format", "terse"]
slow-timeout = { period = "300s", terminate-after = 1 }

[scripts.setup.decimal-kani-2]
command = ["target/demo-kani-0.68/bin/kani", "verification/canonical-values-v1/decimal_kani.rs", "--harness", "decimal_scale_overflow_refuses", "--output-format", "terse"]
slow-timeout = { period = "300s", terminate-after = 1 }

