experimental = ["setup-scripts", "wrapper-scripts"]

# Pinned gate file: CI runs the `ci` profile and ignores any default filter.
[profile.ci]
fail-fast = false
retries = 0
slow-timeout = { period = "120s" }

[profile.ci.junit]
path = "junit.xml"

[scripts.wrapper.retained-invariant-evidence]
command = { command-line = ["env"], env = { PROPTEST_RNG_SEED = "21320261103", PROPTEST_RNG_ALGORITHM = "cc", PROPTEST_CASES = "256" } }

[profile.drop-11]
default-filter = '''binary_id(norn-kernel::invariant_commit) & (
  test(=law_invariant_runtime_valid_response_admits) |
  test(=law_invariant_runtime_violation_refuses_atomically_with_the_retained_law_pin) |
  test(=law_invariant_runtime_other_responses_still_refuse_before_activation) |
  test(=law_invariant_runtime_misbound_missing_and_negated_references_refuse) |
  test(=law_invariant_runtime_resolves_the_retained_subjects_interface_member) |
  test(=law_invariant_runtime_exhausted_budget_refuses) |
  test(=law_invariant_runtime_decision_and_action_refusals_journal_and_consume) |
  test(=law_invariant_runtime_missing_or_ambiguous_members_do_not_verify_a_pin) |
  test(=law_invariant_runtime_matches_the_existing_evaluator) |
  test(=law_interface_transitive_and_diamond_implementors_govern_once_with_the_interface_pin) |
  test(=law_interface_mixed_scopes_and_misowned_invariants_refuse) |
  test(=law_interface_runtime_matches_the_shared_evaluator_for_implementors))'''

[[profile.drop-11.scripts]]
filter = "all()"
run-wrapper = "retained-invariant-evidence"

[scripts.setup.authored-profile]
command = ["bun", "tools/norn-ts/src/cli.ts", "profile", "scripts/demo/jewelry.source.ts"]

[scripts.setup.jewelry-authoring]
command = { command-line = ["bun", "test", "tools/norn-ts/test/jewelry-demo.test.ts"], env = { NORN_UPDATE_JEWELRY_GOLDEN = "" } }

[scripts.setup.fold-authoring]
command = ["bun", "test", "tools/norn-ts/test/authoring-sdk.test.ts", "--test-name-pattern", "CP3 allocation goldens come from core-aligned typed declarations"]

[scripts.setup.rate-authoring]
command = ["bun", "test", "tools/norn-ts/test/rate.test.ts", "--timeout", "60000"]

[scripts.setup.pack-authoring]
command = { command-line = ["bun", "test", "tools/norn-ts/test/registry-packs.test.ts", "--test-name-pattern", "registry packs are generated from their typed sources"], env = { NORN_PACKS_UPDATE = "" } }

[scripts.setup.constitution-authoring]
command = { command-line = ["bun", "test", "tools/norn-ts/test/constitution.test.ts", "--timeout", "60000"], env = { NORN_UPDATE_CONSTITUTION_GOLDEN = "" } }

[scripts.wrapper.sampled-evidence]
command = { command-line = ["env"], env = { PROPTEST_RNG_SEED = "21320261103", PROPTEST_RNG_ALGORITHM = "cc" } }

[scripts.wrapper.quarantine-evidence]
command = { command-line = ["env"], env = { PROPTEST_RNG_SEED = "21320261103", PROPTEST_RNG_ALGORITHM = "cc", PROPTEST_CASES = "16" } }

[scripts.setup.kani-068-install]
command = ["cargo", "install", "--locked", "--root", "target/demo-kani-0.68", "kani-verifier", "--version", "=0.68.0"]

[scripts.setup.kani-068-setup]
command = ["target/demo-kani-0.68/bin/kani", "setup"]
slow-timeout = { period = "300s", terminate-after = 2 }

[scripts.setup.decimal-kani-0]
command = ["target/demo-kani-0.68/bin/kani", "verification/canonical-values-v1/decimal_kani.rs", "--harness", "canonical_decimal_preserves_bounded_values", "--output-format", "terse"]
slow-timeout = { period = "300s", terminate-after = 1 }

[scripts.setup.decimal-kani-1]
command = ["target/demo-kani-0.68/bin/kani", "verification/canonical-values-v1/decimal_kani.rs", "--harness", "decimal_scale_multiplier_is_exact_in_bounded_profile", "--output-format", "terse"]
slow-timeout = { period = "300s", terminate-after = 1 }

[scripts.setup.decimal-kani-2]
command = ["target/demo-kani-0.68/bin/kani", "verification/canonical-values-v1/decimal_kani.rs", "--harness", "decimal_scale_overflow_refuses", "--output-format", "terse"]
slow-timeout = { period = "300s", terminate-after = 1 }

[profile.drop-01]
default-filter = '''binary_id(norn-cell::exact_values) | binary_id(norn-expr::profile_conformance) | binary_id(norn-checker::core_units) | (binary_id(norn-checker) & (test(/^property_codec::tests::/) | test(/^quantity_ledger::decimal::tests::/)))'''

[[profile.drop-01.scripts]]
filter = "all()"
setup = ["kani-068-install", "kani-068-setup", "decimal-kani-0", "decimal-kani-1", "decimal-kani-2"]
run-wrapper = "sampled-evidence"

