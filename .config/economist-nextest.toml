# cargo nextest run --tool-config-file economist:.config/economist-nextest.toml --profile economist-rehearsal
# Requires Rust 1.98, nextest 0.9.150, Bun 1.3.14, frozen tools/norn-proofs
# dependencies and NORN_VERIFICATION_TOOL_ROOT with the pinned backend tools.
# Focused witnesses from published drops; no drop's complete selection is replaced.
# Nextest runs setup phases in declaration order and stops on any failed phase.
# Every test filter has one required name: an empty selection must fail.
# All current phases are native runs; Studio replaces a phase only after landing.

[scripts.setup."Beat 1 | native run | three systems"]
command = ["cargo", "nextest", "run", "--locked", "--profile", "ci", "-p", "norn-checker", "--test", "three_systems", "-E", "test(=mvp_map_three_aliases_roles_and_one_economic_identity)"]
slow-timeout = { period = "120s", terminate-after = 10 }

[scripts.setup."Beat 1 | native run | ambiguous identity refuses"]
command = ["cargo", "nextest", "run", "--locked", "--profile", "ci", "-p", "norn-checker", "--test", "three_systems", "-E", "test(=mvp_map_three_ambiguous_identity_refuses_without_sku_guessing)"]
slow-timeout = { period = "120s", terminate-after = 10 }

[scripts.setup."Beat 1 | native run | sales price is not stock cost"]
command = ["cargo", "nextest", "run", "--locked", "--profile", "ci", "-p", "norn-checker", "--test", "three_systems", "-E", "test(=mvp_map_gap_shopify_price_is_never_stock_cost_or_gl)"]
slow-timeout = { period = "120s", terminate-after = 10 }

[scripts.setup."Beat 1 | native run | quarantine reason"]
command = ["cargo", "nextest", "run", "--locked", "--profile", "ci", "-p", "norn-cell", "--test", "definitions_install", "-E", "test(=obs_bad_scrap_yield_purity_120_is_captured_but_native_write_refuses)"]
slow-timeout = { period = "120s", terminate-after = 10 }

[scripts.setup."Beat 2 | native run | exact question and contributions"]
command = ["cargo", "nextest", "run", "--locked", "--profile", "ci", "-p", "norn-cell", "--test", "exact_question", "-E", "test(=scrap_yield_live_revisions_use_the_real_cell_evaluator_and_result_frontier)"]
slow-timeout = { period = "120s", terminate-after = 10 }

[scripts.setup."Beat 2 | native run | incremental equals recompute"]
command = ["cargo", "nextest", "run", "--locked", "--profile", "ci", "-p", "norn-cell", "--test", "incremental_question", "-E", "test(=data_delta_incremental_equals_recompute_with_redelivery_and_restart)"]
slow-timeout = { period = "120s", terminate-after = 10 }

[scripts.setup."Beat 2 | native run | restatement and old as-of answer"]
command = ["cargo", "nextest", "run", "--locked", "--profile", "ci", "-p", "norn-cell", "--test", "restatement_activation", "-E", "test(=governed_activation_switches_all_slices_and_preserves_old_answers)"]
slow-timeout = { period = "120s", terminate-after = 10 }

[scripts.setup."Beat 3 | native run | allocation plans"]
command = ["cargo", "nextest", "run", "--locked", "--profile", "ci", "-p", "norn-decisions", "--test", "evaluate", "-E", "test(=cp3_typed_declarations_preserve_sale_scrap_and_melt_allocations)"]
slow-timeout = { period = "120s", terminate-after = 10 }

[scripts.setup."Beat 3 | native run | committed pricing"]
command = ["cargo", "nextest", "run", "--locked", "--profile", "ci", "-p", "norn-cell", "--test", "jewelry_pricing", "-E", "test(=jewel_price_sell_and_scrap_commit_exactly_once_and_reopen)"]
slow-timeout = { period = "120s", terminate-after = 10 }

[scripts.setup."Beat 4 | native run | refused conservation transaction"]
command = ["cargo", "run", "--locked", "-p", "norn-cell", "--example", "constitution"]
slow-timeout = { period = "120s", terminate-after = 10 }

[scripts.setup."Beat 4 | native run | retained invariant responses"]
command = ["cargo", "nextest", "run", "--locked", "--profile", "ci", "-p", "norn-kernel", "--test", "invariant_commit", "-E", "test(=law_invariant_runtime_violation_refuses_atomically_with_the_retained_law_pin)"]
slow-timeout = { period = "120s", terminate-after = 10 }

[scripts.setup."Beat 4 | native run | build generated proof backend"]
command = ["cargo", "build", "--locked", "-p", "norn-checker", "--example", "quint"]
slow-timeout = { period = "120s", terminate-after = 10 }

[scripts.setup."Beat 4 | native run | generated bounded counterexample"]
command = ["bun", "test", "./tools/norn-proofs/check.test.ts", "--test-name-pattern", "^tla_ts_apalache_parity$"]
slow-timeout = { period = "120s", terminate-after = 10 }

[profile.economist-rehearsal]
default-filter = "binary_id(norn-kernel::invariant_commit) & test(=law_invariant_runtime_valid_response_admits)"
test-threads = 1
retries = 0
fail-fast = true
success-output = "immediate"

[[profile.economist-rehearsal.scripts]]
filter = "all()"
setup = [
  "Beat 1 | native run | three systems",
  "Beat 1 | native run | ambiguous identity refuses",
  "Beat 1 | native run | sales price is not stock cost",
  "Beat 1 | native run | quarantine reason",
  "Beat 2 | native run | exact question and contributions",
  "Beat 2 | native run | incremental equals recompute",
  "Beat 2 | native run | restatement and old as-of answer",
  "Beat 3 | native run | allocation plans",
  "Beat 3 | native run | committed pricing",
  "Beat 4 | native run | refused conservation transaction",
  "Beat 4 | native run | retained invariant responses",
  "Beat 4 | native run | build generated proof backend",
  "Beat 4 | native run | generated bounded counterexample",
]
