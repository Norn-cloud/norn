name: Trusted merge group
# A merge queue runs `Public core` from each group's own commit, so that run
# cannot vouch for the group's gates. This workflow always runs from the
# default branch: it checks the group head as data with base-owned policy and
# writes `trusted-policy` on it, as the pull_request_target job does for a
# pull request head.
on:
  workflow_run:
    workflows: [Public core]
    types: [requested]
permissions:
  contents: read
jobs:
  trusted-policy:
    if: github.event.workflow_run.event == 'merge_group' && github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      actions: read
      contents: write
      issues: read
      pull-requests: read
      statuses: write
    concurrency:
      group: rights-authority-v4
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # The gate walks the group's merges from its head down to its base: the
      # newest commit of main it contains.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve the group base
        id: group
        run: echo "base_sha=$(git -C candidate merge-base HEAD refs/remotes/origin/${{ github.event.repository.default_branch }})" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.group.outputs.base_sha }}
          path: trusted
          persist-credentials: false
      # Each queued pull request is the second parent of one merge on the
      # first-parent path from the group head to its base. This records their
      # `/approve-gates` comments; the base-owned gate walks the same path in
      # git and decides.
      - name: Record admin approvals of the queued heads
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const collect=async function collectRights(github, context, core, parameters, probe) {
              const fs=require('fs'), crypto=require('crypto'), {owner,repo}=context.repo;
              const digest=value=>{
                const hash=crypto.createHash('sha256').update('norn-rights-checkpoint-v4\0');
                const count=n=>{const bytes=Buffer.alloc(8);bytes.writeBigUInt64BE(BigInt(n));hash.update(bytes)};
                const walk=v=>{
                  if(v===null){hash.update(Buffer.from([0]));return}
                  if(typeof v==='boolean'){hash.update(Buffer.from([v?2:1]));return}
                  if(typeof v==='number'){
                    if(!Number.isSafeInteger(v))throw new Error('Unsafe checkpoint number');
                    const bytes=Buffer.from(String(v));hash.update(Buffer.from([3]));count(bytes.length);hash.update(bytes);return;
                  }
                  if(typeof v==='string'){const bytes=Buffer.from(v);hash.update(Buffer.from([4]));count(bytes.length);hash.update(bytes);return}
                  if(Array.isArray(v)){hash.update(Buffer.from([5]));count(v.length);for(const item of v)walk(item);return}
                  const keys=Object.keys(v).sort((a,b)=>Buffer.compare(Buffer.from(a),Buffer.from(b)));
                  hash.update(Buffer.from([6]));count(keys.length);for(const key of keys){walk(key);walk(v[key])}
                };
                walk(value);return hash.digest('hex');
              };
              const sha=s=>typeof s==='string'&&/^[0-9a-f]{40}$/.test(s);
              const anchor='69ffae65225a6784ebcb96696fc88c65d810fa4f', retention='heads/ci/rights-ledger-v1';
              const statusRows=async head=>github.paginate(github.rest.repos.listCommitStatusesForRef,{owner,repo,ref:head,per_page:100});
              const trusted=rows=>rows.filter(s=>s.creator?.login==='github-actions[bot]').sort((a,b)=>b.id-a.id);
              const failure=rows=>Math.max(0,...trusted(rows).filter(s=>s.context==='trusted-policy'&&['failure','error'].includes(s.state)).map(s=>s.id));
              const checkpointRow=(rows,tree,kind)=>trusted(rows).find(s=>s.context.toLowerCase().startsWith(`rights-checkpoint/${kind}/${tree}/`));
              if (probe) {
                if(Date.now()>probe.authority_deadline)throw new Error('Rights publication expired');
                for (const [head,trees] of Object.entries(probe.rights)) for (const [tree,ledger] of Object.entries(trees)) {
                  const rows=await statusRows(head), row=checkpointRow(rows,tree,'target');
                  if (!row||row.state!=='success'||JSON.parse(row.description).d!==ledger.checkpoint.digest||failure(rows)!==ledger.failure_version)
                    throw new Error('Rights checkpoint changed before publication');
                }
                const p=probe.publication, rows=await statusRows(p.head_sha), row=checkpointRow(rows,p.tree_sha,'publication');
                if (!row||row.state!=='success'||JSON.parse(row.description).d!==p.digest||failure(rows)!==p.failure_version)
                  throw new Error('Publication checkpoint changed');
                return probe;
              }
              const sourceId=context.payload.workflow_run?.id||context.runId;
              const {data:source}=await github.rest.actions.getWorkflowRun({owner,repo,run_id:sourceId});
              const started=Date.parse(source.created_at), deadline=started+600000;
              if (!Number.isFinite(started)||Date.now()>deadline) throw new Error('Rights authority queue deadline exceeded');
              const until=()=>{if(Date.now()>deadline)throw new Error('Rights authority deadline exceeded')};
              const permissionCache=new Map(), permission=async username=>{
                if(!permissionCache.has(username))permissionCache.set(username,(await github.rest.repos.getCollaboratorPermissionLevel({owner,repo,username})
                  .catch(e=>{if(e.status===404)return {data:{permission:'none'}};throw e})).data.permission);
                return permissionCache.get(username);
              };
              const {data:anchorCommit}=await github.rest.repos.getCommit({owner,repo,ref:anchor});
              const anchorTree=anchorCommit.commit.tree.sha;
              if(!sha(anchorTree))throw new Error('Invalid checkpoint anchor');
              let prior=null, metadata={version:4,parent:null,cursor:null}, treeBase=null;
              let rootReceipt;
              for(let page=1;!rootReceipt;page++){
                until();
                const {data:rows}=await github.rest.repos.listCommitStatusesForRef({owner,repo,ref:anchor,per_page:100,page});
                rootReceipt=trusted(rows).find(s=>s.context.toLowerCase().startsWith(`rights-cursor/${anchorTree}/`));
                if(rows.length<100)break;
              }
              if(rootReceipt){
                const row=JSON.parse(rootReceipt.description);
                if(rootReceipt.state!=='success'||row.v!==4||!sha(row.c)||!Number.isSafeInteger(row.r))throw new Error('Invalid rights cursor');
                const {data:producer}=await github.rest.actions.getWorkflowRun({owner,repo,run_id:row.r});
                if(!['issue_comment','pull_request_target','workflow_run'].includes(producer.event)||
                    producer.repository?.full_name!==`${owner}/${repo}`)throw new Error('Untrusted checkpoint producer');
                const {data:commit}=await github.rest.git.getCommit({owner,repo,commit_sha:row.c});
                const {data:file}=await github.rest.repos.getContent({owner,repo,path:'metadata.json',ref:row.c});
                metadata=JSON.parse(Buffer.from(file.content,'base64').toString('utf8'));
                if(!sha(metadata.policy_sha))throw new Error('Missing checkpoint policy identity');
                const {data:comparison}=await github.rest.repos.compareCommits({owner,repo,base:metadata.policy_sha,head:producer.repository.default_branch||'main'});
                if(!['ahead','identical'].includes(comparison.status))throw new Error('Checkpoint policy is not base-owned');
                const {data:definition}=await github.rest.repos.getContent({owner,repo,path:producer.event==='workflow_run'?'.github/workflows/trusted-merge-group.yml':'.github/workflows/ci-policy.yml',ref:metadata.policy_sha});
                if(definition.type!=='file'||definition.encoding!=='base64'||
                    !Buffer.from(definition.content,'base64').toString('utf8').includes('rights-authority-v4'))throw new Error('Checkpoint producer policy unavailable');
                if(metadata.version!==4||!metadata.cursor||!Number.isSafeInteger(metadata.cursor.number)||
                    !Number.isSafeInteger(metadata.cursor.id)||metadata.parent!==row.p||
                    (row.p&&!commit.parents.some(p=>p.sha===row.p)))throw new Error('Unbound rights checkpoint');
                prior=row.c;treeBase=commit.tree.sha;
              }
              const cache=new Map(), changed=new Set(), definitions=new Map(), seen=new Set(), suffix=[];
              let expected, witnessed=false, boundary=false;
              const before=metadata.cursor;
              for(let page=1;!boundary;page++){
                until();
                const {data}=await github.rest.actions.listWorkflowRuns({owner,repo,workflow_id:'ci-policy.yml',per_page:100,page});
                if(!Array.isArray(data.workflow_runs)||!data.workflow_runs.length){
                  if(before&&expected===before.number){boundary=true;break}
                  throw new Error('Rights history checkpoint unavailable');
                }
                for(const run of data.workflow_runs){
                  if(seen.has(run.id))continue;
                  seen.add(run.id);
                  if(before&&run.run_number<=before.number){
                    if(expected!==undefined&&expected!==before.number)throw new Error('Gap before reconciled rights checkpoint');
                    boundary=true;break;
                  }
                  if(!Number.isSafeInteger(run.run_number)||run.run_number<1||
                      (expected!==undefined&&run.run_number!==expected))throw new Error('Incomplete rights event history');
                  expected=run.run_number-1;witnessed||=run.id===sourceId;
                  if(run.event==='issue_comment'&&!before){
                    if(!definitions.has(run.head_sha)){
                      const {data:file}=await github.rest.repos.getContent({owner,repo,path:'.github/workflows/ci-policy.yml',ref:run.head_sha});
                      if(file.type!=='file'||file.encoding!=='base64')throw new Error('Unavailable rights protocol');
                      definitions.set(run.head_sha,Buffer.from(file.content,'base64').toString('utf8').includes('rights-authority-v4'));
                    }
                    if(!definitions.get(run.head_sha)){boundary=true;break}
                  }
                  suffix.push(run);
                  if(run.run_number===1){boundary=true;break}
                }
              }
              if(!witnessed&&(!before||source.run_number>before.number))throw new Error('Missing admission event');
              const readTarget=async head=>{
                if(!cache.has(head)){
                  let value={head_sha:head,events:[]};
                  if(prior){
                    const result=await github.rest.repos.getContent({owner,repo,path:`targets/${head}.json`,ref:prior})
                      .catch(e=>{if(e.status===404)return null;throw e});
                    if(result){
                      const file=result.data;
                      if(file.type!=='file'||file.encoding!=='base64')throw new Error('Unavailable target checkpoint');
                      value=JSON.parse(Buffer.from(file.content,'base64').toString('utf8'));
                      if(value.head_sha!==head||!Array.isArray(value.events))throw new Error('Wrong target checkpoint');
                    }
                  }
                  cache.set(head,value);
                }
                return cache.get(head);
              };
              const jobsFor=async run=>{
                const waitUntil=Math.min(deadline,Date.now()+30000), ledgerUntil=Math.min(deadline,Date.now()+5000);
                let jobs;
                for(;;){
                  jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt,
                    {owner,repo,run_id:run.id,attempt_number:run.run_attempt,per_page:100});
                  const captures=jobs.filter(j=>/^Capture immutable rights event (pull|issue)$/.test(j.name));
                  const journals=jobs.filter(j=>j.name.startsWith('Rights ledger '));
                  if(captures.length===1&&captures[0].name.endsWith(' issue'))return {jobs,plain:true};
                  const captured=captures.length===1&&captures[0].status==='completed'&&captures[0].conclusion==='success'&&journals.length===1;
                  if(captured&&(journals[0].status==='completed'||Date.now()>=Math.min(waitUntil,ledgerUntil)))
                    return {jobs,plain:false};
                  if(Date.now()>=waitUntil||run.status==='completed')throw new Error('Rights capture incomplete after bounded wait');
                  await new Promise(resolve=>setTimeout(resolve,1000));until();
                }
              };
              for(const run of [...suffix].reverse()){
                if(run.event!=='issue_comment')continue;
                const {jobs,plain}=await jobsFor(run);if(plain)continue;
                const journals=jobs.filter(j=>j.name.startsWith('Rights ledger '));
                const tag=journals[0].name.match(/^Rights ledger (none|[0-9a-f]{40}(?:,[0-9a-f]{40})?) comment (\d+)$/);
                if(!tag)throw new Error('Invalid saved rights event');
                if(tag[1]==='none')continue;
                for(const head of tag[1].split(',')){
                  const state=await readTarget(head), row={run:run.id,comment:Number(tag[2])};
                  const old=state.events.find(e=>e.run===row.run);
                  if(old&&old.comment!==row.comment)throw new Error('Changed saved rights identity');
                  if(!old){state.events.push(row);changed.add(head)}
                }
              }
              const newest=suffix[0];
              if(newest&&(!before||newest.run_number>before.number)){
                const policy=process.env.GITHUB_WORKFLOW_SHA;
                if(!sha(policy))throw new Error('Missing trusted workflow commit');
                const next={version:4,parent:prior,policy_sha:policy,cursor:{id:newest.id,number:newest.run_number}};
                const nodes=[];
                const put=async(path,value)=>{
                  const {data:blob}=await github.rest.git.createBlob({owner,repo,content:JSON.stringify(value),encoding:'utf-8'});
                  nodes.push({path,mode:'100644',type:'blob',sha:blob.sha});
                };
                for(const head of changed)await put(`targets/${head}.json`,cache.get(head));
                await put('metadata.json',next);
                const {data:tree}=await github.rest.git.createTree({owner,repo,...(treeBase?{base_tree:treeBase}:{}),tree:nodes});
                const retained=await github.rest.git.getRef({owner,repo,ref:retention}).catch(e=>{if(e.status===404)return null;throw e});
                const parents=[...new Set([retained?.data.object.sha,prior].filter(Boolean))];
                const {data:commit}=await github.rest.git.createCommit({owner,repo,message:'Record reconciled rights event index',tree:tree.sha,parents});
                if(retained)await github.rest.git.updateRef({owner,repo,ref:retention,sha:commit.sha,force:false});
                else await github.rest.git.createRef({owner,repo,ref:`refs/${retention}`,sha:commit.sha});
                await github.rest.repos.createCommitStatus({owner,repo,sha:anchor,state:'success',
                  context:`rights-cursor/${anchorTree}/${context.runId}/${process.env.GITHUB_RUN_ATTEMPT}`,
                  description:JSON.stringify({v:4,c:commit.sha,p:prior,r:context.runId})});
                prior=commit.sha;metadata=next;
              }
              const rights={}, commentsById=new Map(), statusesByHead=new Map();
              const rowsFor=async head=>{
                if(!statusesByHead.has(head))statusesByHead.set(head,await statusRows(head));
                return statusesByHead.get(head);
              };
              const targetLedger=async head=>{
                if(rights[head])return;
                until();
                const {data:commit}=await github.rest.repos.getCommit({owner,repo,ref:head}), tree=commit.commit.tree.sha;
                if(!sha(tree))throw new Error('Invalid rights target tree');
                const state=await readTarget(head), sources=new Map(), pending=[], entries=[];
                for(const event of state.events){
                  const {data:run}=await github.rest.actions.getWorkflowRun({owner,repo,run_id:event.run});
                  const {jobs}=await jobsFor(run);
                  const writer=jobs.find(j=>j.name.startsWith('Rights ledger '));
                  const tag=writer?.name.match(/^Rights ledger (none|[0-9a-f]{40}(?:,[0-9a-f]{40})?) comment (\d+)$/);
                  if(!tag||!tag[1].split(',').includes(head)||Number(tag[2])!==event.comment)throw new Error('Checkpoint source changed');
                  const complete=writer.status==='completed'&&writer.conclusion==='success';
                  sources.set(event.run,{...event,attempt:run.run_attempt,complete});
                  if(!complete)pending.push(event.run);
                }
                const rows=await rowsFor(head), recorded=new Set();
                for(const status of trusted(rows)){
                  const key=status.context.toLowerCase();
                  if(!key.startsWith('rights-ledger/'))continue;
                  const tag=key.match(/^rights-ledger\/([0-9a-f]{40})\/(\d+)\/(\d+)$/);
                  if(!tag||tag[1]!==tree||status.state!=='success')throw new Error('Wrong rights receipt target');
                  const row=JSON.parse(status.description), node=sources.get(row.r);
                  if(row.v!==1||!node||node.comment!==row.c||row.r!==Number(tag[2])||row.a!==Number(tag[3])||
                      !['ack','revoke','withdraw','ignore'].includes(row.k))throw new Error('Unbound rights receipt');
                  recorded.add(`${row.r}/${row.a}`);
                  let comment=null;
                  if(row.k==='ack'){
                    if(!commentsById.has(row.c))commentsById.set(row.c,await github.rest.issues.getComment({owner,repo,comment_id:row.c})
                      .then(({data})=>data,e=>{if(e.status===404)return null;throw e}));
                    const live=commentsById.get(row.c);
                    if(live?.user)comment={id:live.id,user:live.user.login,body:live.body,created_at:live.created_at,
                      updated_at:live.updated_at,permission:await permission(live.user.login)};
                  }
                  entries.push({id:status.id,run_id:row.r,attempt:row.a,comment_id:row.c,kind:row.k,
                    created_at:row.t,recorded_at:status.created_at,comment});
                }
                for(const node of sources.values())if(!recorded.has(`${node.run}/${node.attempt}`))pending.push(node.run);
                const data={head_sha:head,tree_sha:tree,pending:[...new Set(pending)].sort((a,b)=>a-b),
                  entries:entries.sort((a,b)=>a.id-b.id),failure_version:failure(rows)};
                const d=digest(data);
                await github.rest.repos.createCommitStatus({owner,repo,sha:head,state:'success',
                  context:`rights-checkpoint/target/${tree}/${context.runId}/${process.env.GITHUB_RUN_ATTEMPT}`,
                  description:JSON.stringify({v:4,d,f:data.failure_version})});
                rights[head]={[tree]:{...data,checkpoint:{digest:d},verdicts:trusted(rows).filter(s=>s.context==='trusted-policy')}};
              };
              const gateComments=async number=>{
                const result=[];
                for(const c of await github.paginate(github.rest.issues.listComments,{owner,repo,issue_number:number,per_page:100}))
                  if(c.user&&(c.body||'').trim().startsWith('/approve-gates'))result.push({user:c.user.login,body:c.body,
                    created_at:c.created_at,updated_at:c.updated_at,permission:await permission(c.user.login)});
                return result;
              };
              let evidence;
              if(parameters.kind==='pr'){
                await targetLedger(parameters.head);
                evidence={repository:`${owner}/${repo}`,head_repository:parameters.repository,head_sha:parameters.head,
                  base_sha:parameters.base,comments:await gateComments(parameters.number),rights};
              }else{
                const pull_requests=[];let current=parameters.head;
                for(let i=0;current!==parameters.base&&i<64;i++){
                  const {data:commit}=await github.rest.repos.getCommit({owner,repo,ref:current});
                  if(commit.parents.length!==2)break;
                  const h=commit.parents[1].sha;
                  const {data:pulls}=await github.rest.repos.listPullRequestsAssociatedWithCommit({owner,repo,commit_sha:h});
                  await targetLedger(h);
                  for(const p of pulls.filter(p=>p.head.sha===h))pull_requests.push({number:p.number,head_repository:p.head.repo?.full_name||null,
                    head_sha:h,base_sha:p.base.sha,comments:await gateComments(p.number)});
                  current=commit.parents[0].sha;
                }
                evidence={repository:`${owner}/${repo}`,merge_group:{base_sha:parameters.base,head_sha:parameters.head},pull_requests,rights};
              }
              const {data:headCommit}=await github.rest.repos.getCommit({owner,repo,ref:parameters.head});
              const rows=await rowsFor(parameters.head), p={head_sha:parameters.head,tree_sha:headCommit.commit.tree.sha,
                failure_version:failure(rows),targets:Object.fromEntries(Object.entries(rights).map(([h,trees])=>[h,Object.values(trees)[0].checkpoint.digest]))};
              const d=digest(p);
              await github.rest.repos.createCommitStatus({owner,repo,sha:parameters.head,state:'success',
                context:`rights-checkpoint/publication/${p.tree_sha}/${context.runId}/${process.env.GITHUB_RUN_ATTEMPT}`,
                description:JSON.stringify({v:4,d,f:p.failure_version})});
              evidence.publication={...p,digest:d,verdicts:trusted(rows).filter(s=>s.context==='trusted-policy')};
              evidence.authority_deadline=deadline;
              return evidence;
            };
            const parameters={kind:'group',head:'${{ github.event.workflow_run.head_sha }}',base:'${{ steps.group.outputs.base_sha }}'};
            const fs=require('fs'), prefix=process.env.RUNNER_TEMP;
            fs.rmSync(prefix+'/maintainer-approval.json',{force:true});
            fs.writeFileSync(prefix+'/rights-authority.cjs','module.exports='+collect.toString());
            fs.writeFileSync(prefix+'/rights-parameters.json',JSON.stringify(parameters));
            const opening=await collect(github,context,core,parameters);
            await collect(github,context,core,parameters,opening);
            await github.rest.repos.createCommitStatus({...context.repo,sha:parameters.head,state:'failure',context:'trusted-policy',
              description:JSON.stringify({v:4,d:opening.publication.digest,f:opening.publication.failure_version})});
            const evidence=await collect(github,context,core,parameters);
            fs.writeFileSync(prefix+'/maintainer-approval.json',JSON.stringify(evidence));
            fs.writeFileSync(prefix+'/rights-decision.json',JSON.stringify(evidence.publication));
      - name: Validate the group head as data with base-owned policy
        run: python3 trusted/scripts/ci/validate-runner-policy.py --root candidate --maintainer-evidence "$RUNNER_TEMP/maintainer-approval.json" --rights-evidence "$RUNNER_TEMP/maintainer-approval.json" --head "${{ github.event.workflow_run.head_sha }}" --repository "${{ github.repository }}"
      - name: Report trusted policy on the group head
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const head='${{ github.event.workflow_run.head_sha }}';
            const fs=require('fs'), prefix=process.env.RUNNER_TEMP;
            let state='failure', d='0'.repeat(64), f=0;
            try{
              const collect=require(prefix+'/rights-authority.cjs'), parameters=JSON.parse(fs.readFileSync(prefix+'/rights-parameters.json'));
              const current=await collect(github,context,core,parameters);
              d=current.publication.digest;f=current.publication.failure_version;
              const decision=JSON.parse(fs.readFileSync(prefix+'/rights-decision.json'));
              const pending=Object.values(current.rights).some(trees=>Object.values(trees).some(ledger=>ledger.pending.length));
              await collect(github,context,core,parameters,current);
              if('${{ job.status }}'==='success'&&!pending&&decision.digest===d&&Date.now()<=current.authority_deadline)state='success';
            }catch(error){core.warning('Rights publication refused: checkpoint unavailable, changed or expired')}
            try{
              const {data:commit}=await github.rest.repos.getCommit({...context.repo,ref:head});
              const rows=await github.paginate(github.rest.repos.listCommitStatusesForRef,{...context.repo,ref:head,per_page:100});
              const cp=rows.filter(row=>row.creator?.login==='github-actions[bot]'&&row.state==='success'&&row.context.toLowerCase().startsWith('rights-checkpoint/publication/'+commit.commit.tree.sha+'/')).sort((a,b)=>b.id-a.id)[0];
              const latestFailure=Math.max(0,...rows.filter(row=>row.creator?.login==='github-actions[bot]'&&row.context==='trusted-policy'&&['failure','error'].includes(row.state)).map(row=>row.id));
              if(state==='success'&&(!cp||JSON.parse(cp.description).d!==d||latestFailure!==f))state='failure';
              if(state==='failure'){d=cp?JSON.parse(cp.description).d:'0'.repeat(64);f=latestFailure}
            }catch(error){state='failure';d='0'.repeat(64)}
            await github.rest.repos.createCommitStatus({...context.repo,sha:head,state,context:'trusted-policy',
              description:JSON.stringify({v:4,d,f}),
              target_url:context.serverUrl+'/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId});
            if(state!=='success')core.setFailed('Rights authority refused publication');
