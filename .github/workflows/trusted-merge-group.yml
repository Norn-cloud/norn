name: Trusted merge group
# A merge queue runs `Public core` from each group's own commit, so that run
# cannot vouch for the group's gates. This workflow always runs from the
# default branch: it checks the group head as data with base-owned policy and
# writes `trusted-policy` on it, as the pull_request_target job does for a
# pull request head.
on:
  workflow_run:
    workflows: [Public core]
    types: [requested]
permissions:
  contents: read
jobs:
  trusted-policy:
    if: github.event.workflow_run.event == 'merge_group' && github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    concurrency:
      group: trusted-merge-group-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # The gate walks the group's merges from its head down to its base: the
      # newest commit of main it contains.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve the group base
        id: group
        run: echo "base_sha=$(git -C candidate merge-base HEAD refs/remotes/origin/${{ github.event.repository.default_branch }})" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.group.outputs.base_sha }}
          path: trusted
          persist-credentials: false
      # Each queued pull request is the second parent of one merge on the
      # first-parent path from the group head to its base. This records their
      # `/approve-gates` comments; the base-owned gate walks the same path in
      # git and decides.
      - name: Record admin approvals of the queued heads
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const {owner,repo}=context.repo;
            const evidencePath = `${process.env.RUNNER_TEMP}/maintainer-approval.json`;
            require('fs').rmSync(evidencePath,{force:true});
            const permissionCache = new Map();
            const permission = async username => {
              if (!permissionCache.has(username)) permissionCache.set(username,
                (await github.rest.repos.getCollaboratorPermissionLevel({owner,repo,username})
                  .catch(error => {if (error.status === 404) return {data:{permission:'none'}}; throw error;})).data.permission);
              return permissionCache.get(username);
            };
            const ledgerIndex = async () => {
              const nodes=[], unknown=[], seen=new Set(), definitions=new Map();
              let expected, witnessed=false;
              const admission=context.payload.workflow_run?.id || context.runId;
              for (let page=1;page<=100;page++) {
                const {data}=await github.rest.actions.listWorkflowRuns({owner,repo,workflow_id:'ci-policy.yml',per_page:100,page});
                if (!Array.isArray(data.workflow_runs) || !data.workflow_runs.length) break;
                for (const run of data.workflow_runs) {
                  if (seen.has(run.id)) continue;
                  seen.add(run.id);
                  if (!Number.isSafeInteger(run.run_number) || run.run_number<1 ||
                      (expected!==undefined && run.run_number!==expected)) throw new Error('Incomplete rights event history');
                  expected=run.run_number-1; witnessed ||= run.id===admission;
                  if (run.event==='issue_comment') {
                    if (!definitions.has(run.head_sha)) {
                      const {data:file}=await github.rest.repos.getContent({owner,repo,path:'.github/workflows/ci-policy.yml',ref:run.head_sha});
                      if (file.type!=='file' || file.encoding!=='base64') throw new Error('Unavailable rights protocol');
                      definitions.set(run.head_sha,Buffer.from(file.content,'base64').toString('utf8').includes('name: Capture immutable rights event '));
                    }
                    if (!definitions.get(run.head_sha)) {
                      if (!witnessed) throw new Error('Missing admission event');
                      return {nodes,unknown};
                    }
                    const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt,
                      {owner,repo,run_id:run.id,attempt_number:run.run_attempt,per_page:100});
                    const captures=jobs.filter(job=>/^Capture immutable rights event (pull|issue)$/.test(job.name));
                    if (captures.length===1 && captures[0].name.endsWith(' issue')) continue;
                    const journals=jobs.filter(job=>job.name.startsWith('Rights ledger '));
                    const parsed=journals.map(job=>({job,tag:job.name.match(/^Rights ledger (none|[0-9a-f]{40}(?:,[0-9a-f]{40})?) comment (\d+)$/)}));
                    if (captures.length!==1 || captures[0].status!=='completed' || captures[0].conclusion!=='success' ||
                        parsed.length!==1 || !parsed[0].tag) unknown.push(run.id);
                    else if (parsed[0].tag[1]!=='none') nodes.push({run:run.id,attempt:run.run_attempt,
                      comment:Number(parsed[0].tag[2]),heads:parsed[0].tag[1].split(','),
                      complete:parsed[0].job.status==='completed' && parsed[0].job.conclusion==='success'});
                  }
                  if (run.run_number===1) {
                    if (!witnessed) throw new Error('Missing admission event');
                    return {nodes,unknown};
                  }
                }
              }
              throw new Error('Rights protocol history unavailable');
            };
            const index=await ledgerIndex(), rights={}, commentsById=new Map();
            const targetLedger=async head=>{
              if (rights[head]) return;
              const {data:commit}=await github.rest.repos.getCommit({owner,repo,ref:head}), tree=commit.commit.tree.sha;
              if (!/^[0-9a-f]{40}$/.test(tree)) throw new Error('Invalid rights target tree');
              const nodes=index.nodes.filter(node=>node.heads.includes(head)), pending=[...index.unknown], entries=[];
              const statuses=await github.paginate(github.rest.repos.listCommitStatusesForRef,{owner,repo,ref:head,per_page:100});
              const recorded=new Set();
              for (const status of statuses) {
                const contextKey=status.context.toLowerCase();
                if (!contextKey.startsWith('rights-ledger/') || status.creator?.login!=='github-actions[bot]') continue;
                const tag=contextKey.match(/^rights-ledger\/([0-9a-f]{40})\/(\d+)\/(\d+)$/);
                if (!tag || tag[1]!==tree || status.state!=='success') throw new Error('Wrong rights receipt target');
                const row=JSON.parse(status.description), node=nodes.find(node=>node.run===row.r && node.comment===row.c);
                if (row.v!==1 || !node || row.r!==Number(tag[2]) || row.a!==Number(tag[3]) ||
                    !['ack','revoke','withdraw','ignore'].includes(row.k)) throw new Error('Unbound rights receipt');
                recorded.add(`${row.r}/${row.a}`);
                let comment=null;
                if (row.k==='ack') {
                  if (!commentsById.has(row.c)) commentsById.set(row.c,await github.rest.issues.getComment({owner,repo,comment_id:row.c})
                    .then(({data})=>data,error=>{if (error.status===404) return null; throw error;}));
                  const live=commentsById.get(row.c);
                  if (live?.user) comment={id:live.id,user:live.user.login,body:live.body,created_at:live.created_at,
                    updated_at:live.updated_at,permission:await permission(live.user.login)};
                }
                entries.push({id:status.id,run_id:row.r,attempt:row.a,comment_id:row.c,kind:row.k,
                  created_at:row.t,recorded_at:status.created_at,comment});
              }
              for (const node of nodes) if (!node.complete || !recorded.has(`${node.run}/${node.attempt}`)) pending.push(node.run);
              rights[head]={[tree]:{head_sha:head,tree_sha:tree,pending:[...new Set(pending)],entries}};
            };
            const base='${{ steps.group.outputs.base_sha }}',head='${{ github.event.workflow_run.head_sha }}',pull_requests=[];
            let sha=head;
            for (let step=0;sha!==base && step<64;step++) {
              const {data:commit}=await github.rest.repos.getCommit({owner,repo,ref:sha});
              if (commit.parents.length!==2) break;
              const pullHead=commit.parents[1].sha;
              const {data:pulls}=await github.rest.repos.listPullRequestsAssociatedWithCommit({owner,repo,commit_sha:pullHead});
              for (const pr of pulls.filter(pr=>pr.head.sha===pullHead)) {
                await targetLedger(pullHead);
                const comments=[];
                for (const comment of await github.paginate(github.rest.issues.listComments,{owner,repo,issue_number:pr.number,per_page:100})) {
                  if (!comment.user || !(comment.body||'').trim().startsWith('/approve-gates')) continue;
                  comments.push({user:comment.user.login,body:comment.body,created_at:comment.created_at,
                    updated_at:comment.updated_at,permission:await permission(comment.user.login)});
                }
                pull_requests.push({number:pr.number,head_repository:pr.head.repo?pr.head.repo.full_name:null,
                  head_sha:pr.head.sha,base_sha:pr.base.sha,comments});
              }
              sha=commit.parents[0].sha;
            }
            require('fs').writeFileSync(evidencePath,JSON.stringify({repository:`${owner}/${repo}`,
              merge_group:{base_sha:base,head_sha:head},pull_requests,rights}));
      - name: Validate the group head as data with base-owned policy
        run: python3 trusted/scripts/ci/validate-runner-policy.py --root candidate --maintainer-evidence "$RUNNER_TEMP/maintainer-approval.json" --rights-evidence "$RUNNER_TEMP/maintainer-approval.json" --head "${{ github.event.workflow_run.head_sha }}" --repository "${{ github.repository }}"
      - name: Report trusted policy on the group head
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ github.event.workflow_run.head_sha }}',
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'trusted-policy',
              description: 'Base-owned policy over the merge group',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
