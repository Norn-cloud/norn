name: Contracts
# D84: Norn's external contracts (OpenAPI and the generated SDK, IR and kernel
# schemas, CLI commands and flags, refusal and diagnostic codes, receipt and
# ledger wire formats) are additive-only. `scripts/ci/contract_diff.py` fails a
# non-additive change unless the pull request body names the ruling that
# approved it: `contract-break-approved: <ruling>`. Editing the body re-runs
# the check, so the marker can be added after the fact.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: true
jobs:
  contract-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check a pull request against its merge-base
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          python3 scripts/ci/contract_diff.py --base "$BASE" --head "$HEAD_SHA" --body-file "$RUNNER_TEMP/body.md"
      # Each queued pull request is the second parent of one merge on the
      # first-parent path from the group head to its base; each merge step is
      # checked against the body of the pull request it merges.
      - name: Record the queued pull requests' bodies
        if: github.event_name == 'merge_group'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        with:
          retries: 3
          script: |
            const { owner, repo } = context.repo;
            const bodies = {};
            let sha = process.env.HEAD_SHA;
            for (let step = 0; sha !== process.env.BASE && step < 64; step++) {
              const { data: commit } = await github.rest.repos.getCommit({ owner, repo, ref: sha });
              if (commit.parents.length !== 2) break;
              const pullHead = commit.parents[1].sha;
              const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: pullHead });
              bodies[pullHead] = pulls.filter((pr) => pr.head.sha === pullHead).map((pr) => pr.body || '');
              sha = commit.parents[0].sha;
            }
            require('fs').writeFileSync(`${process.env.RUNNER_TEMP}/bodies.json`, JSON.stringify(bodies));
      - name: Check each merge of the group
        if: github.event_name == 'merge_group'
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: python3 scripts/ci/contract_diff.py --merge-group "$BASE" "$HEAD_SHA" --bodies-file "$RUNNER_TEMP/bodies.json"
