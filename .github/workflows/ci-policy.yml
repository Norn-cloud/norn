      - name: Validate candidate as data with base-owned policy
        run: python3 trusted/scripts/ci/validate-runner-policy.py --root candidate --maintainer-evidence "$RUNNER_TEMP/maintainer-approval.json" --rights-evidence "$RUNNER_TEMP/maintainer-approval.json" --head "${{ steps.pr.outputs.head_sha }}" --repository "${{ github.repository }}"
      - name: Report trusted policy on the exact PR head
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            let head='${{ steps.pr.outputs.head_sha }}';
            if(!head){const number=context.payload.pull_request?.number||context.payload.issue.number;
            head=(await github.rest.pulls.get({...context.repo,pull_number:number})).data.head.sha;}
            const fs=require('fs'), prefix=process.env.RUNNER_TEMP;
            let state='failure', d='0'.repeat(64), f=0;
