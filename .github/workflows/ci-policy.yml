name: Public core
run-name: ${{ github.event_name == 'pull_request' && github.event.action == 'ready_for_review' && format('READY {0} {1} {2}', github.event.pull_request.head.sha, github.event.pull_request.updated_at, github.sha) || github.event_name }}
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
  # Posting, editing or deleting `/approve-gates` re-runs trusted-policy for that PR.
  issue_comment:
    types: [created, edited, deleted]
  # Branch heads are checked by their pull_request run; a branch push run
  # would duplicate the full gate on the same commit.
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
# A newer push to a pull request cancels the run of its older head, and a newer
# push to main cancels the older main run: each main commit was already gated by
# its merge group, so only the latest main head needs the health/cache run.
# Every other event (merge-queue groups, the comment and trusted lanes) gets a
# group of its own, so workflow-level concurrency never cancels or holds it
# back. The trusted-policy job has a separate per-PR/issue group that can
# cancel an older trusted-policy run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && 'main-push' || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
jobs:
  core:
    if: github.event_name != 'pull_request_target' && github.event_name != 'issue_comment'
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      NORN_INTEROP_CACHE: ~/.cache/norn-interop
    runs-on: ${{ github.event_name == 'merge_group' && vars.NORN_MERGE_RUNNER == 'boat' && 'boat' || 'ubuntu-24.04' }}
    timeout-minutes: 110
    steps:
      - name: Reclaim runner disk space
        if: ${{ !(github.event_name == 'merge_group' && runner.environment == 'self-hosted') }}
        run: |
          set -euo pipefail
          minimum=$((12 * 1024 * 1024))
          available() { df -Pk / | awk 'NR == 2 {print $4}'; }
          df -h /
          if [ "$(available)" -lt "$minimum" ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          fi
          df -h /
          [ "$(available)" -ge "$minimum" ] || { echo "Insufficient runner space: need 12 GiB free"; df -Pk /; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      # Compiler outputs (sccache on the Actions cache: runs read the scopes of
      # their own ref, its base and main, and write only their own), the Cargo
      # home with registry and installed tools (saved only by main) and Bun's
      # package store.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: false
          shared-key: cargo-registry
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('tools/norn-ts/bun.lock', 'packages/norn-sdk/bun.lock', 'packages/norn-demo-ui/bun.lock') }}
      # Pinned interop schemas; erpnext_runtime.py re-checks every digest.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/norn-interop
          key: norn-interop-${{ hashFiles('scripts/importers/erpnext-runtime.lock.json') }}
      - run: bash scripts/ci/core.sh cheap
  # The full gate: `core.sh all` split into parallel jobs. The plan comes from
  # core.sh itself, so CI runs exactly its shards and phases (all but formal).
  # Pull requests and merge groups use affected plans; main runs the full set.
  plan:
    if: github.event_name != 'pull_request_target' && github.event_name != 'issue_comment' && !(github.event_name == 'pull_request' && github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: plan
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha || github.sha }}
        run: |
          if [ -n "$BASE" ]; then plan=$(bash scripts/ci/core.sh plan --affected "$BASE" "$HEAD_SHA"); else plan=$(bash scripts/ci/core.sh plan); fi
          plan=$(jq -c --arg base "$BASE" --arg head "$HEAD_SHA" '. + {base_sha: $base, head_sha: $head}' <<<"$plan")
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
          echo "$plan"
  test:
    name: bundle (${{ matrix.bundle.id }})
    needs: [core, plan]
    if: fromJSON(needs.plan.outputs.plan).bundle[0] != null
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      NORN_INTEROP_CACHE: ~/.cache/norn-interop
      NORN_CI_PACKAGES: ${{ fromJSON(needs.plan.outputs.plan).packages }}
      NORN_CI_REST_SHARDS: ${{ fromJSON(needs.plan.outputs.plan).rest_shards }}
      NORN_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || 'origin/main' }}
      PLAN: ${{ needs.plan.outputs.plan }}
      BUNDLE_ID: ${{ matrix.bundle.id }}
    runs-on: ${{ github.event_name == 'merge_group' && vars.NORN_MERGE_RUNNER == 'boat' && 'boat' || 'ubuntu-24.04' }}
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        bundle: ${{ fromJSON(needs.plan.outputs.plan).bundle }}
    steps:
      - name: Reclaim runner disk space
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          set -euo pipefail
          minimum=$((12 * 1024 * 1024))
          available() { df -Pk / | awk 'NR == 2 {print $4}'; }
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
          [ "$(available)" -ge "$minimum" ] || { echo "Insufficient runner space: need 12 GiB free"; df -Pk /; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      # Compiler outputs (sccache on the Actions cache: runs read the scopes of
      # their own ref, its base and main, and write only their own), the Cargo
      # home with registry and installed tools (saved only by main) and Bun's
      # package store.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: false
          shared-key: cargo-registry
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('tools/norn-ts/bun.lock', 'packages/norn-sdk/bun.lock', 'packages/norn-demo-ui/bun.lock') }}
      # Pinned interop schemas; erpnext_runtime.py re-checks every digest.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/norn-interop
          key: norn-interop-${{ hashFiles('scripts/importers/erpnext-runtime.lock.json') }}
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: nextest@0.9.150
      - run: bash scripts/ci/core.sh bundle "$PLAN" "$BUNDLE_ID"
  full:
    needs: [core, plan, test]
    if: >-
      always() && github.event_name != 'pull_request_target' && github.event_name != 'issue_comment' &&
      !(cancelled() && github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft || false }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha || github.sha }}
          PLAN: ${{ needs.plan.outputs.plan }}
          CORE: ${{ needs.core.result }}
          PLANNED: ${{ needs.plan.result }}
          TEST: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          [ "$EVENT" != pull_request ] || [ "$DRAFT" = false ] || { echo "Draft head is not admitted for full qualification"; exit 1; }
          jq -e --arg base "$BASE" --arg head "$HEAD_SHA" '
            type == "object" and (.mode == "full" or .mode == "affected") and
            .base_sha == $base and .head_sha == $head and
            (.shard | type == "array" and all(.[]; type == "string" and length > 0) and length == (unique | length)) and
            (.phase | type == "array" and all(.[]; type == "string" and length > 0) and length == (unique | length)) and
            (.bundle | type == "array" and length <= 6 and all(.[];
              type == "object" and (.id | type == "string" and length > 0) and
              (.tasks | type == "array" and length > 0 and all(.[]; type == "string"))) and
              (map(.id) | length) == (map(.id) | unique | length)) and
            ([.bundle[].tasks[]] | sort) == ([(.shard[] | "test/" + .), (.phase[] | "phase/" + .)] | sort)
          ' <<<"$PLAN" >/dev/null || { echo "Malformed or unbound gate plan"; exit 1; }
          # A job may be skipped only when the plan gave it nothing to run.
          ran() { [ "$1" = success ] || { [ "$1" = skipped ] && [ "$2" -eq 0 ]; }; }
          [ "$CORE" = success ] && [ "$PLANNED" = success ] || { echo "core $CORE, plan $PLANNED"; exit 1; }
          mode=$(jq -er .mode <<<"$PLAN")
          [ "$EVENT" = pull_request ] || [ "$EVENT" = merge_group ] || [ "$mode" = full ] || { echo "$EVENT needs the full plan, got $mode"; exit 1; }
          # An affected merge-group plan must keep the always-run phases (core.sh plan).
          [ "$EVENT" != merge_group ] || [ "$mode" = full ] || jq -e '(["guards", "provenance", "clippy"] - .phase) == []' <<<"$PLAN" >/dev/null || { echo "merge_group affected plan dropped an always-run phase"; exit 1; }
          ran "$TEST" "$(jq -er '.bundle | length' <<<"$PLAN")" || { echo "test ended $TEST"; exit 1; }
          echo "$mode plan passed: $(jq -r '.reason // "every shard and phase"' <<<"$PLAN")"
  trusted-policy:
    # Comment runs attach their job checks to the default branch. Keep the
    # PR-target job check distinct from the head-bound commit status below,
    # so cancelling it cannot leave a second required check cancelled (#127).
    name: trusted-policy evaluation
    # Write access serves only the last step, which removes a failing pull
    # request from the merge queue. No step runs candidate code.
    permissions:
      contents: write
      issues: read
      pull-requests: write
      statuses: write
    # An edit re-runs when either the new or the previous body mentions the
    # command, so removing an approval re-evaluates and fails closed. `contains`
    # also covers bodies the gate accepts after trimming.
    # Evaluate relevant events without an implicit success() precondition.
    # A cancelled run still cannot begin another policy evaluation.
    if: >-
      !cancelled() && (
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      (contains(github.event.comment.body, '/approve-gates') ||
      (github.event.action == 'edited' && contains(github.event.changes.body.from, '/approve-gates')))))
    # One trusted-policy run per pull request at a time: a newer run (a push, or
    # an approval posted, edited or deleted) cancels the older one, whose
    # always() reporter then writes failure, so a stale approval run can never
    # publish success after a revocation.
    concurrency:
      group: trusted-policy-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # A comment event carries the issue, not the pull request: read the PR
      # from the API, taking base and head from the same snapshot.
      - name: Resolve the pull request
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const event = context.payload.pull_request;
            const number = event ? event.number : context.payload.issue.number;
            const { data } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: number });
            core.setOutput('number', String(data.number));
            core.setOutput('base_sha', data.base.sha);
            core.setOutput('head_sha', data.head.sha);
            core.setOutput('head_repository', data.head.repo ? data.head.repo.full_name : '');
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.base_sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.pr.outputs.head_repository }}
          ref: ${{ steps.pr.outputs.head_sha }}
          path: candidate
          persist-credentials: false
      # Workflow and gate changes need a same-repository head and an unedited
      # `/approve-gates <head sha>` comment from an admin; comment events re-evaluate it.
      # Without this evidence such changes fail closed; data-only PRs
      # never need it.
      - name: Record admin approvals of the exact PR head
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: Number('${{ steps.pr.outputs.number }}') });
            // A commenter the API does not know as a user (a bot) has no
            // permission; any other API failure fails closed.
            const permissions = new Map();
            const permission = async (username) => {
              if (!permissions.has(username)) {
                const level = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username })
                  .then(({ data }) => data.permission, (error) => {
                    if (error.status === 404) return 'none';
                    throw error;
                  });
                permissions.set(username, level);
              }
              return permissions.get(username);
            };
            const comments = [];
            for (const comment of await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 })) {
              if (!comment.user || !(comment.body || '').trim().startsWith('/approve-gates')) continue;
              comments.push({ user: comment.user.login, body: comment.body, created_at: comment.created_at, updated_at: comment.updated_at, permission: await permission(comment.user.login) });
            }
            require('fs').writeFileSync(`${process.env.RUNNER_TEMP}/maintainer-approval.json`, JSON.stringify({
              repository: `${owner}/${repo}`,
              head_repository: pr.head.repo ? pr.head.repo.full_name : null,
              head_sha: pr.head.sha,
              comments
            }));
      - name: Validate candidate as data with base-owned policy
        run: python3 trusted/scripts/ci/validate-runner-policy.py --root candidate --maintainer-evidence "$RUNNER_TEMP/maintainer-approval.json"
      - name: Report trusted policy on the exact PR head
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            // If resolution failed there is no validated head: look it up again so
            // the failure still replaces any earlier success on that head.
            let sha = '${{ steps.pr.outputs.head_sha }}';
            if (!sha) {
              const number = context.payload.pull_request ? context.payload.pull_request.number : context.payload.issue.number;
              sha = (await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: number })).data.head.sha;
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'trusted-policy',
              description: 'Base-owned policy over candidate data',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      # A pull request whose head fails trusted-policy (for example after its
      # approval is revoked) leaves the merge queue, so no queued group built
      # from it lands on an earlier success. Inside this job, the per-PR
      # concurrency group orders it with every newer verdict; a superseded
      # (cancelled) run never dequeues.
      - name: Remove a failing pull request from the merge queue
        if: failure() && steps.pr.outputs.head_sha != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const { owner, repo } = context.repo;
            const number = Number('${{ steps.pr.outputs.number }}');
            const { repository } = await github.graphql(
              'query($owner: String!, $repo: String!, $number: Int!) { repository(owner: $owner, name: $repo) { pullRequest(number: $number) { id headRefOid mergeQueueEntry { id } } } }',
              { owner, repo, number });
            const pr = repository.pullRequest;
            // A newer head gets its own run, which decides for it.
            if (!pr.mergeQueueEntry || pr.headRefOid !== '${{ steps.pr.outputs.head_sha }}') return;
            await github.graphql('mutation($id: ID!) { dequeuePullRequest(input: { id: $id }) { clientMutationId } }', { id: pr.id });
            core.notice(`Removed #${number} from the merge queue: trusted-policy failed on its head.`);
  # D43, D47: base-owned wrappers run Kani and hax on the candidate. Those tools
  # compile candidate code, so this job is candidate-influenced: it holds no
  # secrets, a read-only token, no OIDC token and no cache (a cached tool
  # directory would let one candidate poison the tools of the next run), and
  # every receipt it writes is candidate-reported. Candidate builds share
  # this runner's UID with the wrapper and the receipt writer; isolating them,
  # and the runner token, is #969. The trusted bootstrap
  # installs the pinned tools only when the pull request changes an
  # implementation claim or an input of one.
  implementation-receipts:
    name: implementation receipts
    if: github.event_name == 'pull_request_target'
    permissions:
      contents: read
    concurrency:
      group: implementation-receipts-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      base_sha: ${{ steps.pr.outputs.base_sha }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - name: Resolve the pull request
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const { data } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: context.payload.pull_request.number });
            core.setOutput('base_sha', data.base.sha);
            core.setOutput('head_sha', data.head.sha);
            core.setOutput('head_repository', data.head.repo ? data.head.repo.full_name : '');
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.base_sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.pr.outputs.head_repository }}
          ref: ${{ steps.pr.outputs.head_sha }}
          path: candidate
          persist-credentials: false
      - name: Decide whether any implementation claim or input changed
        id: scope
        run: python3 trusted/scripts/ci/implementation_receipts.py scope --root candidate >> "$GITHUB_OUTPUT"
      - name: Run base-owned implementation wrappers
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: python3 trusted/scripts/ci/implementation_receipts.py run --root candidate --head "$HEAD_SHA" --receipts "$RUNNER_TEMP/implementation-receipts"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: implementation-receipts
          path: ${{ runner.temp }}/implementation-receipts
          if-no-files-found: ignore
          retention-days: 30
  # A fresh runner that executes no candidate code re-checks what it can
  # itself (F* over the uploaded model, with its own pinned F*), labels the
  # rest candidate-reported, and reports the verdict on the head. No claim is
  # admitted as implementation_proved until #969 isolates the producer. A
  # producer that did not succeed fails this check.
  implementation-receipt-check:
    name: implementation receipt check
    needs: [implementation-receipts]
    if: "!cancelled() && github.event_name == 'pull_request_target'"
    permissions:
      contents: read
      statuses: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Reject a receipt producer that did not succeed
        if: needs.implementation-receipts.result != 'success'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.implementation-receipts.outputs.base_sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ needs.implementation-receipts.outputs.head_sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: implementation-receipts
          path: ${{ runner.temp }}/implementation-receipts
      - name: Verify receipts with the base-owned verifier
        env:
          HEAD_SHA: ${{ needs.implementation-receipts.outputs.head_sha }}
        run: python3 trusted/scripts/ci/implementation_receipts.py verify --root candidate --head "$HEAD_SHA" --receipts "$RUNNER_TEMP/implementation-receipts"
      - name: Report implementation receipts on the exact PR head
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ needs.implementation-receipts.outputs.head_sha }}' || context.payload.pull_request.head.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'implementation-receipts',
              description: 'Base-owned implementation-proof receipts',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
