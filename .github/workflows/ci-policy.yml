name: Public core
run-name: ${{ github.event_name == 'pull_request' && github.event.action == 'ready_for_review' && format('READY {0} {1} {2}', github.event.pull_request.head.sha, github.event.pull_request.updated_at, github.sha) || github.event_name }}
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Branch heads are checked by their pull_request run; a branch push run
  # would duplicate the full gate on the same commit.
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
# A newer push to a pull request cancels the run of its older head, and a newer
# push to main cancels the older main run: each main commit was already gated by
# its merge group, so only the latest main head needs the health/cache run.
# Every other event (merge-queue groups, manual runs) gets a group of its own,
# so workflow-level concurrency never cancels or holds it back.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && 'main-push' || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
jobs:
  # The gate plan needs only git and Python, so it runs on a hosted runner of its own (no Boat
  # start) and the bundles start alongside core instead of after it (#1348).
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The full gate is `core.sh all` split into parallel bundle jobs. Pull requests run affected
      # bundles from `core.sh plan --affected`; merge-queue pushes to main on Boat warm the shared
      # R2 sccache from a single Boat VM via `core.sh plan --cache-warm` (#1951); merge groups,
      # human pushes and manual runs execute the complete bundle suite from `core.sh plan`.
      - id: plan
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          CACHE_WARM: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'github-merge-queue[bot]' && github.triggering_actor == 'github-merge-queue[bot]' && vars.NORN_MAIN_RUNNER == 'boat' }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha || github.sha }}
        run: |
          if [ -n "$BASE" ]; then plan=$(bash scripts/ci/core.sh plan --affected "$BASE" "$HEAD_SHA"); elif [ "$CACHE_WARM" = true ]; then plan=$(bash scripts/ci/core.sh plan --cache-warm); else plan=$(bash scripts/ci/core.sh plan); fi
          plan=$(jq -c --arg base "$BASE" --arg head "$HEAD_SHA" '. + {base_sha: $base, head_sha: $head}' <<<"$plan")
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
          echo "$plan"
  core:
    # The cheap gate runs on a free GitHub-hosted runner (no Boat start); bundles run
    # in parallel on Boat.
    permissions:
      contents: read
      actions: read # Enumerate deployment environments for the secret inventory.
    env:
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      NORN_INTEROP_CACHE: ~/.cache/norn-interop
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C linker-features=-lld -C link-arg=-fuse-ld=mold"
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Reclaim runner disk space
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          set -euo pipefail
          minimum=$((12 * 1024 * 1024))
          available() { df -Pk / | awk 'NR == 2 {print $4}'; }
          df -h /
          if [ "$(available)" -lt "$minimum" ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          fi
          df -h /
          [ "$(available)" -ge "$minimum" ] || { echo "Insufficient runner space: need 12 GiB free"; df -Pk /; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # `core` itself always runs on hosted ubuntu-24.04; same-repository pull-request
      # bundles run on Boat only while NORN_PR_RUNNER is 'boat', otherwise they fall
      # back to hosted runners, which must never go unnoticed. Fork pull requests run
      # hosted by design and stay quiet; `vars.NORN_PR_RUNNER != 'boat'` keeps this
      # quiet when bundles are on Boat. Keep the step text unchanged so base's
      # PINNED_STEPS (`("core", HOSTED_PR_WARNING)`) passes without a 2-PR stack.
      - name: Warn that pull request CI fell back to hosted runners
        if: ${{ runner.environment == 'github-hosted' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.NORN_PR_RUNNER != 'boat' }}
        run: |
          echo "::warning title=PR CI on hosted runners::PR CI is running on hosted runners: the repository variable NORN_PR_RUNNER is not 'boat', so this same-repository pull request fell back from Boat."
      # Stays as a skipped no-op on hosted `core` (`runner.environment == 'self-hosted'`)
      # so base's PINNED_STEPS (`("core", BOAT_LIBCLANG)`) passes without a 2-PR stack.
      - name: Make libclang loadable on Boat runners
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          set -euo pipefail
          libclang_dev_version='1:18.1.3-1ubuntu1'
          library=/usr/lib/llvm-18/lib/libclang.so
          if [ -e "$library" ]; then
            echo "$library is already present"
          elif ! { timeout 120 sudo apt-get update -qq && timeout 300 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "libclang-18-dev=$libclang_dev_version"; }; then
            echo "::warning::could not install libclang-18-dev=$libclang_dev_version; linking the image's libclang-18.so.18"
            sudo ln -sfn libclang-18.so.18 "$library"
          fi
          ls -l "$library" && [ -e "$library" ] || { echo "::error::$library is missing: clang-sys cannot load libclang"; exit 1; }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.5
      # Compiler outputs (sccache on the Actions cache: runs read the scopes of
      # their own ref, its base and main, and write only their own), the Cargo
      # home with registry and installed tools (saved only by main) and Bun's
      # package store.
      # The action's post-job `--show-stats` fails the job when the stats request fails,
      # even after a build that succeeded through the plain-rustc fallback; skip it.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
          disable_annotations: true
      - name: Start sccache or compile without it
        # Writes only constants this step computes (true/false, a path under RUNNER_TEMP).
        run: |
          set -uo pipefail
          # Hosted runners share the GitHub Actions cache. A disposable Boat VM never uses it (its
          # egress limit is account-wide): it keeps a local cache bounded by SCCACHE_CACHE_SIZE and,
          # when the project bucket's secrets are present, reads a shared R2 cache behind it. Only a
          # push to main (code that has landed) writes there. Merge groups and pull requests run code
          # that has not landed, so they get the read-only key and READ_ONLY mode. The keys are in
          # this step's environment and in the server it starts, which later steps share a user
          # with: what stops a write is the token's scope, not this step.
          gha=false
          [ "$RUNNER_ENVIRONMENT" != github-hosted ] || gha=true
          export SCCACHE_GHA_ENABLED=$gha
          echo "SCCACHE_GHA_ENABLED=$gha" >> "$GITHUB_ENV"
          if [ "$gha" = false ] && [ -n "${NORN_SCCACHE_BUCKET:-}" ] && [ -n "${NORN_SCCACHE_ENDPOINT:-}" ]; then
            mode=READ_ONLY
            case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
              push:refs/heads/main) mode=READ_WRITE ;;
            esac
            export SCCACHE_MULTILEVEL_CHAIN=disk,s3 SCCACHE_BUCKET="$NORN_SCCACHE_BUCKET" \
              SCCACHE_ENDPOINT="$NORN_SCCACHE_ENDPOINT" SCCACHE_REGION=auto SCCACHE_S3_KEY_PREFIX=norn/ \
              SCCACHE_S3_RW_MODE=$mode AWS_ACCESS_KEY_ID="${NORN_SCCACHE_KEY_ID:-}" \
              AWS_SECRET_ACCESS_KEY="${NORN_SCCACHE_SECRET:-}" SCCACHE_IDLE_TIMEOUT=0
            # The server must outlive idle stretches (tests, Bun): an idle exit would restart it
            # without this configuration, on the local cache only.
            echo "::notice::sccache: local disk, then the shared R2 cache ($mode)"
          fi
          # A cache outage must never fail a build. cargo runs `<wrapper> <rustc> <args>`, and
          # cc-rs wraps C/C++ builds (libduckdb-sys, ring, zstd-sys, libsqlite3-sys) only when
          # RUSTC_WRAPPER's file stem is `sccache` (cc::rustc_wrapper_fallback). Keep the wrapper
          # off PATH and invoke the real sccache by absolute path so it can never recurse; when
          # sccache itself fails (it reports `sccache: error: ...`, e.g. a dead server that
          # cannot restart), compile again with plain rustc. A compiler failure keeps its exit
          # status and diagnostics, also after a `sccache: warning:` (a local compile).
          real_sccache=$(command -v sccache || true)
          wrapper_dir="$RUNNER_TEMP/sccache-fallback"
          mkdir -p "$wrapper_dir"
          wrapper="$wrapper_dir/sccache"
          printf '#!/usr/bin/env bash\nreal_sccache=%q\n' "$real_sccache" > "$wrapper"
          cat >> "$wrapper" <<'WRAPPER'
          log=$(mktemp) || exec "$@"
          "$real_sccache" "$@" 2> "$log"
          status=$?
          if [ "$status" -ne 0 ] && grep -q '^sccache: error: ' "$log"; then
            echo "::warning::sccache failed ($(grep -m1 '^sccache: error: ' "$log")); compiling with plain rustc" >&2
            rm -f "$log"
            exec "$@"
          fi
          cat "$log" >&2
          rm -f "$log"
          exit "$status"
          WRAPPER
          chmod +x "$wrapper"
          if [ -n "$real_sccache" ] && "$real_sccache" --start-server; then
            echo "RUSTC_WRAPPER=$wrapper" >> "$GITHUB_ENV"
          else
            echo "::warning::sccache server unavailable; compiling with plain rustc"
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: false
          shared-key: cargo-registry
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('tools/norn-ts/bun.lock', 'tools/norn-proofs/bun.lock', 'packages/norn-sdk/bun.lock', 'packages/norn-demo-ui/bun.lock', 'packages/norn-react/bun.lock', 'apps/studio/bun.lock', 'apps/sidekick-bridge/bun.lock') }}
      # Pinned interop schemas; erpnext_runtime.py re-checks every digest.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/norn-interop
          key: norn-interop-${{ hashFiles('scripts/importers/erpnext-runtime.lock.json') }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: nextest@0.9.150,cargo-deny@0.19.0,wasm-bindgen@0.2.129,uv@0.13.10,mold@3.0.0
      - name: Audit Actions secret inventory
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I scripts/ci/actions-secret-inventory.py
      - run: bash scripts/ci/core.sh cheap
  # A draft head runs only core: no bundle until it is ready for review.
  test:
    name: bundle (${{ matrix.bundle.id }})
    needs: [plan]
    if: fromJSON(needs.plan.outputs.plan).bundle[0] != null && !(github.event_name == 'pull_request' && github.event.pull_request.draft)
    # Only `ci-cache-writer-boat` (deployment branch: main only) names the writer identity, whose
    # OIDC binding is that environment's immutable subject on a push to main of this workflow.
    # Merge groups and pull requests log in as the reader, which can reach only the read-only key.
    # A main push enters the environment exactly when the runner's main-push arm sends it to Boat
    # (#1369): made and started by the merge queue, with NORN_MAIN_RUNNER set. A human re-run or
    # push runs hosted, uses the Actions cache and never receives the key.
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'github-merge-queue[bot]' && github.triggering_actor == 'github-merge-queue[bot]' && vars.NORN_MAIN_RUNNER == 'boat' && 'ci-cache-writer-boat' || '' }}
    permissions:
      contents: read
      id-token: write # Read the shared cache keys from Infisical over OIDC.
    env:
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      NORN_INTEROP_CACHE: ~/.cache/norn-interop
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C linker-features=-lld -C link-arg=-fuse-ld=mold"
      NORN_CI_PACKAGES: ${{ fromJSON(needs.plan.outputs.plan).packages }}
      NORN_CI_REST_SHARDS: ${{ fromJSON(needs.plan.outputs.plan).rest_shards }}
      NORN_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || 'origin/main' }}
      PLAN: ${{ needs.plan.outputs.plan }}
      BUNDLE_ID: ${{ matrix.bundle.id }}
    runs-on: ${{ ((github.event_name == 'merge_group' && vars.NORN_MERGE_RUNNER == 'boat') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'Youssef-Tarek-Ali-26' && github.actor == 'Youssef-Tarek-Ali-26' && github.triggering_actor == 'Youssef-Tarek-Ali-26' && vars.NORN_PR_RUNNER == 'boat') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'github-merge-queue[bot]' && github.triggering_actor == 'github-merge-queue[bot]' && vars.NORN_MAIN_RUNNER == 'boat')) && 'boat' || 'ubuntu-24.04' }}
    timeout-minutes: 110
    strategy:
      fail-fast: ${{ github.event_name == 'merge_group' }}
      matrix:
        bundle: ${{ fromJSON(needs.plan.outputs.plan).bundle }}
    steps:
      - name: Reclaim runner disk space
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          set -euo pipefail
          minimum=$((12 * 1024 * 1024))
          available() { df -Pk / | awk 'NR == 2 {print $4}'; }
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
          [ "$(available)" -ge "$minimum" ] || { echo "Insufficient runner space: need 12 GiB free"; df -Pk /; exit 1; }
      - name: Reclaim Boat runner disk space
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          set -euo pipefail
          minimum=$((40 * 1024 * 1024))
          available() { df -Pk / | awk 'NR == 2 {print $4}'; }
          df -h /
          docker system prune --all --force
          rustup toolchain uninstall stable nightly-2025-03-01
          df -h /
          [ "$(available)" -ge "$minimum" ] || { echo "Insufficient Boat runner space: need 40 GiB free"; df -Pk /; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Boat's managed base image ships only the versioned libclang-18.so.18, which
      # clang-sys (bindgen) rejects; it loads the unversioned libclang.so that hosted
      # ubuntu-24.04 already has. Install it once per VM, or link it, then require it.
      - name: Make libclang loadable on Boat runners
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          set -euo pipefail
          libclang_dev_version='1:18.1.3-1ubuntu1'
          library=/usr/lib/llvm-18/lib/libclang.so
          if [ -e "$library" ]; then
            echo "$library is already present"
          elif ! { timeout 120 sudo apt-get update -qq && timeout 300 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "libclang-18-dev=$libclang_dev_version"; }; then
            echo "::warning::could not install libclang-18-dev=$libclang_dev_version; linking the image's libclang-18.so.18"
            sudo ln -sfn libclang-18.so.18 "$library"
          fi
          ls -l "$library" && [ -e "$library" ] || { echo "::error::$library is missing: clang-sys cannot load libclang"; exit 1; }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.5
      # Compiler outputs (sccache on the Actions cache: runs read the scopes of
      # their own ref, its base and main, and write only their own), the Cargo
      # home with registry and installed tools (saved only by main) and Bun's
      # package store.
      # The action's post-job `--show-stats` fails the job when the stats request fails,
      # even after a build that succeeded through the plain-rustc fallback; skip it.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
          disable_annotations: true
      # The shared cache's R2 keys live in Infisical. This step reads them over OIDC using the
      # helper pinned by the workflow contract. A push to main (Boat only, inside
      # `ci-cache-writer-boat`) logs in as the writer its environment variables name, in the writer's
      # own Infisical project; every other run as the reader, in the reader's project, which holds only
      # the read-only key. An unset variable yields '' (never the other role). With `--optional`, unset
      # variables, a fork or any failure keep Boat on its local cache: a cache outage never fails a build.
      - name: Read the shared cache keys from Infisical over OIDC
        id: sccache-keys
        if: ${{ runner.environment == 'self-hosted' }}
        env:
          INFISICAL_IDENTITY_ID: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.NORN_SCCACHE_WRITER_INFISICAL_IDENTITY_ID || github.event_name != 'push' && vars.NORN_SCCACHE_READER_INFISICAL_IDENTITY_ID || github.ref != 'refs/heads/main' && vars.NORN_SCCACHE_READER_INFISICAL_IDENTITY_ID || '' }}
          INFISICAL_PROJECT_ID: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.NORN_SCCACHE_WRITER_INFISICAL_PROJECT_ID || github.event_name != 'push' && vars.NORN_SCCACHE_READER_INFISICAL_PROJECT_ID || github.ref != 'refs/heads/main' && vars.NORN_SCCACHE_READER_INFISICAL_PROJECT_ID || '' }}
        run: bash scripts/ci/infisical-oidc.sh --optional prod /sccache NORN_SCCACHE_BUCKET NORN_SCCACHE_ENDPOINT NORN_SCCACHE_KEY_ID NORN_SCCACHE_SECRET
      - name: Start sccache or compile without it
        env:
          NORN_SCCACHE_BUCKET: ${{ steps.sccache-keys.outputs.norn_sccache_bucket }}
          NORN_SCCACHE_ENDPOINT: ${{ steps.sccache-keys.outputs.norn_sccache_endpoint }}
          NORN_SCCACHE_KEY_ID: ${{ steps.sccache-keys.outputs.norn_sccache_key_id }}
          NORN_SCCACHE_SECRET: ${{ steps.sccache-keys.outputs.norn_sccache_secret }}
        # Writes only constants this step computes (true/false, a path under RUNNER_TEMP).
        run: |
          set -uo pipefail
          # Hosted runners share the GitHub Actions cache. A disposable Boat VM never uses it (its
          # egress limit is account-wide): it keeps a local cache bounded by SCCACHE_CACHE_SIZE and,
          # when the project bucket's secrets are present, reads a shared R2 cache behind it. Only a
          # push to main (code that has landed) writes there. Merge groups and pull requests run code
          # that has not landed, so they get the read-only key and READ_ONLY mode. The keys are in
          # this step's environment and in the server it starts, which later steps share a user
          # with: what stops a write is the token's scope, not this step.
          gha=false
          [ "$RUNNER_ENVIRONMENT" != github-hosted ] || gha=true
          export SCCACHE_GHA_ENABLED=$gha
          echo "SCCACHE_GHA_ENABLED=$gha" >> "$GITHUB_ENV"
          if [ "$gha" = false ] && [ -n "${NORN_SCCACHE_BUCKET:-}" ] && [ -n "${NORN_SCCACHE_ENDPOINT:-}" ]; then
            mode=READ_ONLY
            case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
              push:refs/heads/main) mode=READ_WRITE ;;
            esac
            export SCCACHE_MULTILEVEL_CHAIN=disk,s3 SCCACHE_BUCKET="$NORN_SCCACHE_BUCKET" \
              SCCACHE_ENDPOINT="$NORN_SCCACHE_ENDPOINT" SCCACHE_REGION=auto SCCACHE_S3_KEY_PREFIX=norn/ \
              SCCACHE_S3_RW_MODE=$mode AWS_ACCESS_KEY_ID="${NORN_SCCACHE_KEY_ID:-}" \
              AWS_SECRET_ACCESS_KEY="${NORN_SCCACHE_SECRET:-}" SCCACHE_IDLE_TIMEOUT=0
            # The server must outlive idle stretches (tests, Bun): an idle exit would restart it
            # without this configuration, on the local cache only.
            echo "::notice::sccache: local disk, then the shared R2 cache ($mode)"
          fi
          # A cache outage must never fail a build. cargo runs `<wrapper> <rustc> <args>`, and
          # cc-rs wraps C/C++ builds (libduckdb-sys, ring, zstd-sys, libsqlite3-sys) only when
          # RUSTC_WRAPPER's file stem is `sccache` (cc::rustc_wrapper_fallback). Keep the wrapper
          # off PATH and invoke the real sccache by absolute path so it can never recurse; when
          # sccache itself fails (it reports `sccache: error: ...`, e.g. a dead server that
          # cannot restart), compile again with plain rustc. A compiler failure keeps its exit
          # status and diagnostics, also after a `sccache: warning:` (a local compile).
          real_sccache=$(command -v sccache || true)
          wrapper_dir="$RUNNER_TEMP/sccache-fallback"
          mkdir -p "$wrapper_dir"
          wrapper="$wrapper_dir/sccache"
          printf '#!/usr/bin/env bash\nreal_sccache=%q\n' "$real_sccache" > "$wrapper"
          cat >> "$wrapper" <<'WRAPPER'
          log=$(mktemp) || exec "$@"
          "$real_sccache" "$@" 2> "$log"
          status=$?
          if [ "$status" -ne 0 ] && grep -q '^sccache: error: ' "$log"; then
            echo "::warning::sccache failed ($(grep -m1 '^sccache: error: ' "$log")); compiling with plain rustc" >&2
            rm -f "$log"
            exec "$@"
          fi
          cat "$log" >&2
          rm -f "$log"
          exit "$status"
          WRAPPER
          chmod +x "$wrapper"
          if [ -n "$real_sccache" ] && "$real_sccache" --start-server; then
            echo "RUSTC_WRAPPER=$wrapper" >> "$GITHUB_ENV"
          else
            echo "::warning::sccache server unavailable; compiling with plain rustc"
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: false
          shared-key: cargo-registry
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('tools/norn-ts/bun.lock', 'tools/norn-proofs/bun.lock', 'packages/norn-sdk/bun.lock', 'packages/norn-demo-ui/bun.lock', 'packages/norn-react/bun.lock', 'apps/studio/bun.lock', 'apps/sidekick-bridge/bun.lock') }}
      # Pinned interop schemas; erpnext_runtime.py re-checks every digest.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/norn-interop
          key: norn-interop-${{ hashFiles('scripts/importers/erpnext-runtime.lock.json') }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: nextest@0.9.150,cargo-deny@0.19.0,wasm-bindgen@0.2.129,uv@0.13.10,mold@3.0.0
      - run: bash scripts/ci/core.sh bundle "$PLAN" "$BUNDLE_ID"
  full:
    needs: [plan, core, test]
    if: always() && !(cancelled() && github.event_name == 'pull_request' && !github.event.pull_request.draft)
    # The required verdict stays hosted: it must report even when Boat cannot start a VM.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft || false }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          CACHE_WARM: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'github-merge-queue[bot]' && github.triggering_actor == 'github-merge-queue[bot]' && vars.NORN_MAIN_RUNNER == 'boat' }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha || github.sha }}
          PLAN: ${{ needs.plan.outputs.plan }}
          PLANNER: ${{ needs.plan.result }}
          CORE: ${{ needs.core.result }}
          TEST: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          [ "$EVENT" != pull_request ] || [ "$DRAFT" = false ] || { echo "Draft head is not admitted for full qualification"; exit 1; }
          [ "$PLANNER" = success ] || { echo "plan $PLANNER"; exit 1; }
          jq -e --arg base "$BASE" --arg head "$HEAD_SHA" '
            type == "object" and (.mode == "full" or .mode == "affected" or .mode == "cache-warm") and
            .base_sha == $base and .head_sha == $head and
            (.shard | type == "array" and all(.[]; type == "string" and length > 0) and length == (unique | length)) and
            (.phase | type == "array" and all(.[]; type == "string" and length > 0) and length == (unique | length)) and
            (.bundle | type == "array" and length >= 1 and length <= 8 and all(.[];
              type == "object" and (.id | type == "string" and length > 0) and
              (.tasks | type == "array" and length > 0 and all(.[]; type == "string"))) and
              (map(.id) | length) == (map(.id) | unique | length)) and
            ([.bundle[].tasks[]] | sort) == ([(.shard[] | "test/" + .), (.phase[] | "phase/" + .)] | sort) and
            (.mode != "cache-warm" or ((.packages == null or .packages == "") and .shard == [] and .phase == ["cache-warm-test", "cache-warm-guard", "cache-warm-clippy", "cache-warm-doc", "cache-warm-wasm", "cache-warm-wasm-pkg", "cache-warm-duckdb", "cache-warm-rivet"] and .bundle == [{"id": "b0", "tasks": ["phase/cache-warm-test", "phase/cache-warm-guard", "phase/cache-warm-clippy", "phase/cache-warm-doc", "phase/cache-warm-wasm", "phase/cache-warm-wasm-pkg", "phase/cache-warm-duckdb", "phase/cache-warm-rivet"]}]))
          ' <<<"$PLAN" >/dev/null || { echo "Malformed or unbound gate plan"; exit 1; }
          [ "$CORE" = success ] || { echo "core $CORE"; exit 1; }
          mode=$(jq -er .mode <<<"$PLAN")
          # Only pull-request feedback is narrowed, and only merge-queue pushes to main on Boat run the
          # single-bundle cache-warm plan (after merge_group ran the complete suite). Merge groups,
          # human pushes and manual runs always require the full plan (#1348, #1951).
          if [ "$EVENT" = pull_request ]; then
            [ "$mode" = affected ] || [ "$mode" = full ] || { echo "$EVENT cannot use $mode plan"; exit 1; }
          elif [ "$EVENT" = push ] && [ "$CACHE_WARM" = true ]; then
            [ "$mode" = cache-warm ] || [ "$mode" = full ] || { echo "$EVENT needs full or cache-warm plan, got $mode"; exit 1; }
          else
            [ "$mode" = full ] || { echo "$EVENT needs the full plan, got $mode"; exit 1; }
          fi
          [ "$TEST" = success ] || { echo "test ended $TEST"; exit 1; }
          echo "$mode plan passed: $(jq -r '.reason // "every shard and phase"' <<<"$PLAN")"
