name: Public core
on:
  pull_request:
  pull_request_target:
  # Posting, editing or deleting `/approve-gates` re-runs trusted-policy for that PR.
  issue_comment:
    types: [created, edited, deleted]
  push:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    if: github.event_name != 'pull_request_target' && github.event_name != 'issue_comment'
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      # Compiler outputs (sccache on the Actions cache: runs read the scopes of
      # their own ref, its base and main, and write only their own), the Cargo
      # registry (saved only by main) and Bun's package store.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: false
          shared-key: cargo-registry
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('tools/norn-ts/bun.lock', 'packages/norn-sdk/bun.lock') }}
      - run: bash scripts/ci/core.sh cheap
  # The full gate: `core.sh all` split into parallel jobs. The plan comes from
  # core.sh itself, so CI runs exactly its shards and phases.
  plan:
    if: github.event_name != 'pull_request_target' && github.event_name != 'issue_comment'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        run: echo "plan=$(bash scripts/ci/core.sh plan)" >> "$GITHUB_OUTPUT"
  test:
    needs: plan
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.plan).shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      # Compiler outputs (sccache on the Actions cache: runs read the scopes of
      # their own ref, its base and main, and write only their own), the Cargo
      # registry (saved only by main) and Bun's package store.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: false
          shared-key: cargo-registry
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('tools/norn-ts/bun.lock', 'packages/norn-sdk/bun.lock') }}
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: nextest@0.9.150
      - run: bash scripts/ci/core.sh test ${{ matrix.shard }}
  phase:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        phase: ${{ fromJSON(needs.plan.outputs.plan).phase }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      # Shrink-only baselines compare against the commit this one lands on.
      NORN_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      # Compiler outputs (sccache on the Actions cache: runs read the scopes of
      # their own ref, its base and main, and write only their own), the Cargo
      # registry (saved only by main) and Bun's package store.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: false
          shared-key: cargo-registry
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('tools/norn-ts/bun.lock', 'packages/norn-sdk/bun.lock') }}
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: nextest@0.9.150
      - run: bash scripts/ci/core.sh ${{ matrix.phase }}
  # The single required verdict: every planned job ran and passed.
  full:
    needs: [core, plan, test, phase]
    if: always() && github.event_name != 'pull_request_target' && github.event_name != 'issue_comment'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "a full-gate job ended $result: $RESULTS"; exit 1; }
          done
          [ "$(echo $RESULTS | wc -w)" -eq 4 ]
  trusted-policy:
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    # An edit re-runs when either the new or the previous body mentions the
    # command, so removing an approval re-evaluates and fails closed. `contains`
    # also covers bodies the gate accepts after trimming.
    # A merge-queue group re-runs it on the group's head commit, the commit
    # that lands on main.
    if: >-
      github.event_name == 'pull_request_target' || github.event_name == 'merge_group' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      (contains(github.event.comment.body, '/approve-gates') ||
      (github.event.action == 'edited' && contains(github.event.changes.body.from, '/approve-gates'))))
    # One trusted-policy run per pull request at a time: a newer run (a push, or
    # an approval posted, edited or deleted) cancels the older one, whose
    # always() reporter then writes failure, so a stale approval run can never
    # publish success after a revocation.
    concurrency:
      group: trusted-policy-${{ github.event.pull_request.number || github.event.issue.number || github.event.merge_group.head_sha }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # A comment event carries the issue, not the pull request: read the PR
      # from the API, taking base and head from the same snapshot. A merge
      # group is checked at its head commit against its base.
      - name: Resolve the pull request
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const group = context.payload.merge_group;
            if (group) {
              core.setOutput('base_sha', group.base_sha);
              core.setOutput('head_sha', group.head_sha);
              core.setOutput('head_repository', `${context.repo.owner}/${context.repo.repo}`);
              return;
            }
            const event = context.payload.pull_request;
            const number = event ? event.number : context.payload.issue.number;
            const { data } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: number });
            core.setOutput('number', String(data.number));
            core.setOutput('base_sha', data.base.sha);
            core.setOutput('head_sha', data.head.sha);
            core.setOutput('head_repository', data.head.repo ? data.head.repo.full_name : '');
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.base_sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.pr.outputs.head_repository }}
          ref: ${{ steps.pr.outputs.head_sha }}
          path: candidate
          persist-credentials: false
          # The gate walks a merge group's merges down to its base.
          fetch-depth: ${{ github.event_name == 'merge_group' && '0' || '1' }}
      # Workflow and gate changes need a same-repository head and an unedited
      # `/approve-gates <head sha>` comment from an admin; re-run this job after
      # commenting. Without this evidence such changes fail closed; data-only PRs
      # never need it.
      - name: Record admin approvals of the exact PR head
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            // A commenter the API does not know as a user (a bot) has no
            // permission; any other API failure fails closed.
            const permissions = new Map();
            const permission = async (username) => {
              if (!permissions.has(username)) {
                const level = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username })
                  .then(({ data }) => data.permission, (error) => {
                    if (error.status === 404) return 'none';
                    throw error;
                  });
                permissions.set(username, level);
              }
              return permissions.get(username);
            };
            const approvals = async (pr) => {
              const comments = [];
              for (const comment of await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 })) {
                if (!comment.user || !(comment.body || '').trim().startsWith('/approve-gates')) continue;
                comments.push({ user: comment.user.login, body: comment.body, created_at: comment.created_at, updated_at: comment.updated_at, permission: await permission(comment.user.login) });
              }
              return { number: pr.number, head_repository: pr.head.repo ? pr.head.repo.full_name : null, head_sha: pr.head.sha, comments };
            };
            const write = (evidence) => require('fs').writeFileSync(`${process.env.RUNNER_TEMP}/maintainer-approval.json`, JSON.stringify(evidence));
            const group = context.payload.merge_group;
            if (group) {
              // Each queued pull request is the second parent of one merge on the
              // first-parent path from the group head to its base. The gate walks
              // the same path in git and decides; this only records approvals.
              const pull_requests = [];
              let sha = group.head_sha;
              for (let step = 0; sha !== group.base_sha && step < 64; step++) {
                const { data: commit } = await github.rest.repos.getCommit({ owner, repo, ref: sha });
                if (commit.parents.length !== 2) break;
                const head = commit.parents[1].sha;
                const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: head });
                for (const pr of pulls.filter((pr) => pr.head.sha === head)) pull_requests.push(await approvals(pr));
                sha = commit.parents[0].sha;
              }
              write({ repository: `${owner}/${repo}`, merge_group: { base_sha: group.base_sha, head_sha: group.head_sha }, pull_requests });
              return;
            }
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: Number('${{ steps.pr.outputs.number }}') });
            write({ repository: `${owner}/${repo}`, ...await approvals(pr) });
      - name: Validate candidate as data with base-owned policy
        run: python3 trusted/scripts/ci/validate-runner-policy.py --root candidate --maintainer-evidence "$RUNNER_TEMP/maintainer-approval.json"
      - name: Report trusted policy on the exact PR head
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            // If resolution failed there is no validated head: look it up again so
            // the failure still replaces any earlier success on that head.
            let sha = '${{ steps.pr.outputs.head_sha }}';
            if (!sha && context.payload.merge_group) {
              sha = context.payload.merge_group.head_sha;
            } else if (!sha) {
              const number = context.payload.pull_request ? context.payload.pull_request.number : context.payload.issue.number;
              sha = (await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: number })).data.head.sha;
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'trusted-policy',
              description: 'Base-owned policy over candidate data',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
