name: Public core
run-name: ${{ github.event_name == 'pull_request' && github.event.action == 'ready_for_review' && format('READY {0} {1} {2}', github.event.pull_request.head.sha, github.event.pull_request.updated_at, github.sha) || github.event_name }}
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
  # Posting, editing or deleting `/approve-gates` re-runs trusted-policy for that PR.
  issue_comment:
    types: [created, edited, deleted]
  # Branch heads are checked by their pull_request run; a branch push run
  # would duplicate the full gate on the same commit.
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
# A newer push to a pull request cancels the run of its older head, and a newer
# push to main cancels the older main run: each main commit was already gated by
# its merge group, so only the latest main head needs the health/cache run.
# Every other event (merge-queue groups, the comment and trusted lanes) gets a
# group of its own, so workflow-level concurrency never cancels or holds it
# back. The trusted-policy job has a separate per-PR/issue group that can
# cancel an older trusted-policy run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && 'main-push' || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
jobs:
  core:
    if: github.event_name != 'pull_request_target' && github.event_name != 'issue_comment'
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      NORN_INTEROP_CACHE: ~/.cache/norn-interop
      NORN_CI_HEAD: ${{ github.event.merge_group.head_sha || github.sha }}
    runs-on: ${{ github.event_name == 'merge_group' && vars.NORN_MERGE_RUNNER == 'boat' && 'boat' || 'ubuntu-24.04' }}
    timeout-minutes: 110
    steps:
      - name: Reclaim runner disk space
        if: ${{ !(github.event_name == 'merge_group' && runner.environment == 'self-hosted') }}
        run: |
          set -euo pipefail
          minimum=$((12 * 1024 * 1024))
          available() { df -Pk / | awk 'NR == 2 {print $4}'; }
          df -h /
          if [ "$(available)" -lt "$minimum" ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          fi
          df -h /
          [ "$(available)" -ge "$minimum" ] || { echo "Insufficient runner space: need 12 GiB free"; df -Pk /; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      # Compiler outputs (sccache on the Actions cache: runs read the scopes of
      # their own ref, its base and main, and write only their own), the Cargo
      # home with registry and installed tools (saved only by main) and Bun's
      # package store.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: false
          shared-key: cargo-registry
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('tools/norn-ts/bun.lock', 'packages/norn-sdk/bun.lock', 'packages/norn-demo-ui/bun.lock') }}
      # Pinned interop schemas; erpnext_runtime.py re-checks every digest.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/norn-interop
          key: norn-interop-${{ hashFiles('scripts/importers/erpnext-runtime.lock.json') }}
      - run: bash scripts/ci/core.sh cheap
  # The full gate: `core.sh all` split into parallel jobs. The plan comes from
  # core.sh itself, so CI runs exactly its shards and phases (all but formal).
  # Pull requests and merge groups use affected plans; main runs the full set.
  plan:
    if: github.event_name != 'pull_request_target' && github.event_name != 'issue_comment' && !(github.event_name == 'pull_request' && github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: plan
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha || github.sha }}
        run: |
          if [ -n "$BASE" ]; then plan=$(bash scripts/ci/core.sh plan --affected "$BASE" "$HEAD_SHA"); else plan=$(bash scripts/ci/core.sh plan); fi
          plan=$(jq -c --arg base "$BASE" --arg head "$HEAD_SHA" '. + {base_sha: $base, head_sha: $head}' <<<"$plan")
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
          echo "$plan"
  test:
    name: bundle (${{ matrix.bundle.id }})
    needs: [core, plan]
    if: fromJSON(needs.plan.outputs.plan).bundle[0] != null
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      NORN_INTEROP_CACHE: ~/.cache/norn-interop
      NORN_CI_HEAD: ${{ github.event.merge_group.head_sha || github.sha }}
      NORN_CI_PACKAGES: ${{ fromJSON(needs.plan.outputs.plan).packages }}
      NORN_CI_REST_SHARDS: ${{ fromJSON(needs.plan.outputs.plan).rest_shards }}
      NORN_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || 'origin/main' }}
      PLAN: ${{ needs.plan.outputs.plan }}
      BUNDLE_ID: ${{ matrix.bundle.id }}
    runs-on: ${{ github.event_name == 'merge_group' && vars.NORN_MERGE_RUNNER == 'boat' && 'boat' || 'ubuntu-24.04' }}
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        bundle: ${{ fromJSON(needs.plan.outputs.plan).bundle }}
    steps:
      - name: Reclaim runner disk space
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          set -euo pipefail
          minimum=$((12 * 1024 * 1024))
          available() { df -Pk / | awk 'NR == 2 {print $4}'; }
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
          [ "$(available)" -ge "$minimum" ] || { echo "Insufficient runner space: need 12 GiB free"; df -Pk /; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      # Compiler outputs (sccache on the Actions cache: runs read the scopes of
      # their own ref, its base and main, and write only their own), the Cargo
      # home with registry and installed tools (saved only by main) and Bun's
      # package store.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: false
          shared-key: cargo-registry
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('tools/norn-ts/bun.lock', 'packages/norn-sdk/bun.lock', 'packages/norn-demo-ui/bun.lock') }}
      # Pinned interop schemas; erpnext_runtime.py re-checks every digest.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/norn-interop
          key: norn-interop-${{ hashFiles('scripts/importers/erpnext-runtime.lock.json') }}
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: nextest@0.9.150
      - run: bash scripts/ci/core.sh bundle "$PLAN" "$BUNDLE_ID"
  full:
    needs: [core, plan, test]
    if: >-
      always() && github.event_name != 'pull_request_target' && github.event_name != 'issue_comment' &&
      !(cancelled() && github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft || false }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha || github.sha }}
          PLAN: ${{ needs.plan.outputs.plan }}
          CORE: ${{ needs.core.result }}
          PLANNED: ${{ needs.plan.result }}
          TEST: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          [ "$EVENT" != pull_request ] || [ "$DRAFT" = false ] || { echo "Draft head is not admitted for full qualification"; exit 1; }
          jq -e --arg base "$BASE" --arg head "$HEAD_SHA" '
            type == "object" and (.mode == "full" or .mode == "affected") and
            .base_sha == $base and .head_sha == $head and
            (.shard | type == "array" and all(.[]; type == "string" and length > 0) and length == (unique | length)) and
            (.phase | type == "array" and all(.[]; type == "string" and length > 0) and length == (unique | length)) and
            (.bundle | type == "array" and length <= 6 and all(.[];
              type == "object" and (.id | type == "string" and length > 0) and
              (.tasks | type == "array" and length > 0 and all(.[]; type == "string"))) and
              (map(.id) | length) == (map(.id) | unique | length)) and
            ([.bundle[].tasks[]] | sort) == ([(.shard[] | "test/" + .), (.phase[] | "phase/" + .)] | sort)
          ' <<<"$PLAN" >/dev/null || { echo "Malformed or unbound gate plan"; exit 1; }
          # A job may be skipped only when the plan gave it nothing to run.
          ran() { [ "$1" = success ] || { [ "$1" = skipped ] && [ "$2" -eq 0 ]; }; }
          [ "$CORE" = success ] && [ "$PLANNED" = success ] || { echo "core $CORE, plan $PLANNED"; exit 1; }
          mode=$(jq -er .mode <<<"$PLAN")
          [ "$EVENT" = pull_request ] || [ "$EVENT" = merge_group ] || [ "$mode" = full ] || { echo "$EVENT needs the full plan, got $mode"; exit 1; }
          # An affected merge-group plan must keep the always-run phases (core.sh plan).
          [ "$EVENT" != merge_group ] || [ "$mode" = full ] || jq -e '(["guards", "provenance", "clippy"] - .phase) == []' <<<"$PLAN" >/dev/null || { echo "merge_group affected plan dropped an always-run phase"; exit 1; }
          ran "$TEST" "$(jq -er '.bundle | length' <<<"$PLAN")" || { echo "test ended $TEST"; exit 1; }
          echo "$mode plan passed: $(jq -r '.reason // "every shard and phase"' <<<"$PLAN")"
  rights-capture:
    name: Capture immutable rights event ${{ github.event.issue.pull_request && 'pull' || 'issue' }}
    if: github.event_name == 'issue_comment'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      heads: ${{ steps.payload.outputs.heads }}
      kind: ${{ steps.payload.outputs.kind }}
      comment: ${{ steps.payload.outputs.comment }}
      payload: ${{ steps.payload.outputs.payload }}
    steps:
      - name: Capture the saved rights payload
        id: payload
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const p = context.payload, c = p.comment;
            if (!c || !Number.isSafeInteger(c.id)) throw new Error('Missing saved comment identity');
            const kind = p.issue?.pull_request ? 'pull' : 'issue', entries = [];
            if (kind === 'pull') {
              if (!['created', 'edited', 'deleted'].includes(p.action)) throw new Error('Unknown rights event action');
              for (const body of [c.body, p.changes?.body?.from]) {
                const match = (body || '').trim().match(/^\/(ack|revoke)-rights ([0-9a-f]{40})$/);
                if (!match) continue;
                const decision = match[1] === 'revoke' ? 'revoke' : p.action === 'created' ? 'ack' : 'withdraw';
                if (!entries.some(e => e.head === match[2] && e.kind === decision)) entries.push({head:match[2],kind:decision});
              }
            }
            const heads = [...new Set(entries.map(e => e.head))].sort().join(',') || 'none';
            core.setOutput('kind', kind); core.setOutput('heads', heads); core.setOutput('comment', String(c.id));
            core.setOutput('payload', JSON.stringify({kind,heads,comment:c.id,author:c.user?.login || null,created_at:c.created_at,entries}));
  rights-revocation:
    name: Rights ledger ${{ needs.rights-capture.outputs.heads }} comment ${{ needs.rights-capture.outputs.comment }}
    needs: rights-capture
    if: >-
      !cancelled() && needs.rights-capture.result == 'success' && needs.rights-capture.outputs.kind == 'pull'
    permissions:
      contents: read
      statuses: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Persist the target rights ledger
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RIGHTS_EVENT: ${{ needs.rights-capture.outputs.payload }}
        with:
          retries: 3
          script: |
            const {owner,repo} = context.repo, event = JSON.parse(process.env.RIGHTS_EVENT);
            const heads = [...new Set(event.entries.map(e => e.head))].sort().join(',') || 'none';
            if (heads !== event.heads || !Number.isSafeInteger(event.comment)) throw new Error('Saved rights target mismatch');
            if (event.kind !== 'pull' || heads === 'none') return;
            const attempt = Number(process.env.GITHUB_RUN_ATTEMPT);
            if (!Number.isSafeInteger(attempt) || attempt < 1) throw new Error('Missing rights attempt');
            const actor = attempt > 1 ? process.env.GITHUB_TRIGGERING_ACTOR : event.author;
            const permission = actor ? (await github.rest.repos.getCollaboratorPermissionLevel({owner,repo,username:actor})
              .catch(error => {if (error.status === 404) return {data:{permission:'none'}}; throw error;})).data.permission : 'none';
            if (attempt > 1 && permission !== 'admin') throw new Error('Rights reconciliation requires an admin');
            for (const head of heads.split(',')) {
              if (!/^[0-9a-f]{40}$/.test(head)) throw new Error('Invalid saved rights head');
              const {data:commit} = await github.rest.repos.getCommit({owner,repo,ref:head}), tree = commit.commit.tree.sha;
              if (!/^[0-9a-f]{40}$/.test(tree)) throw new Error('Invalid immutable rights tree');
              const decisions = attempt > 1 ? ['revoke'] : permission === 'admin'
                ? event.entries.filter(e => e.head === head).map(e => e.kind) : ['ignore'];
              for (const kind of decisions) {
                await github.rest.repos.createCommitStatus({owner,repo,sha:head,state:'success',
                  context:`rights-ledger/${tree}/${context.runId}/${attempt}`,
                  description:JSON.stringify({v:1,r:context.runId,a:attempt,c:event.comment,k:kind,t:event.created_at})});
              }
              if (decisions.some(kind => kind === 'revoke' || kind === 'withdraw')) {
                await github.rest.repos.createCommitStatus({owner,repo,sha:head,state:'failure',
                  context:'trusted-policy',description:'Rights withdrawn; fresh target review required'});
              }
            }
  trusted-policy:
    needs: rights-revocation
    # Comment runs attach their job checks to the default branch. Keep the
    # PR-target job check distinct from the head-bound commit status below,
    # so cancelling it cannot leave a second required check cancelled (#127).
    name: trusted-policy evaluation
    # Write access serves only the last step, which removes a failing pull
    # request from the merge queue. No step runs candidate code.
    permissions:
      actions: read
      contents: write
      issues: read
      pull-requests: write
      statuses: write
    # An edit re-runs when either the new or the previous body mentions the
    # command, so removing an approval re-evaluates and fails closed. `contains`
    # also covers bodies the gate accepts after trimming.
    # Evaluate relevant events without an implicit success() precondition.
    # A cancelled run still cannot begin another policy evaluation.
    if: >-
      !cancelled() && (
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      (contains(github.event.comment.body, '/approve-gates') || contains(github.event.comment.body, '/ack-rights') || contains(github.event.comment.body, '/revoke-rights') ||
      (github.event.action == 'edited' && (contains(github.event.changes.body.from, '/approve-gates') || contains(github.event.changes.body.from, '/ack-rights') || contains(github.event.changes.body.from, '/revoke-rights'))))))
    # One trusted-policy run per pull request at a time: a newer run (a push, or
    # an approval posted, edited or deleted) cancels the older one, whose
    # always() reporter then writes failure, so a stale approval run can never
    # publish success after a revocation.
    concurrency:
      group: trusted-policy-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # A comment event carries the issue, not the pull request: read the PR
      # from the API, taking base and head from the same snapshot.
      - name: Resolve the pull request
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const event = context.payload.pull_request;
            const number = event ? event.number : context.payload.issue.number;
            const { data } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: number });
            core.setOutput('number', String(data.number));
            core.setOutput('base_sha', data.base.sha);
            core.setOutput('head_sha', data.head.sha);
            core.setOutput('head_repository', data.head.repo ? data.head.repo.full_name : '');
      - name: Require durable revocation recording
        env:
          RESULT: ${{ needs.rights-revocation.result }}
        run: test "$RESULT" = success || test "$RESULT" = skipped
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.base_sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.pr.outputs.head_repository }}
          ref: ${{ steps.pr.outputs.head_sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      # Workflow and gate changes need a same-repository head and an unedited
      # `/approve-gates <head sha>` comment from an admin; comment events re-evaluate it.
      # Without this evidence such changes fail closed; data-only PRs
      # never need it.
      - name: Record admin approvals of the exact PR head
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const {owner,repo}=context.repo;
            const evidencePath = `${process.env.RUNNER_TEMP}/maintainer-approval.json`;
            require('fs').rmSync(evidencePath,{force:true});
            const permissionCache = new Map();
            const permission = async username => {
              if (!permissionCache.has(username)) permissionCache.set(username,
                (await github.rest.repos.getCollaboratorPermissionLevel({owner,repo,username})
                  .catch(error => {if (error.status === 404) return {data:{permission:'none'}}; throw error;})).data.permission);
              return permissionCache.get(username);
            };
            const ledgerIndex = async () => {
              const nodes=[], unknown=[], seen=new Set(), definitions=new Map();
              let expected, witnessed=false;
              const admission=context.payload.workflow_run?.id || context.runId;
              for (let page=1;page<=100;page++) {
                const {data}=await github.rest.actions.listWorkflowRuns({owner,repo,workflow_id:'ci-policy.yml',per_page:100,page});
                if (!Array.isArray(data.workflow_runs) || !data.workflow_runs.length) break;
                for (const run of data.workflow_runs) {
                  if (seen.has(run.id)) continue;
                  seen.add(run.id);
                  if (!Number.isSafeInteger(run.run_number) || run.run_number<1 ||
                      (expected!==undefined && run.run_number!==expected)) throw new Error('Incomplete rights event history');
                  expected=run.run_number-1; witnessed ||= run.id===admission;
                  if (run.event==='issue_comment') {
                    if (!definitions.has(run.head_sha)) {
                      const {data:file}=await github.rest.repos.getContent({owner,repo,path:'.github/workflows/ci-policy.yml',ref:run.head_sha});
                      if (file.type!=='file' || file.encoding!=='base64') throw new Error('Unavailable rights protocol');
                      definitions.set(run.head_sha,Buffer.from(file.content,'base64').toString('utf8').includes('name: Capture immutable rights event '));
                    }
                    if (!definitions.get(run.head_sha)) {
                      if (!witnessed) throw new Error('Missing admission event');
                      return {nodes,unknown};
                    }
                    const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt,
                      {owner,repo,run_id:run.id,attempt_number:run.run_attempt,per_page:100});
                    const captures=jobs.filter(job=>/^Capture immutable rights event (pull|issue)$/.test(job.name));
                    if (captures.length===1 && captures[0].name.endsWith(' issue')) continue;
                    const journals=jobs.filter(job=>job.name.startsWith('Rights ledger '));
                    const parsed=journals.map(job=>({job,tag:job.name.match(/^Rights ledger (none|[0-9a-f]{40}(?:,[0-9a-f]{40})?) comment (\d+)$/)}));
                    if (captures.length!==1 || captures[0].status!=='completed' || captures[0].conclusion!=='success' ||
                        parsed.length!==1 || !parsed[0].tag) unknown.push(run.id);
                    else if (parsed[0].tag[1]!=='none') nodes.push({run:run.id,attempt:run.run_attempt,
                      comment:Number(parsed[0].tag[2]),heads:parsed[0].tag[1].split(','),
                      complete:parsed[0].job.status==='completed' && parsed[0].job.conclusion==='success'});
                  }
                  if (run.run_number===1) {
                    if (!witnessed) throw new Error('Missing admission event');
                    return {nodes,unknown};
                  }
                }
              }
              throw new Error('Rights protocol history unavailable');
            };
            const index=await ledgerIndex(), rights={}, commentsById=new Map();
            const targetLedger=async head=>{
              if (rights[head]) return;
              const {data:commit}=await github.rest.repos.getCommit({owner,repo,ref:head}), tree=commit.commit.tree.sha;
              if (!/^[0-9a-f]{40}$/.test(tree)) throw new Error('Invalid rights target tree');
              const nodes=index.nodes.filter(node=>node.heads.includes(head)), pending=[...index.unknown], entries=[];
              const statuses=await github.paginate(github.rest.repos.listCommitStatusesForRef,{owner,repo,ref:head,per_page:100});
              const recorded=new Set();
              for (const status of statuses) {
                const contextKey=status.context.toLowerCase();
                if (!contextKey.startsWith('rights-ledger/') || status.creator?.login!=='github-actions[bot]') continue;
                const tag=contextKey.match(/^rights-ledger\/([0-9a-f]{40})\/(\d+)\/(\d+)$/);
                if (!tag || tag[1]!==tree || status.state!=='success') throw new Error('Wrong rights receipt target');
                const row=JSON.parse(status.description), node=nodes.find(node=>node.run===row.r && node.comment===row.c);
                if (row.v!==1 || !node || row.r!==Number(tag[2]) || row.a!==Number(tag[3]) ||
                    !['ack','revoke','withdraw','ignore'].includes(row.k)) throw new Error('Unbound rights receipt');
                recorded.add(`${row.r}/${row.a}`);
                let comment=null;
                if (row.k==='ack') {
                  if (!commentsById.has(row.c)) commentsById.set(row.c,await github.rest.issues.getComment({owner,repo,comment_id:row.c})
                    .then(({data})=>data,error=>{if (error.status===404) return null; throw error;}));
                  const live=commentsById.get(row.c);
                  if (live?.user) comment={id:live.id,user:live.user.login,body:live.body,created_at:live.created_at,
                    updated_at:live.updated_at,permission:await permission(live.user.login)};
                }
                entries.push({id:status.id,run_id:row.r,attempt:row.a,comment_id:row.c,kind:row.k,
                  created_at:row.t,recorded_at:status.created_at,comment});
              }
              for (const node of nodes) if (!node.complete || !recorded.has(`${node.run}/${node.attempt}`)) pending.push(node.run);
              rights[head]={[tree]:{head_sha:head,tree_sha:tree,pending:[...new Set(pending)],entries}};
            };
            const pr={number:Number('${{ steps.pr.outputs.number }}'),base:{sha:'${{ steps.pr.outputs.base_sha }}'},
              head:{sha:'${{ steps.pr.outputs.head_sha }}',repo:{full_name:'${{ steps.pr.outputs.head_repository }}'}}};
            await targetLedger(pr.head.sha);
            const comments=[];
            for (const comment of await github.paginate(github.rest.issues.listComments,{owner,repo,issue_number:pr.number,per_page:100})) {
              if (!comment.user || !(comment.body||'').trim().startsWith('/approve-gates')) continue;
              comments.push({user:comment.user.login,body:comment.body,created_at:comment.created_at,
                updated_at:comment.updated_at,permission:await permission(comment.user.login)});
            }
            require('fs').writeFileSync(evidencePath,JSON.stringify({repository:`${owner}/${repo}`,
              head_repository:pr.head.repo.full_name||null,head_sha:pr.head.sha,base_sha:pr.base.sha,comments,rights}));
      - name: Validate candidate as data with base-owned policy
        run: python3 trusted/scripts/ci/validate-runner-policy.py --root candidate --maintainer-evidence "$RUNNER_TEMP/maintainer-approval.json" --rights-evidence "$RUNNER_TEMP/maintainer-approval.json" --head "${{ steps.pr.outputs.head_sha }}" --repository "${{ github.repository }}"
      - name: Report trusted policy on the exact PR head
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            // If resolution failed there is no validated head: look it up again so
            // the failure still replaces any earlier success on that head.
            let sha = '${{ steps.pr.outputs.head_sha }}';
            if (!sha) {
              const number = context.payload.pull_request ? context.payload.pull_request.number : context.payload.issue.number;
              sha = (await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: number })).data.head.sha;
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'trusted-policy',
              description: 'Base-owned policy over candidate data',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      # A pull request whose head fails trusted-policy (for example after its
      # approval is revoked) leaves the merge queue, so no queued group built
      # from it lands on an earlier success. Inside this job, the per-PR
      # concurrency group orders it with every newer verdict; a superseded
      # (cancelled) run never dequeues.
      - name: Remove a failing pull request from the merge queue
        if: failure() && steps.pr.outputs.head_sha != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const { owner, repo } = context.repo;
            const number = Number('${{ steps.pr.outputs.number }}');
            const { repository } = await github.graphql(
              'query($owner: String!, $repo: String!, $number: Int!) { repository(owner: $owner, name: $repo) { pullRequest(number: $number) { id headRefOid mergeQueueEntry { id } } } }',
              { owner, repo, number });
            const pr = repository.pullRequest;
            // A newer head gets its own run, which decides for it.
            if (!pr.mergeQueueEntry || pr.headRefOid !== '${{ steps.pr.outputs.head_sha }}') return;
            await github.graphql('mutation($id: ID!) { dequeuePullRequest(input: { id: $id }) { clientMutationId } }', { id: pr.id });
            core.notice(`Removed #${number} from the merge queue: trusted-policy failed on its head.`);
