name: CLA Assistant
on:
  # The CLA action reads comments and PR metadata only; it never checks out PR code.
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, reopened, synchronize, closed]
permissions: {}
jobs:
  cla:
    # Only a signature or `recheck` comment takes a runner; bot review comments
    # on a pull request would otherwise each queue a run that does nothing.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request != null &&
      (github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the Norn CLA v1 and agree to its applicable individual and corporate terms.'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write # Run the pinned CLA action with its documented Actions grant.
      contents: write # Write signatures to the dedicated CLA branch.
      pull-requests: write # Post and maintain signature comments on pull requests.
      statuses: write # Publish the CLA status.
    steps:
      - name: Record contributor agreement
        # Archived upstream; pinned to a reviewed commit until a maintained replacement is chosen.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # zizmor: ignore[archived-uses]
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          path-to-signatures: signatures/cla-v1.json
          path-to-document: https://github.com/Norn-cloud/norn/blob/main/CONTRIBUTING.md#contributor-licence-agreement--version-1
          branch: cla-signatures
          custom-pr-sign-comment: I have read the Norn CLA v1 and agree to its applicable individual and corporate terms.
          # The copyright holder does not sign their own CLA, and bots cannot sign.
          allowlist: Youssef-Tarek-Ali-26,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
