name: IVM reference oracle
on:
  pull_request:
    paths:
      - 'tools/ivm-reference-oracle/**'
      - 'crates/**'
      - 'vendor/zen/**'
      - 'fixtures/**'
      - 'Cargo.toml'
      - 'deny.toml'
      - '.github/workflows/ivm-reference-oracle.yml'
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt
      - run: cargo fmt --manifest-path tools/ivm-reference-oracle/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path tools/ivm-reference-oracle/Cargo.toml
      - run: cargo install --locked cargo-deny --version 0.19.0
      - run: cargo deny --locked --manifest-path tools/ivm-reference-oracle/Cargo.toml check licenses --config deny.toml
