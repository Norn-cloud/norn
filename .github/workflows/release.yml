name: Release
# Norn's alpha release (#521, D97). Started by hand only. By default it is a dry
# run: it builds the GitHub pre-release and the npm packages from the
# dispatched commit, verifies them, and uploads them as a workflow artifact.
# Nothing becomes public.
#
# Publishing is a separate job behind the `release` environment, which an
# admin protects with required reviewers and a main-only branch rule. It runs
# only when the dispatch asks for it, from main, with the version typed back,
# and after a reviewer approves the deployment. The build job refuses a
# publish request if the environment does not have those protections, so the
# publish job cannot run unprotected. Publishing:
#   - re-verifies the built files against this commit (scripts/release/assemble.py),
#   - attests every published file to this workflow run and commit,
#   - creates the GitHub pre-release v<version> with the tag at this commit,
#   - with `github-and-npm`, publishes the npm packages under the `alpha`
#     dist-tag through npm trusted publishing (OIDC; no npm token exists).
# The owner's procedure is in docs/authoring/release.md.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "none: dry run, nothing public. github: also the GitHub pre-release. github-and-npm: also the npm packages."
        type: choice
        options:
          - none
          - github
          - github-and-npm
        default: none
      confirm-version:
        description: "To publish: the exact version in tools/norn-ts/package.json (for example 0.1.0-alpha.1). Not used by a dry run."
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      # Read the `release` environment's protection rules before a publish.
      actions: read
    outputs:
      version: ${{ steps.request.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Read the version and check a publish request
        id: request
        env:
          PUBLISH: ${{ inputs.publish }}
          CONFIRM: ${{ inputs.confirm-version }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("tools/norn-ts/package.json"))["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release $version from $(git rev-parse HEAD); publish: $PUBLISH" >> "$GITHUB_STEP_SUMMARY"
          [ "$PUBLISH" = none ] && exit 0
          [ "$REF" = refs/heads/main ] || { echo "::error::a release is published only from main, not $REF"; exit 1; }
          [ "$CONFIRM" = "$version" ] || { echo "::error::confirm-version '$CONFIRM' is not the version in tools/norn-ts/package.json ($version)"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version is already tagged; bump the version in tools/norn-ts/package.json"; exit 1
          fi
          gh api "repos/$REPOSITORY/environments/release" > "$RUNNER_TEMP/environment.json" \
            || { echo "::error::the release environment does not exist or cannot be read; an admin creates it with required reviewers and a main-only branch rule"; exit 1; }
          python3 - "$RUNNER_TEMP/environment.json" <<'PY'
          import json, sys
          environment = json.load(open(sys.argv[1]))
          rules = environment.get("protection_rules") or []
          reviewers = [r for rule in rules if rule.get("type") == "required_reviewers" for r in rule.get("reviewers") or []]
          branches = environment.get("deployment_branch_policy")
          if not reviewers or not branches:
              sys.exit("::error::the release environment must have required reviewers and a deployment branch rule; publishing would run unapproved")
          print(f"release environment: {len(reviewers)} required reviewer(s), branch policy {branches}")
          PY
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown, x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install the release tools
        run: scripts/release/tools.sh "$RUNNER_TEMP/tools" | tail -n 1 >> "$GITHUB_PATH"
      - name: Build and verify both channels
        env:
          VERSION: ${{ steps.request.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: scripts/release/build.sh dist "https://github.com/$REPOSITORY/releases/download/v$VERSION"
      - name: The packaged CLI installs and reports this release
        env:
          VERSION: ${{ steps.request.outputs.version }}
        run: |
          set -euo pipefail
          home=$(mktemp -d)
          HOME=$home bun add --global "$PWD/dist/tarball/release/norn-cli-$VERSION.tgz"
          line=$(HOME=$home "$home/.bun/bin/norn" --version)
          echo "$line"
          # The CLI prints the commit's first 12 characters (src/build-info.ts versionLine).
          [ "$line" = "norn $VERSION ($(git rev-parse HEAD | cut -c1-12))" ]
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat dist/tarball/release/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          # The expanded packages too: the publish job verifies them against this commit again.
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: ${{ inputs.publish != 'none' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      # The tag and the pre-release.
      contents: write
      # Attestations, and npm trusted publishing's OIDC token.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Verify the files against this commit before anything is public
        env:
          VERSION: ${{ needs.build.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for channel in tarball registry; do
            # The same inputs scripts/release/build.sh builds with.
            inputs=(--channel "$channel" --toolchain 1.98.0 --platforms linux-x64,linux-arm64)
            if [ "$channel" = tarball ]; then inputs+=(--base-url "https://github.com/$REPOSITORY/releases/download/v$VERSION"); fi
            # The release's facts come from this run's own inputs; the artifact's manifest is checked against them.
            python3 scripts/release/assemble.py verify --commit "$GITHUB_SHA" "${inputs[@]}" --out "dist/$channel"
            (cd "dist/$channel/release" && sha256sum -c SHA256SUMS)
            grep -q "\"version\": \"$VERSION\"" "dist/$channel/release/manifest.json"
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/tarball/release/*
            dist/registry/release/*.tgz
      - name: Create the GitHub pre-release
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          Norn $VERSION, an alpha built from $GITHUB_SHA by this repository's release workflow.

          Before installing, check what you downloaded:

              sha256sum --ignore-missing -c SHA256SUMS
              gh attestation verify norn-cli-$VERSION.tgz --repo $REPOSITORY

          Then follow docs/authoring/tutorial.md. The dev hosts are Linux only; on macOS, build the host from this commit.
          NOTES
          gh release create "v$VERSION" dist/tarball/release/* --repo "$REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Norn $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ inputs.publish == 'github-and-npm' }}
        with:
          node-version: 24.22.2
          registry-url: https://registry.npmjs.org
      - name: Publish the npm packages (trusted publishing)
        if: ${{ inputs.publish == 'github-and-npm' }}
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          # Trusted publishing needs npm 11.5.1 or later (Node 24.22.2 ships 11.19.1).
          npm --version | python3 -c 'import sys; v = tuple(map(int, sys.stdin.read().split(".")[:3])); sys.exit(v < (11, 5, 1))'
          cd dist/registry/release
          # Hosts first, then the types, then the CLI that depends on both.
          for tarball in norn-dev-host-*-"$VERSION".tgz "norn-authoring-$VERSION.tgz" "norn-cli-$VERSION.tgz"; do
            npm publish "./$tarball" --tag alpha --access public
          done
