# Throwaway Boat CI pilot (never merged): measures starts per job, warm reuse
# across shards inside one job, wall time and cost on `runs-on: boat`.
name: Boat pilot
on:
  push:
    branches: ['boat-pilot/**']
permissions:
  contents: read
jobs:
  bundle:
    runs-on: boat
    timeout-minutes: 120
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - run: nproc; free -g; df -h /; uname -a; cat /etc/os-release | head -3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: nextest@0.9.150
      - name: heavy-2 (cold)
        run: time bash scripts/ci/core.sh test heavy-2
      - name: heavy-3 (same VM, warm target)
        run: time bash scripts/ci/core.sh test heavy-3
      - name: rest-1 (same VM, warm target)
        run: time bash scripts/ci/core.sh test rest-1
      - name: clippy (same VM)
        run: time bash scripts/ci/core.sh clippy
      - run: sccache --show-stats || true; df -h /
  probe:
    runs-on: boat
    timeout-minutes: 10
    steps:
      - run: nproc; free -g; df -h /; hostname
