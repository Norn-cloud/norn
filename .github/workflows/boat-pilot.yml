# Throwaway Boat CI pilot (never merged): measures starts per job, warm reuse
# across shards inside one job, wall time and cost on `runs-on: boat`.
name: CI cut exact-head validation
on:
  push:
    branches: ['boat-pilot/ci-cut-validation']
permissions:
  contents: read
jobs:
  bundle:
    runs-on: boat
    timeout-minutes: 120
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      NORN_INTEROP_CACHE: ~/.cache/norn-interop
      NORN_CI_BASE: 2859d63d435a89ce82dc3902d24924c0882e95a8
    steps:
      - run: nproc; free -g; df -h /; uname -a; cat /etc/os-release | head -3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 86db02a0a9c850f5df8ac3bc3bab3680de24c5c9
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: nextest@0.9.150
      - name: Qualify the exact six-hour cut head
        run: |
          set -euo pipefail
          export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH"
          test "$(git rev-parse HEAD)" = 86db02a0a9c850f5df8ac3bc3bab3680de24c5c9
          timed() { start=$SECONDS; bash scripts/ci/core.sh "$@"; echo "::notice::task=$* seconds=$((SECONDS-start))"; }
          timed cheap
          plan=$(bash scripts/ci/core.sh plan --affected "$NORN_CI_BASE" HEAD)
          echo "$plan"
          test "$(jq -r .mode <<<"$plan")" = full
          export NORN_CI_PACKAGES="$(jq -r .packages <<<"$plan")"
          export NORN_CI_REST_SHARDS="$(jq -r .rest_shards <<<"$plan")"
          while read -r shard; do timed test "$shard"; done < <(jq -r '.shard[]' <<<"$plan")
          while read -r phase; do timed "$phase"; done < <(jq -r '.phase[]' <<<"$plan")
          git rev-parse HEAD
          git status --short
          sccache --show-stats || true
