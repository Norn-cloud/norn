          df -h /
          docker system prune --all --force
          rustup toolchain uninstall stable nightly-2025-03-01
          df -h /
          [ "$(available)" -ge "$minimum" ] || { echo "Insufficient Boat runner space: need 40 GiB free"; df -Pk /; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 6c84ba382774c0c0ce01f0ec5b6489718037f70a
          persist-credentials: false
          fetch-depth: 0
      # Boat allocates a different runner directory for each job. The Rust cache
      # hashes the absolute compiler working directory, so compile through the seed path.
