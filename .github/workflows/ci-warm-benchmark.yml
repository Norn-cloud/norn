name: Boat warm snapshot benchmark
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  core:
    # Boat: merge groups, and same-repository pull requests whose author, actor and
    # re-runner are all Boat CI's public-repository user (`boat ci public`). Every
    # other job, fork, bot or user runs hosted, never queued on Boat.
    if: github.event_name != 'pull_request_target' && github.event_name != 'issue_comment'
    # The writable cache key is an environment secret of `ci-cache-writer-boat` (deployment
    # branch: main only). Merge groups and pull requests see only the read-only repository key.
    # A main push enters the environment exactly when the runner's main-push arm sends it to Boat
    # (#1369): made and started by the merge queue, with NORN_MAIN_RUNNER set. A human re-run or
    # push runs hosted, uses the Actions cache and never receives the key.
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'github-merge-queue[bot]' && github.triggering_actor == 'github-merge-queue[bot]' && vars.NORN_MAIN_RUNNER == 'boat' && 'ci-cache-writer-boat' || '' }}
    env:
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      NORN_INTEROP_CACHE: ~/.cache/norn-interop
    runs-on: ${{ ((github.event_name == 'merge_group' && vars.NORN_MERGE_RUNNER == 'boat') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'Youssef-Tarek-Ali-26' && github.actor == 'Youssef-Tarek-Ali-26' && github.triggering_actor == 'Youssef-Tarek-Ali-26' && vars.NORN_PR_RUNNER == 'boat') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'github-merge-queue[bot]' && github.triggering_actor == 'github-merge-queue[bot]' && vars.NORN_MAIN_RUNNER == 'boat')) && 'boat/from=norn-ci-warm' || 'ubuntu-24.04' }}
    timeout-minutes: 110
    # The gate plan is computed on the core VM, not a VM of its own: each Boat job is one
    # sandbox start, and the plan takes seconds. Bundles read it from here.
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Reclaim runner disk space
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          set -euo pipefail
          minimum=$((12 * 1024 * 1024))
          available() { df -Pk / | awk 'NR == 2 {print $4}'; }
          df -h /
          if [ "$(available)" -lt "$minimum" ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          fi
          df -h /
          [ "$(available)" -ge "$minimum" ] || { echo "Insufficient runner space: need 12 GiB free"; df -Pk /; exit 1; }
      - name: Reclaim Boat runner disk space
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          set -euo pipefail
          minimum=$((40 * 1024 * 1024))
          available() { df -Pk / | awk 'NR == 2 {print $4}'; }
          df -h /
          docker system prune --all --force
          rustup toolchain uninstall stable nightly-2025-03-01
          df -h /
          [ "$(available)" -ge "$minimum" ] || { echo "Insufficient Boat runner space: need 40 GiB free"; df -Pk /; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 6c84ba382774c0c0ce01f0ec5b6489718037f70a
          persist-credentials: false
          fetch-depth: 0
      # Boat allocates a different runner directory for each job. The Rust cache
      # hashes the absolute compiler working directory, so compile through the seed path.
      - name: Mount checkout at the compiler seed path
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          set -euo pipefail
          workspace=/home/user/actions-runner/_work/norn/norn
          if [[ "$GITHUB_WORKSPACE" != "$workspace" ]]; then
            sudo mkdir -p -- "$workspace"
            sudo mount --bind -- "$GITHUB_WORKSPACE" "$workspace"
          fi
      # A same-repository pull request runs on Boat only while NORN_PR_RUNNER is
      # 'boat'; otherwise it falls back to hosted runners, which must never go
      # unnoticed. Fork pull requests run hosted by design and stay quiet.
      - name: Warn that pull request CI fell back to hosted runners
        if: ${{ runner.environment == 'github-hosted' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.NORN_PR_RUNNER != 'boat' }}
        run: |
          echo "::warning title=PR CI on hosted runners::PR CI is running on hosted runners: the repository variable NORN_PR_RUNNER is not 'boat', so this same-repository pull request fell back from Boat."
      # Boat's managed base image ships only the versioned libclang-18.so.18, which
      # clang-sys (bindgen) rejects; it loads the unversioned libclang.so that hosted
      # ubuntu-24.04 already has. Install it once per VM, or link it, then require it.
      - name: Make libclang loadable on Boat runners
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          set -euo pipefail
          libclang_dev_version='1:18.1.3-1ubuntu1'
          library=/usr/lib/llvm-18/lib/libclang.so
          if [ -e "$library" ]; then
            echo "$library is already present"
          elif ! { timeout 120 sudo apt-get update -qq && timeout 300 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "libclang-18-dev=$libclang_dev_version"; }; then
            echo "::warning::could not install libclang-18-dev=$libclang_dev_version; linking the image's libclang-18.so.18"
            sudo ln -sfn libclang-18.so.18 "$library"
          fi
          ls -l "$library" && [ -e "$library" ] || { echo "::error::$library is missing: clang-sys cannot load libclang"; exit 1; }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      # Compiler outputs (sccache on the Actions cache: runs read the scopes of
      # their own ref, its base and main, and write only their own), the Cargo
      # home with registry and installed tools (saved only by main) and Bun's
      # package store.
      # The action's post-job `--show-stats` fails the job when the stats request fails,
      # even after a build that succeeded through the plain-rustc fallback; skip it.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
          disable_annotations: true
      - name: Start sccache or compile without it
        env:
          NORN_SCCACHE_BUCKET: ${{ secrets.NORN_SCCACHE_BUCKET }}
          NORN_SCCACHE_ENDPOINT: ${{ secrets.NORN_SCCACHE_ENDPOINT }}
          NORN_SCCACHE_KEY_ID: ${{ secrets.NORN_SCCACHE_KEY_ID }}
          NORN_SCCACHE_SECRET: ${{ secrets.NORN_SCCACHE_SECRET }}
        # Writes only constants this step computes (true/false, a path under RUNNER_TEMP).
        run: | # zizmor: ignore[github-env]
          set -uo pipefail
          # Hosted runners share the GitHub Actions cache. A disposable Boat VM never uses it (its
          # egress limit is account-wide): it keeps a local cache bounded by SCCACHE_CACHE_SIZE and,
          # when the project bucket's secrets are present, reads a shared R2 cache behind it. Only a
          # push to main (code that has landed) writes there. Merge groups and pull requests run code
          # that has not landed, so they get the read-only key and READ_ONLY mode. The keys are in
          # this step's environment and in the server it starts, which later steps share a user
          # with: what stops a write is the token's scope, not this step.
          gha=false
          [ "$RUNNER_ENVIRONMENT" != github-hosted ] || gha=true
          export SCCACHE_DIR="$HOME/norn-ci-sccache"
          echo "SCCACHE_DIR=$SCCACHE_DIR" >> "$GITHUB_ENV"
          export SCCACHE_GHA_ENABLED=$gha
          echo "SCCACHE_GHA_ENABLED=$gha" >> "$GITHUB_ENV"
          if [ "$gha" = false ] && [ -n "${NORN_SCCACHE_BUCKET:-}" ] && [ -n "${NORN_SCCACHE_ENDPOINT:-}" ]; then
            mode=READ_ONLY
            case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
              push:refs/heads/main) mode=READ_WRITE ;;
            esac
            export SCCACHE_MULTILEVEL_CHAIN=disk,s3 SCCACHE_BUCKET="$NORN_SCCACHE_BUCKET" \
              SCCACHE_ENDPOINT="$NORN_SCCACHE_ENDPOINT" SCCACHE_REGION=auto SCCACHE_S3_KEY_PREFIX=norn/ \
              SCCACHE_S3_RW_MODE=$mode AWS_ACCESS_KEY_ID="${NORN_SCCACHE_KEY_ID:-}" \
              AWS_SECRET_ACCESS_KEY="${NORN_SCCACHE_SECRET:-}" SCCACHE_IDLE_TIMEOUT=0
            # The server must outlive idle stretches (tests, Bun): an idle exit would restart it
            # without this configuration, on the local cache only.
            echo "::notice::sccache: local disk, then the shared R2 cache ($mode)"
          fi
          # A cache outage must never fail a build. cargo runs `<wrapper> <rustc> <args>`: when
          # sccache itself fails (it reports `sccache: error: ...`, e.g. a dead server that
          # cannot restart), compile again with plain rustc. A compiler failure keeps its exit
          # status and diagnostics, also after a `sccache: warning:` (a local compile).
          wrapper="$RUNNER_TEMP/sccache-rustc"
          cat > "$wrapper" <<'WRAPPER'
          #!/usr/bin/env bash
          log=$(mktemp) || exec "$@"
          sccache "$@" 2> "$log"
          status=$?
          if [ "$status" -ne 0 ] && grep -q '^sccache: error: ' "$log"; then
            echo "::warning::sccache failed ($(grep -m1 '^sccache: error: ' "$log")); compiling with plain rustc" >&2
            rm -f "$log"
            exec "$@"
          fi
          cat "$log" >&2
          rm -f "$log"
          exit "$status"
          WRAPPER
          chmod +x "$wrapper"
          if sccache --start-server; then
            echo "RUSTC_WRAPPER=$wrapper" >> "$GITHUB_ENV"
          else
            echo "::warning::sccache server unavailable; compiling with plain rustc"
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: false
          shared-key: cargo-registry
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('tools/norn-ts/bun.lock', 'packages/norn-sdk/bun.lock', 'packages/norn-demo-ui/bun.lock') }}
      # Pinned interop schemas; erpnext_runtime.py re-checks every digest.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/norn-interop
          key: norn-interop-${{ hashFiles('scripts/importers/erpnext-runtime.lock.json') }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: nextest@0.9.150,cargo-deny@0.19.0,wasm-bindgen@0.2.129
      # The full gate is `core.sh all` split into parallel bundle jobs. The plan comes from
      # core.sh itself, so CI runs exactly its shards and phases (all but formal).
      # Pull requests use affected plans; merge groups and main run the full set.
      - id: plan
        env:
          BASE: ''
          HEAD_SHA: 6c84ba382774c0c0ce01f0ec5b6489718037f70a
        run: |
          if [ -n "$BASE" ]; then plan=$(bash scripts/ci/core.sh plan --affected "$BASE" "$HEAD_SHA"); else plan=$(bash scripts/ci/core.sh plan); fi
          plan=$(jq -c --arg base "$BASE" --arg head "$HEAD_SHA" '. + {base_sha: $base, head_sha: $head}' <<<"$plan")
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
          echo "$plan"
      - run: |
          if [[ "$RUNNER_ENVIRONMENT" == self-hosted ]]; then
            # Keep Bun's working directory and discovery order out of the Rust path experiment.
            cargo() (
              workspace=/home/user/actions-runner/_work/norn/norn
              cd "$workspace${PWD#"$GITHUB_WORKSPACE"}"
              unset CARGO_HOME
              export CARGO_TARGET_DIR="$workspace/target"
              command cargo "$@"
            )
            export -f cargo
          fi
          bash scripts/ci/core.sh cheap
      - name: Show compiler cache stats
        if: always()
        run: sccache --show-stats || true
  test:
    name: bundle (${{ matrix.bundle.id }})
    needs: [core]
    if: always() && !cancelled() && needs.core.outputs.plan != '' && fromJSON(needs.core.outputs.plan).bundle[0] != null
    # The writable cache key is an environment secret of `ci-cache-writer-boat` (deployment
    # branch: main only). Merge groups and pull requests see only the read-only repository key.
    # A main push enters the environment exactly when the runner's main-push arm sends it to Boat
    # (#1369): made and started by the merge queue, with NORN_MAIN_RUNNER set. A human re-run or
    # push runs hosted, uses the Actions cache and never receives the key.
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'github-merge-queue[bot]' && github.triggering_actor == 'github-merge-queue[bot]' && vars.NORN_MAIN_RUNNER == 'boat' && 'ci-cache-writer-boat' || '' }}
    env:
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      NORN_INTEROP_CACHE: ~/.cache/norn-interop
      NORN_CI_PACKAGES: ${{ fromJSON(needs.core.outputs.plan).packages }}
      NORN_CI_REST_SHARDS: ${{ fromJSON(needs.core.outputs.plan).rest_shards }}
      NORN_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || 'origin/main' }}
      PLAN: ${{ needs.core.outputs.plan }}
      BUNDLE_ID: ${{ matrix.bundle.id }}
    runs-on: ${{ ((github.event_name == 'merge_group' && vars.NORN_MERGE_RUNNER == 'boat') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'Youssef-Tarek-Ali-26' && github.actor == 'Youssef-Tarek-Ali-26' && github.triggering_actor == 'Youssef-Tarek-Ali-26' && vars.NORN_PR_RUNNER == 'boat') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'github-merge-queue[bot]' && github.triggering_actor == 'github-merge-queue[bot]' && vars.NORN_MAIN_RUNNER == 'boat')) && 'boat/from=norn-ci-warm' || 'ubuntu-24.04' }}
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        bundle: ${{ fromJSON(needs.core.outputs.plan).bundle }}
    steps:
      - name: Reclaim runner disk space
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          set -euo pipefail
          minimum=$((12 * 1024 * 1024))
          available() { df -Pk / | awk 'NR == 2 {print $4}'; }
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
          [ "$(available)" -ge "$minimum" ] || { echo "Insufficient runner space: need 12 GiB free"; df -Pk /; exit 1; }
