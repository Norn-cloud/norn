name: Boat exact-source bundle qualification
on:
  push:
    branches: [boat-pilot/bundle-final]
permissions:
  contents: read
jobs:
  core:
    if: github.event_name != 'pull_request_target' && github.event_name != 'issue_comment'
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      NORN_INTEROP_CACHE: ~/.cache/norn-interop
    runs-on: boat
    timeout-minutes: 110
    steps:
      - name: Reclaim runner disk space
        if: ${{ !(github.event_name == 'merge_group' && runner.environment == 'self-hosted') }}
        run: |
          set -euo pipefail
          minimum=$((12 * 1024 * 1024))
          available() { df -Pk / | awk 'NR == 2 {print $4}'; }
          df -h /
          if [ "$(available)" -lt "$minimum" ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          fi
          df -h /
          [ "$(available)" -ge "$minimum" ] || { echo "Insufficient runner space: need 12 GiB free"; df -Pk /; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ca9455032acd96026d7f57c02ec1efd41f0b2bbe
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      # Compiler outputs (sccache on the Actions cache: runs read the scopes of
      # their own ref, its base and main, and write only their own), the Cargo
      # home with registry and installed tools (saved only by main) and Bun's
      # package store.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: false
          shared-key: cargo-registry
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('tools/norn-ts/bun.lock', 'packages/norn-sdk/bun.lock', 'packages/norn-demo-ui/bun.lock') }}
      # Pinned interop schemas; erpnext_runtime.py re-checks every digest.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/norn-interop
          key: norn-interop-${{ hashFiles('scripts/importers/erpnext-runtime.lock.json') }}
      - name: Exact-head core and guard
        run: |
          test "$(git rev-parse HEAD)" = "ca9455032acd96026d7f57c02ec1efd41f0b2bbe"
          bash scripts/ci/core.sh cheap
          python3 -c 'import runpy; runpy.run_path("verification/coverage-v1/negative_canaries.py")["workflow_canaries"]()'
          cargo test --locked -p norn-skeleton-guard
  # The full gate: `core.sh all` split into parallel jobs. The plan comes from
  # core.sh itself, so CI runs exactly its shards and phases (all but formal).
  # Pull requests and merge groups use affected plans; main runs the full set.
  plan:
    if: github.event_name != 'pull_request_target' && github.event_name != 'issue_comment' && !(github.event_name == 'pull_request' && github.event.pull_request.draft)
    runs-on: boat
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ca9455032acd96026d7f57c02ec1efd41f0b2bbe
          persist-credentials: false
          fetch-depth: 0
      - id: plan
        env:
          BASE: 50635a08f81fa488c1da8a3504cefa865839b456
          HEAD_SHA: ca9455032acd96026d7f57c02ec1efd41f0b2bbe
        run: |
          plan=$(bash scripts/ci/core.sh plan)
          plan=$(jq -c --arg base "$BASE" --arg head "$HEAD_SHA" '. + {base_sha: $base, head_sha: $head}' <<<"$plan")
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
          echo "$plan"
  test:
    name: bundle (${{ matrix.bundle.id }})
    needs: [core, plan]
    if: fromJSON(needs.plan.outputs.plan).bundle[0] != null
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      NORN_INTEROP_CACHE: ~/.cache/norn-interop
      NORN_CI_PACKAGES: ${{ fromJSON(needs.plan.outputs.plan).packages }}
      NORN_CI_REST_SHARDS: ${{ fromJSON(needs.plan.outputs.plan).rest_shards }}
      NORN_CI_BASE: 50635a08f81fa488c1da8a3504cefa865839b456
      PLAN: ${{ needs.plan.outputs.plan }}
      BUNDLE_ID: ${{ matrix.bundle.id }}
    runs-on: boat
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        bundle: ${{ fromJSON(needs.plan.outputs.plan).bundle }}
    steps:
      - name: Reclaim runner disk space
        if: ${{ !(github.event_name == 'merge_group' && runner.environment == 'self-hosted') }}
        run: |
          set -euo pipefail
          minimum=$((12 * 1024 * 1024))
          available() { df -Pk / | awk 'NR == 2 {print $4}'; }
          df -h /
          if [ "$(available)" -lt "$minimum" ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          fi
          df -h /
          [ "$(available)" -ge "$minimum" ] || { echo "Insufficient runner space: need 12 GiB free"; df -Pk /; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ca9455032acd96026d7f57c02ec1efd41f0b2bbe
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      # Compiler outputs (sccache on the Actions cache: runs read the scopes of
      # their own ref, its base and main, and write only their own), the Cargo
      # home with registry and installed tools (saved only by main) and Bun's
      # package store.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: false
          shared-key: cargo-registry
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('tools/norn-ts/bun.lock', 'packages/norn-sdk/bun.lock', 'packages/norn-demo-ui/bun.lock') }}
      # Pinned interop schemas; erpnext_runtime.py re-checks every digest.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/norn-interop
          key: norn-interop-${{ hashFiles('scripts/importers/erpnext-runtime.lock.json') }}
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: nextest@0.9.150
      - name: Run exact-head bundle
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ca9455032acd96026d7f57c02ec1efd41f0b2bbe"
          bash scripts/ci/core.sh bundle "$PLAN" "$BUNDLE_ID"
          git diff --exit-code
          df -h /
